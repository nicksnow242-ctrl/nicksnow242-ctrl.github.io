<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eldritch Cave — Old Flash Style</title>

  <style>
    :root {
      --ink: #000;
      --line: clamp(2px, 0.35vmin, 5px);
      --line-fat: clamp(3px, 0.65vmin, 8px);

      --aqua: #2df5dd;
      --green: #7dff55;
      --purple: #bb6bff;
      --orange: #ff9d33;

      --portal-a: #4dffe8;
      --portal-b: #c778ff;

      --rock-light: #3d4a6d;
      --rock-mid: #232b42;
      --rock-dark: #151a29;
      --bone: #e7dfc7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      background: #070a14;
      color: #d6e5e1;
      font-family: "Trebuchet MS", "Segoe UI", Verdana, Arial, sans-serif;
    }

    .content {
      position: relative;
      z-index: 10;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .content h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 3.5rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        3px 3px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        0 0 18px rgba(90, 255, 235, 0.35),
        0 0 34px rgba(180, 100, 255, 0.22);
    }

    /* =====================================================
       CAVE WRAPPER
       ===================================================== */

    .cave {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      isolation: isolate;
    }

    .cave > div {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* =====================================================
       FLASH-STYLE OUTLINE
       This gives clipped vector shapes a chunky black edge.
       ===================================================== */

    .floor::before,
    .stairs,
    .pedestal,
    .rocks-top,
    .rocks-bottom,
    .rocks-left,
    .rocks-right,
    .bone {
      filter:
        drop-shadow(var(--line) 0 0 var(--ink))
        drop-shadow(calc(-1 * var(--line)) 0 0 var(--ink))
        drop-shadow(0 var(--line) 0 var(--ink))
        drop-shadow(0 calc(-1 * var(--line)) 0 var(--ink));
    }

    /* =====================================================
       1. BACKGROUND
       ===================================================== */

    .bg {
      z-index: 0;
      background:
        radial-gradient(
          circle at 50% 24%,
          #2b3757 0 28%,
          #171e33 28% 56%,
          #090c16 56% 100%
        ),
        linear-gradient(to bottom, #0c111d, #05070d);
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 50% 64%,
          rgba(77, 255, 232, 0.16) 0 16%,
          transparent 17%
        ),
        radial-gradient(
          circle at 50% 64%,
          rgba(199, 120, 255, 0.1) 17% 28%,
          transparent 29%
        ),
        radial-gradient(
          circle at 18% 78%,
          rgba(125, 255, 85, 0.07) 0 12%,
          transparent 13%
        ),
        radial-gradient(
          circle at 82% 76%,
          rgba(255, 157, 51, 0.07) 0 12%,
          transparent 13%
        );

      opacity: 0.9;
      animation: bgPulse 3.5s steps(2, end) infinite;
    }

    /* =====================================================
       2. EYES
       ===================================================== */

    .eyes {
      z-index: 1;
      mix-blend-mode: screen;
      opacity: 0.95;
    }

    .eyes::before,
    .eyes::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 0.46rem;
      height: 0.22rem;
      border-radius: 50%;
      background: transparent;
      filter:
        drop-shadow(0 0 0.28rem currentColor)
        drop-shadow(0 0 0.85rem currentColor);
      animation: eyeBlink var(--speed, 7s) step-end infinite;
    }

    .eyes::after {
      animation-duration: calc(var(--speed, 7s) * 1.4);
      animation-delay: calc(var(--delay, -2s) - 1.7s);
    }

    .eyes-aqua {
      color: var(--aqua);
      --speed: 6.8s;
      --delay: -1.4s;
    }

    .eyes-green {
      color: var(--green);
      --speed: 8.4s;
      --delay: -3.1s;
    }

    .eyes-purple {
      color: var(--purple);
      --speed: 7.6s;
      --delay: -0.7s;
    }

    .eyes-orange {
      color: var(--orange);
      --speed: 9.2s;
      --delay: -2.2s;
    }

    .eyes-aqua::before {
      box-shadow:
        7vw 16vh 0 0 currentColor,
        8.1vw 16vh 0 0 currentColor,
        24vw 10vh 0 0 currentColor,
        25.1vw 10.2vh 0 0 currentColor,
        65vw 13vh 0 0 currentColor,
        66.1vw 13vh 0 0 currentColor,
        86vw 22vh 0 0 currentColor,
        87vw 22.2vh 0 0 currentColor,
        44vw 7vh 0 0 currentColor,
        45vw 7.1vh 0 0 currentColor;
    }

    .eyes-aqua::after {
      box-shadow:
        14vw 30vh 0 0 currentColor,
        15vw 30vh 0 0 currentColor,
        32vw 17vh 0 0 currentColor,
        33vw 17.2vh 0 0 currentColor,
        57vw 9vh 0 0 currentColor,
        58vw 9vh 0 0 currentColor,
        77vw 18vh 0 0 currentColor,
        78vw 18.2vh 0 0 currentColor,
        91vw 12vh 0 0 currentColor,
        92vw 12.2vh 0 0 currentColor;
    }

    .eyes-green::before {
      box-shadow:
        10vw 24vh 0 0 currentColor,
        11vw 24vh 0 0 currentColor,
        19vw 8vh 0 0 currentColor,
        20vw 8.1vh 0 0 currentColor,
        37vw 12vh 0 0 currentColor,
        38vw 12vh 0 0 currentColor,
        70vw 20vh 0 0 currentColor,
        71vw 20.2vh 0 0 currentColor,
        83vw 9vh 0 0 currentColor,
        84vw 9vh 0 0 currentColor;
    }

    .eyes-green::after {
      box-shadow:
        6vw 11vh 0 0 currentColor,
        7vw 11vh 0 0 currentColor,
        28vw 25vh 0 0 currentColor,
        29vw 25.1vh 0 0 currentColor,
        51vw 6vh 0 0 currentColor,
        52vw 6.1vh 0 0 currentColor,
        62vw 27vh 0 0 currentColor,
        63vw 27vh 0 0 currentColor,
        94vw 30vh 0 0 currentColor,
        95vw 30.1vh 0 0 currentColor;
    }

    .eyes-purple::before {
      box-shadow:
        16vw 13vh 0 0 currentColor,
        17vw 13vh 0 0 currentColor,
        26vw 29vh 0 0 currentColor,
        27vw 29vh 0 0 currentColor,
        41vw 21vh 0 0 currentColor,
        42vw 21vh 0 0 currentColor,
        73vw 8vh 0 0 currentColor,
        74vw 8.1vh 0 0 currentColor,
        89vw 17vh 0 0 currentColor,
        90vw 17.1vh 0 0 currentColor;
    }

    .eyes-purple::after {
      box-shadow:
        4vw 32vh 0 0 currentColor,
        5vw 32vh 0 0 currentColor,
        34vw 7vh 0 0 currentColor,
        35vw 7vh 0 0 currentColor,
        55vw 15vh 0 0 currentColor,
        56vw 15.1vh 0 0 currentColor,
        67vw 31vh 0 0 currentColor,
        68vw 31vh 0 0 currentColor,
        81vw 28vh 0 0 currentColor,
        82vw 28.2vh 0 0 currentColor;
    }

    .eyes-orange::before {
      box-shadow:
        12vw 7vh 0 0 currentColor,
        13vw 7vh 0 0 currentColor,
        22vw 18vh 0 0 currentColor,
        23vw 18.2vh 0 0 currentColor,
        48vw 11vh 0 0 currentColor,
        49vw 11.1vh 0 0 currentColor,
        75vw 26vh 0 0 currentColor,
        76vw 26vh 0 0 currentColor,
        93vw 21vh 0 0 currentColor,
        94vw 21vh 0 0 currentColor;
    }

    .eyes-orange::after {
      box-shadow:
        8vw 28vh 0 0 currentColor,
        9vw 28vh 0 0 currentColor,
        30vw 9vh 0 0 currentColor,
        31vw 9vh 0 0 currentColor,
        58vw 22vh 0 0 currentColor,
        59vw 22.1vh 0 0 currentColor,
        69vw 6vh 0 0 currentColor,
        70vw 6.1vh 0 0 currentColor,
        87vw 33vh 0 0 currentColor,
        88vw 33vh 0 0 currentColor;
    }

    /* =====================================================
       3. FLOOR
       ===================================================== */

    .floor {
      z-index: 2;
    }

    .floor::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 24vh;

      background:
        linear-gradient(
          to top,
          #2c3752 0 14%,
          #20293e 14% 34%,
          #171e2f 34% 62%,
          #101522 62% 100%
        );

      clip-path: polygon(
        0% 100%,
        0% 56%,
        5% 63%,
        11% 47%,
        18% 59%,
        26% 45%,
        34% 60%,
        42% 49%,
        50% 58%,
        58% 47%,
        66% 61%,
        74% 46%,
        82% 58%,
        90% 47%,
        100% 59%,
        100% 100%
      );
    }

    /* =====================================================
       4. PORTAL SCENE
       ===================================================== */

    .portal-scene {
      z-index: 3;
    }

    .stairs {
      position: absolute;
      left: 50%;
      bottom: 8vh;
      width: min(46vmin, 460px);
      height: 11vmin;
      transform: translateX(-50%);

      background:
        linear-gradient(
          to top,
          #151a26 0 10%,
          #3d4a6d 10% 16%,
          #262e44 16% 40%,
          #46557a 40% 46%,
          #2c354d 46% 74%,
          #4d5d82 74% 80%,
          #303a55 80% 100%
        );

      clip-path: polygon(
        0% 100%,
        0% 72%,
        14% 72%,
        14% 46%,
        30% 46%,
        30% 22%,
        70% 22%,
        70% 46%,
        86% 46%,
        86% 72%,
        100% 72%,
        100% 100%
      );
    }

    .pedestal {
      position: absolute;
      left: 50%;
      bottom: calc(8vh + 9.5vmin);
      width: min(21vmin, 220px);
      height: 11vmin;
      transform: translateX(-50%);

      background:
        radial-gradient(
          120% 80% at 50% 0%,
          rgba(77, 255, 232, 0.12),
          transparent 36%
        ),
        linear-gradient(
          to top,
          #121722 0 12%,
          #3f4c70 12% 20%,
          #262e44 20% 65%,
          #4b5a80 65% 74%,
          #2b344e 74% 100%
        );

      clip-path: polygon(
        12% 0%,
        88% 0%,
        100% 16%,
        88% 30%,
        94% 100%,
        6% 100%,
        12% 30%,
        0% 16%
      );
    }

    .portal {
      position: absolute;
      left: 50%;
      bottom: calc(8vh + 18.5vmin);
      width: min(38vmin, 420px);
      aspect-ratio: 1;
      transform: translateX(-50%);
    }

    .portal > * {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .halo {
      inset: -14%;
      background:
        radial-gradient(
          circle,
          rgba(77, 255, 232, 0.2) 0 50%,
          rgba(199, 120, 255, 0.12) 50% 64%,
          transparent 64%
        );
      mix-blend-mode: screen;
      animation: haloPulse 2.8s steps(2, end) infinite;
    }

    .ring-outer {
      background:
        radial-gradient(
          circle,
          transparent 52%,
          #000 52% 56%,
          #155c56 56% 70%,
          #000 70% 74%,
          transparent 74%
        );
      filter: drop-shadow(0 0 4px rgba(77, 255, 232, 0.18));
    }

    .ring-inner {
      inset: 9%;
      background:
        radial-gradient(
          circle,
          transparent 54%,
          #000 54% 59%,
          #53237a 59% 73%,
          #000 73% 78%,
          transparent 78%
        );
      filter: drop-shadow(0 0 4px rgba(199, 120, 255, 0.18));
    }

    .runes-a,
    .runes-b {
      mix-blend-mode: screen;
      opacity: 0.96;
    }

    .runes-a {
      inset: 3%;
      background: repeating-conic-gradient(
        from 0deg,
        transparent 0deg 7deg,
        var(--portal-a) 7deg 9deg,
        transparent 9deg 16deg,
        #e8fff9 16deg 16.7deg,
        transparent 16.7deg 22deg
      );

      -webkit-mask: radial-gradient(
        circle,
        transparent 59%,
        #000 60% 69%,
        transparent 70%
      );
      mask: radial-gradient(
        circle,
        transparent 59%,
        #000 60% 69%,
        transparent 70%
      );

      filter: drop-shadow(0 0 2px var(--portal-a));
      animation: spin 12s steps(28, end) infinite;
    }

    .runes-b {
      inset: 12%;
      background: repeating-conic-gradient(
        from 9deg,
        transparent 0deg 8deg,
        var(--portal-b) 8deg 9.6deg,
        transparent 9.6deg 17deg,
        #fff2ff 17deg 17.5deg,
        transparent 17.5deg 24deg
      );

      -webkit-mask: radial-gradient(
        circle,
        transparent 65%,
        #000 66% 74%,
        transparent 75%
      );
      mask: radial-gradient(
        circle,
        transparent 65%,
        #000 66% 74%,
        transparent 75%
      );

      filter: drop-shadow(0 0 2px var(--portal-b));
      animation: spinReverse 9s steps(22, end) infinite;
    }

    .core {
      inset: 20%;
      border: var(--line-fat) solid var(--ink);
      overflow: hidden;

      background:
        radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.28) 0 10%,
          transparent 11%
        ),
        radial-gradient(
          circle at 68% 68%,
          rgba(77, 255, 232, 0.24) 0 14%,
          transparent 15%
        ),
        conic-gradient(
          from 0deg,
          #041b1d,
          #0a5b5f 22%,
          #041013 38%,
          #4c1566 58%,
          #063438 74%,
          #041b1d
        );

      box-shadow:
        inset 0 0 0 0.7vmin rgba(0, 0, 0, 0.85),
        0 0 1.5vmin rgba(77, 255, 232, 0.16);

      animation: corePulse 2.6s steps(3, end) infinite;
    }

    .core::before {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: 50%;

      background: conic-gradient(
        from 0deg,
        transparent 0 14%,
        rgba(101, 255, 237, 0.28) 16%,
        transparent 20% 44%,
        rgba(214, 134, 255, 0.24) 47%,
        transparent 51% 78%,
        rgba(255, 157, 51, 0.18) 81%,
        transparent 85%
      );

      mix-blend-mode: screen;
      animation: spin 5.5s steps(18, end) infinite;
    }

    /* =====================================================
       5. BONES
       ===================================================== */

    .ground-props {
      z-index: 4;
    }

    .bones,
    .mushrooms {
      position: absolute;
      inset: 0;
    }

    .bone {
      position: absolute;
      display: block;
      width: 6vmin;
      height: 1.1vmin;
      color: var(--bone);
      background: currentColor;
      border-radius: 999px;
    }

    .bone::before,
    .bone::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 1.5vmin;
      height: 1.5vmin;
      border-radius: 50%;
      background: currentColor;
      transform: translateY(-50%);
      box-shadow: 0 0.4vmin 0 currentColor;
    }

    .bone::before {
      left: -0.65vmin;
    }

    .bone::after {
      right: -0.65vmin;
    }

    .b1 {
      left: 16%;
      bottom: 9vh;
      transform: rotate(18deg) scale(0.9);
    }

    .b2 {
      left: 24%;
      bottom: 7vh;
      transform: rotate(-32deg) scale(1.15);
    }

    .b3 {
      right: 18%;
      bottom: 8vh;
      transform: rotate(74deg) scale(0.8);
    }

    .b4 {
      right: 28%;
      bottom: 11vh;
      transform: rotate(-12deg) scale(1.05);
    }

    .b5 {
      left: 44%;
      bottom: 5.5vh;
      transform: rotate(40deg) scale(0.7);
      opacity: 0.75;
    }

    /* =====================================================
       6. MUSHROOMS
       ===================================================== */

    .mushroom {
      position: absolute;
      display: block;
      width: 5vmin;
      height: 6vmin;
      transform-origin: bottom center;
    }

    .mushroom::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 26%;
      height: 56%;
      transform: translateX(-50%);

      border: var(--line-fat) solid var(--ink);
      background: linear-gradient(
        90deg,
        #7d9785 0 48%,
        #d8e8cf 48% 100%
      );
      border-radius: 0.8vmin;
    }

    .mushroom::after {
      content: "";
      position: absolute;
      left: -4%;
      top: 0;
      width: 108%;
      height: 56%;

      border: var(--line-fat) solid var(--ink);

      background:
        radial-gradient(
          circle at 24% 28%,
          rgba(255, 255, 255, 0.85) 0 8%,
          transparent 9%
        ),
        radial-gradient(
          circle at 70% 38%,
          rgba(255, 255, 255, 0.6) 0 6%,
          transparent 7%
        ),
        radial-gradient(
          circle at 50% 18%,
          color-mix(in srgb, var(--glow) 82%, white 18%) 0 58%,
          color-mix(in srgb, var(--glow) 36%, black 64%) 100%
        );

      border-radius: 50% 50% 46% 46% / 100% 100% 30% 30%;

      box-shadow:
        0 0 0 0.55vmin color-mix(in srgb, var(--glow) 30%, transparent),
        0 0 1.2vmin var(--glow);

      animation: mushroomPulse 2.3s steps(2, end) infinite;
    }

    .m1 {
      left: 20%;
      bottom: 8.5vh;
      --glow: #3df5c9;
      transform: rotate(-8deg) scale(1.1);
    }

    .m2 {
      left: 27%;
      bottom: 6.5vh;
      --glow: #83ff5d;
      transform: rotate(6deg) scale(0.72);
      animation-delay: 0.4s;
    }

    .m3 {
      right: 22%;
      bottom: 7.5vh;
      --glow: #b26bff;
      transform: rotate(10deg) scale(0.95);
      animation-delay: 0.9s;
    }

    .m4 {
      right: 30%;
      bottom: 10vh;
      --glow: #38f2ff;
      transform: rotate(-14deg) scale(0.65);
      animation-delay: 1.3s;
    }

    .m5 {
      left: 48%;
      bottom: 5.8vh;
      --glow: #ff9d3c;
      transform: rotate(3deg) scale(0.58);
      animation-delay: 0.2s;
    }

    /* =====================================================
       7. FOREGROUND ROCKS
       ===================================================== */

    .rocks-top,
    .rocks-bottom {
      z-index: 6;
    }

    .rocks-left,
    .rocks-right {
      z-index: 7;
    }

    .rocks-top {
      inset: 0 0 auto 0;
      height: 17vh;

      background:
        radial-gradient(
          120% 120% at 50% 130%,
          rgba(77, 255, 232, 0.1),
          transparent 42%
        ),
        linear-gradient(
          to bottom,
          #090d16 0 28%,
          #232b42 28% 62%,
          #171d2d 62% 100%
        );

      clip-path: polygon(
        0% 0%,
        100% 0%,
        100% 38%,
        95% 78%,
        90% 34%,
        84% 88%,
        79% 30%,
        73% 72%,
        68% 22%,
        61% 80%,
        55% 18%,
        49% 68%,
        43% 24%,
        37% 84%,
        31% 30%,
        25% 74%,
        20% 26%,
        14% 82%,
        9% 34%,
        4% 70%,
        0% 28%
      );
    }

    .rocks-bottom {
      inset: auto 0 0 0;
      height: 20vh;

      background:
        radial-gradient(
          120% 120% at 50% -20%,
          rgba(199, 120, 255, 0.08),
          transparent 40%
        ),
        linear-gradient(
          to top,
          #0a0e17 0 28%,
          #252e47 28% 64%,
          #171d2d 64% 100%
        );

      clip-path: polygon(
        0% 100%,
        0% 60%,
        5% 22%,
        10% 68%,
        16% 30%,
        22% 76%,
        28% 34%,
        35% 80%,
        41% 38%,
        48% 72%,
        55% 28%,
        61% 74%,
        68% 36%,
        74% 82%,
        80% 32%,
        86% 70%,
        92% 28%,
        100% 64%,
        100% 100%
      );
    }

    .rocks-left {
      inset: 0 auto 0 0;
      width: 14vw;

      background: linear-gradient(
        100deg,
        #05070d 20%,
        #1a2234 58%,
        #2c3854 100%
      );

      clip-path: polygon(
        0% 0%,
        62% 0%,
        44% 12%,
        72% 22%,
        38% 34%,
        64% 46%,
        32% 58%,
        58% 70%,
        28% 82%,
        48% 92%,
        12% 100%,
        0% 100%
      );
    }

    .rocks-right {
      inset: 0 0 0 auto;
      width: 14vw;

      background: linear-gradient(
        -100deg,
        #05070d 20%,
        #1a2234 58%,
        #2c3854 100%
      );

      clip-path: polygon(
        100% 0%,
        38% 0%,
        56% 12%,
        28% 22%,
        62% 34%,
        36% 46%,
        68% 58%,
        42% 70%,
        72% 82%,
        52% 92%,
        88% 100%,
        100% 100%
      );
    }

    /* =====================================================
       8. OLD-GAME VIGNETTE / SCANLINES
       ===================================================== */

    .vignette {
      z-index: 8;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.12) 0 2px,
          transparent 2px 4px
        ),
        radial-gradient(
          circle at 50% 50%,
          transparent 55%,
          rgba(0, 0, 0, 0.55) 100%
        );
      opacity: 0.68;
    }

    /* =====================================================
       ANIMATIONS
       ===================================================== */

    @keyframes bgPulse {
      0%,
      100% {
        opacity: 0.72;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes eyeBlink {
      0%,
      8%,
      12%,
      39%,
      43%,
      76%,
      80%,
      100% {
        opacity: 1;
      }

      10%,
      41%,
      78% {
        opacity: 0;
      }

      24% {
        opacity: 0.6;
      }

      58% {
        opacity: 0.25;
      }
    }

    @keyframes haloPulse {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.035);
      }
    }

    @keyframes corePulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    @keyframes mushroomPulse {
      0%,
      100% {
        box-shadow:
          0 0 0 0.55vmin color-mix(in srgb, var(--glow) 30%, transparent),
          0 0 1.2vmin var(--glow);
      }
      50% {
        box-shadow:
          0 0 0 0.95vmin color-mix(in srgb, var(--glow) 45%, transparent),
          0 0 3vmin var(--glow);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    /* =====================================================
       RESPONSIVE + ACCESSIBILITY
       ===================================================== */

    @media (max-width: 720px) {
      .rocks-left,
      .rocks-right {
        width: 20vw;
        opacity: 0.9;
      }

      .portal {
        width: min(58vmin, 320px);
      }

      .stairs {
        width: min(64vmin, 340px);
      }

      .bone {
        width: 7.5vmin;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cave *,
      .cave *::before,
      .cave *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="cave" aria-hidden="true">
    <div class="bg"></div>

    <div class="eyes eyes-aqua"></div>
    <div class="eyes eyes-green"></div>
    <div class="eyes eyes-purple"></div>
    <div class="eyes eyes-orange"></div>

    <div class="floor"></div>

    <div class="portal-scene">
      <div class="stairs"></div>
      <div class="pedestal"></div>

      <div class="portal">
        <div class="halo"></div>
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="runes-a"></div>
        <div class="runes-b"></div>
        <div class="core"></div>
      </div>
    </div>

    <div class="ground-props">
      <div class="bones">
        <i class="bone b1"></i>
        <i class="bone b2"></i>
        <i class="bone b3"></i>
        <i class="bone b4"></i>
        <i class="bone b5"></i>
      </div>

      <div class="mushrooms">
        <i class="mushroom m1"></i>
        <i class="mushroom m2"></i>
        <i class="mushroom m3"></i>
        <i class="mushroom m4"></i>
        <i class="mushroom m5"></i>
      </div>
    </div>

    <div class="rocks-top"></div>
    <div class="rocks-bottom"></div>
    <div class="rocks-left"></div>
    <div class="rocks-right"></div>

    <div class="vignette"></div>
  </div>

  <main class="content">
    <h1>Enter the Cave</h1>
  </main>
</body>
</html>
