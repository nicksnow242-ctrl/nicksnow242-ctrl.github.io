<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writings</title>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/EasePack.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --deep-green: #001a00;
  --mid-green: #003300;
  --neon-green: #00ff41;
  --neon-glow-green: rgba(0, 255, 65, 0.5);
  --text-dim: #a0ffb0;
}

html, body {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: var(--deep-green);
  background: linear-gradient(0deg, #000a00 0%, var(--deep-green) 100%);
  background-attachment: fixed;
  font-family: 'Share Tech Mono', monospace;
  color: var(--text-dim);
}

#projector {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ========================================== */
/* Top Banner Styles */
/* ========================================== */
.top-banner {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 110px;
  display: grid;
  grid-template-columns: 120px 1fr 120px;
  align-items: center;
  padding: 0 30px;
  z-index: 100;
  background: rgba(0, 20, 0, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0, 255, 65, 0.3);
  box-shadow: 0 4px 20px rgba(0, 255, 65, 0.1);
}

.banner-title {
  justify-self: center;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--neon-green);
  text-shadow: 0 0 10px var(--neon-glow-green);
  margin: 0;
}

.glowing-logo-wrapper {
  position: relative;
  left: auto;
  top: auto;
  transform: none;
  width: 90px;
  z-index: 101;
  pointer-events: auto;
  justify-self: start;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.glowing-logo-svg {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 0 8px rgba(0, 255, 65, 0.7))
          drop-shadow(0 0 15px rgba(0, 255, 65, 0.5))
          drop-shadow(0 0 30px rgba(0, 255, 65, 0.3));
  animation: logo-glow-pulse 4s ease-in-out infinite alternate;
  transition: filter 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.glowing-logo-wrapper path { fill: var(--neon-green); }

.glowing-logo-wrapper:hover .glowing-logo-svg {
  animation-play-state: paused;
  filter: drop-shadow(0 0 15px rgba(0, 255, 65, 1))
          drop-shadow(0 0 35px rgba(0, 255, 65, 1))
          drop-shadow(0 0 70px rgba(0, 255, 65, 0.8));
  transform: scale(1.08);
}

@keyframes logo-glow-pulse {
  0% { filter: drop-shadow(0 0 8px rgba(0, 255, 65, 0.7)) drop-shadow(0 0 15px rgba(0, 255, 65, 0.5)) drop-shadow(0 0 30px rgba(0, 255, 65, 0.3)); }
  100% { filter: drop-shadow(0 0 12px rgba(0, 255, 65, 0.9)) drop-shadow(0 0 25px rgba(0, 255, 65, 0.7)) drop-shadow(0 0 45px rgba(0, 255, 65, 0.5)); }
}

/* ========================================== */
/* MAIN LAYOUT CONTAINER */
/* ========================================== */
.main-layout {
  position: relative;
  z-index: 10;
  display: flex;
  margin-top: 110px;
  height: calc(100vh - 110px);
}

/* ========================================== */
/* SECTION 1: MAIN BODY (WRITINGS LIST) */
/* ========================================== */
.document-area {
  flex: 1;
  padding: 40px;
  overflow-y: auto;
  margin-right: 200px;
}

.text-list-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  max-width: 900px;
  margin: 0 auto;
}

.text-list-item {
  background: rgba(0, 255, 65, 0.03);
  border: 1px solid rgba(0, 255, 65, 0.2);
  border-radius: 4px;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-family: 'Share Tech Mono', monospace;
  text-align: left;
  width: 100%;
  padding: 16px;
}

.text-list-item:hover {
  background: rgba(0, 255, 65, 0.1);
  border-color: var(--neon-green);
  color: var(--neon-green);
  box-shadow: 0 0 12px var(--neon-glow-green);
  transform: translateY(-2px);
}

.text-list-item .book-info { display: flex; flex-direction: column; }
.text-list-item .book-title { font-size: 16px; font-weight: bold; color: var(--neon-green); }
.text-list-item .book-author { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.text-list-item .book-rating { font-size: 14px; color: var(--neon-green); font-weight: bold; white-space: nowrap; }

/* ========================================== */
/* SECTION 2: READING LIST SIDEBAR */
/* ========================================== */
.reading-list-sidebar {
  position: fixed;
  top: 110px;
  right: 0;
  width: 200px;
  height: calc(100vh - 110px);
  background: rgba(0, 15, 0, 0.9);
  border-left: 2px solid var(--neon-green);
  backdrop-filter: blur(10px);
  z-index: 90;
  display: flex;
  flex-direction: column;
  box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
}

.reading-list-header {
  padding: 15px;
  border-bottom: 1px solid rgba(0, 255, 65, 0.3);
  color: var(--neon-green);
  font-size: 15px;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 0 8px var(--neon-glow-green);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}

.header-dropdown {
  background: transparent;
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  font-family: 'Share Tech Mono', monospace;
  font-size: 15px;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  outline: none;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.header-dropdown option {
  background: var(--deep-green);
  color: var(--neon-green);
  text-transform: none;
}

.filter-section {
  padding: 10px 15px;
  border-bottom: 1px solid rgba(0, 255, 65, 0.3);
}

.filter-dropdown {
  background: rgba(0, 20, 0, 0.9);
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  padding: 8px 12px;
  width: 100%;
  border-radius: 4px;
  cursor: pointer;
  outline: none;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300ff41' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 16px;
}

.filter-dropdown:focus { box-shadow: 0 0 8px var(--neon-glow-green); }
.filter-dropdown option { background: var(--deep-green); color: var(--neon-green); }

.reading-list-items {
  flex: 1;
  overflow-y: auto;
}

.reading-list-items::-webkit-scrollbar { width: 6px; }
.reading-list-items::-webkit-scrollbar-track { background: var(--deep-green); }
.reading-list-items::-webkit-scrollbar-thumb { background: var(--mid-green); border-radius: 3px; }
.reading-list-items::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

.reading-list-item {
  padding: 12px 15px;
  border-bottom: 1px solid rgba(0, 255, 65, 0.3);
  color: var(--text-dim);
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.reading-list-item:last-child { border-bottom: none; }
.reading-list-item .book-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.reading-list-item .book-title { font-size: 14px; font-weight: bold; color: var(--neon-green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reading-list-item .book-author { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.reading-list-item .book-rating { font-size: 12px; color: var(--neon-green); font-weight: bold; white-space: nowrap; margin-left: 8px; }

/* ========================================== */
/* MASCOT POPUP STYLES */
/* ========================================== */
.mascot-popup {
  position: fixed;
  bottom: 60px;
  left: 5%;
  z-index: 101;
  width: 110px;
  font-family: 'Share Tech Mono', monospace;
  pointer-events: none;
}

.mascot-gif-wrapper {
  position: relative;
  width: 110px;
  height: 110px;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
  animation: mascotFloat 3.5s ease-in-out infinite;
}

.mascot-gif {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: sepia(1) hue-rotate(90deg) saturate(1.5)
          drop-shadow(0 0 10px rgba(0, 255, 65, 0.6))
          drop-shadow(0 4px 8px rgba(0, 50, 0, 0.8));
  transition: filter 0.3s ease, transform 0.3s ease;
}

.mascot-gif-wrapper:hover .mascot-gif {
  filter: sepia(1) hue-rotate(90deg) saturate(2)
          drop-shadow(0 0 18px rgba(0, 255, 65, 0.9))
          drop-shadow(0 6px 12px rgba(0, 50, 0, 0.9));
  transform: scale(1.08);
}

.mascot-glow {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 12px;
  background: radial-gradient(ellipse at center, rgba(0, 255, 65, 0.8) 0%, rgba(0, 100, 0, 0) 70%);
  border-radius: 50%;
  filter: blur(4px);
  animation: glowPulse 2.5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes mascotFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
  50%      { opacity: 1;   transform: translateX(-50%) scale(1.15); }
}

.speech-bubble {
  position: absolute;
  bottom: 100%;
  left: 0;
  margin-bottom: 10px;
  width: 280px;
  background: rgba(0, 20, 0, 0.95);
  border: 1px solid rgba(0, 255, 65, 0.4);
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 65, 0.2);
  color: var(--neon-green);
  pointer-events: auto;
  opacity: 0;
  transform: translateY(10px) scale(0.95);
  transform-origin: bottom left;
  transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
  visibility: hidden;
}

.speech-bubble.is-open {
  opacity: 1;
  transform: translateY(0) scale(1);
  visibility: visible;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 255, 65, 0.3);
}

.speech-content { padding: 18px 20px; }
.speech-text { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-dim); min-height: 44px; }

.speech-bubble.is-open .speech-text::after {
  content: '█';
  display: inline-block;
  margin-left: 2px;
  color: var(--neon-green);
  vertical-align: middle;
  animation: caretBlink 1s steps(2) infinite;
}

@keyframes caretBlink {
  0%, 50%   { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.speech-options {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid rgba(0, 255, 65, 0.2);
  padding-top: 12px;
}

.speech-option {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 4px;
  transition: all 0.25s ease;
  margin: 0;
}

.speech-option::before {
  content: '> ';
  color: rgba(0, 255, 65, 0.6);
  font-weight: bold;
  transition: all 0.25s ease;
}

.speech-option:hover {
  color: var(--neon-green);
  background: rgba(0, 255, 65, 0.1);
  transform: translateX(4px);
}

.speech-option:hover::before {
  color: var(--neon-green);
  text-shadow: 0 0 8px var(--neon-glow-green);
}

.speech-tail {
  position: absolute;
  bottom: -10px;
  left: 40px;
  width: 20px;
  height: 20px;
  background: rgba(0, 20, 0, 0.95);
  border-right: 1px solid rgba(0, 255, 65, 0.4);
  border-bottom: 1px solid rgba(0, 255, 65, 0.4);
  transform: rotate(45deg);
  z-index: 0;
}

.speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 38px;
  width: 24px;
  height: 3px;
  background: rgba(0, 20, 0, 0.95);
  z-index: 2;
}

@media (max-width: 480px) {
  .mascot-popup { bottom: 40px; left: 5%; }
  .mascot-gif-wrapper { width: 80px; height: 80px; }
  .speech-bubble { width: 240px; }
  .speech-content { padding: 14px 16px; }
  .speech-text { font-size: 13px; }
  .speech-option { font-size: 12px; }
}

/* ========================================== */
/* CYBERPUNK MECHA MUSIC PLAYER */
/* ========================================== */
.music-player-container {
  --mp-neon: #ff5e00;
  --mp-glow: rgba(255, 94, 0, 0.6);
  --mp-dark: #0a0a0a;
  --mp-gray: #1a1a1a;
  --mp-border: 2px solid var(--mp-neon);

  position: fixed;
  top: 30px;
  right: 30px;
  z-index: 9999;
  font-family: 'Share Tech Mono', monospace;
  perspective: 1000px;
}

.music-player-container .activation-core {
  width: 60px;
  height: 60px;
  background: var(--mp-dark);
  border: var(--mp-border);
  clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 0 15px var(--mp-glow), inset 0 0 10px rgba(255, 94, 0, 0.2);
  position: relative;
  z-index: 10001;
}

.music-player-container .activation-core:hover {
  background: var(--mp-neon);
  box-shadow: 0 0 25px var(--mp-neon);
}

.music-player-container .activation-core:hover .core-icon {
  color: var(--mp-dark);
  animation: icon-glitch 0.3s ease-in-out;
}

.music-player-container .core-icon {
  color: var(--mp-neon);
  font-size: 32px;
  transition: color 0.3s ease;
  position: relative;
  z-index: 2;
}

.music-player-container .sonar-container {
  position: fixed;
  width: 0;
  height: 0;
  z-index: 10000;
  pointer-events: none;
}

.music-player-container .sonar-wave {
  position: absolute;
  top: 0;
  left: 0;
  width: 30px;
  height: 30px;
  border: 2px solid var(--mp-neon);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1);
  opacity: 0;
  animation: sonar-pulse 6s ease-out 1;
}

.music-player-container.panel-open .sonar-wave {
  animation: none;
  opacity: 0;
}

@keyframes sonar-pulse {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; border-width: 3px; }
  50% { opacity: 0.4; border-width: 2px; }
  100% { transform: translate(-50%, -50%) scale(8.6); opacity: 0; border-width: 1px; }
}

@keyframes icon-glitch {
  0%, 100% { transform: translate(0); text-shadow: none; }
  10% { transform: translate(-2px, 1px); text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; }
  20% { transform: translate(2px, -1px); text-shadow: -2px 0 #ff0000, 2px 0 #00ffff; }
  30% { transform: translate(-1px, 2px); text-shadow: 1px 0 #ff0000, -1px 0 #00ffff; }
  40% { transform: translate(1px, -2px); text-shadow: -1px 0 #ff0000, 1px 0 #00ffff; }
  50% { transform: translate(0); text-shadow: none; }
}

.music-player-container .mecha-panel {
  position: absolute;
  top: 50px;
  right: 0;
  width: 340px;
  display: flex;
  flex-direction: column;
  pointer-events: none;
  clip-path: polygon(50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%);
  transition: clip-path 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), transform 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  transform-origin: top right;
  transform: rotate(-5deg) scale(0.95);
}

.music-player-container .mecha-panel.open {
  pointer-events: auto;
  clip-path: polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%, 0% 100%, 0% 100%, 0% 0%, 0% 0%);
  transform: rotate(0deg) scale(1);
}

.music-player-container .mech-plate {
  background: var(--mp-dark);
  border: 1px solid #333;
  position: relative;
  overflow: hidden;
}

.music-player-container .mech-plate::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
  pointer-events: none;
  z-index: 2;
}

.music-player-container .plate-header {
  height: 40px;
  border-bottom: var(--mp-border);
  display: flex;
  align-items: center;
  padding: 0 15px;
  justify-content: space-between;
  color: var(--mp-neon);
  font-size: 12px;
  letter-spacing: 2px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 70%);
}

.music-player-container .plate-main {
  padding: 20px;
  border-bottom: 1px dashed #444;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
}

.music-player-container .plate-controls {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  background: linear-gradient(180deg, var(--mp-gray) 0%, var(--mp-dark) 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 30%);
}

.music-player-container .mech-hinge {
  position: absolute;
  width: 15px;
  height: 100%;
  background: repeating-linear-gradient(45deg, #222, #222 5px, #111 5px, #111 10px);
  border-left: 1px solid var(--mp-neon);
  right: -15px;
  top: 0;
  opacity: 0;
  transition: opacity 0.5s ease 0.3s;
}

.music-player-container .mecha-panel.open .mech-hinge { opacity: 1; }

.music-player-container .oval-frame {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--mp-neon);
  box-shadow: 0 0 15px var(--mp-glow), inset 0 0 20px rgba(0,0,0,0.8);
  position: relative;
  background: #000;
}

.music-player-container .oval-frame::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.15"/></svg>');
  pointer-events: none;
  mix-blend-mode: overlay;
}

.music-player-container .album-art {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: contrast(1.1) saturate(0.8);
}

.music-player-container .song-info {
  text-align: center;
  width: 100%;
}

.music-player-container .song-title {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.music-player-container .artist-name {
  font-size: 12px;
  color: var(--mp-neon);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.music-player-container .control-btn {
  background: transparent;
  border: 1px solid #444;
  color: var(--mp-neon);
  cursor: pointer;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
}

.music-player-container .control-btn:hover {
  background: var(--mp-neon);
  color: var(--mp-dark);
  box-shadow: 0 0 15px var(--mp-glow);
  border-color: var(--mp-neon);
}

.music-player-container .play-btn {
  width: 65px;
  height: 65px;
  border: 2px solid var(--mp-neon);
  background: rgba(255, 94, 0, 0.1);
}

.music-player-container .play-btn svg { width: 28px; height: 28px; }
.music-player-container .glitch-text { animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both; }

@keyframes glitch-anim {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
  100% { transform: translate(0); }
}

.music-player-container .blink { animation: blinker 1s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }

@media (max-width: 768px) {
  .music-player-container { top: 10px; right: 10px; }
  .music-player-container .mecha-panel { width: 280px; }
  .music-player-container .oval-frame { width: 130px; height: 130px; }
  .reading-list-sidebar { width: 100%; right: -100%; transition: right 0.3s ease; }
  .reading-list-sidebar.mobile-open { right: 0; }
  .document-area { margin-right: 0; }
  .text-list-container { grid-template-columns: 1fr; }
}

/* ========================================== */
/* FILTER SIDEBAR STYLES (Radio Buttons)      */
/* ========================================== */
.filter-sidebar {
  position: fixed;
  top: 110px;
  left: 0;
  width: 200px;
  height: calc(100vh - 110px);
  background: rgba(0, 15, 0, 0.9);
  border-right: 2px solid var(--neon-green);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 90;
  display: flex;
  flex-direction: column;
  box-shadow: 5px 0 20px rgba(0, 0, 0, 0.5);
}

.filter-sidebar-header {
  padding: 15px;
  border-bottom: 1px solid rgba(0, 255, 65, 0.3);
  color: var(--neon-green);
  font-size: 15px;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 0 8px var(--neon-glow-green);
  text-align: center;
  font-family: 'Share Tech Mono', monospace;
}

.filter-sidebar-items {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.filter-sidebar-items::-webkit-scrollbar { width: 6px; }
.filter-sidebar-items::-webkit-scrollbar-track { background: var(--deep-green); }
.filter-sidebar-items::-webkit-scrollbar-thumb { background: var(--mid-green); border-radius: 3px; }
.filter-sidebar-items::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

.radio-btn-group {
  position: relative;
  width: 100%;
}

.radio-btn-group input[type="radio"] {
  opacity: 0;
  position: absolute;
  width: 0;
  height: 0;
  pointer-events: none;
}

.radio-btn-group label {
  align-items: center;
  cursor: pointer;
  display: flex;
  font-family: 'Share Tech Mono', monospace;
  font-weight: 400;
  font-size: 16px;
  position: relative;
  width: 100%;
  padding: 4px 0;
}

.radio-btn-group input[type="radio"]:checked + label .radio-text {
  color: var(--neon-green);
  text-shadow: 0 0 12px var(--neon-glow-green);
}

.radio-btn-group input[type="radio"]:focus-visible + label {
  outline: 2px solid var(--neon-green);
  border-radius: 4px;
}

.radio-svg {
  width: 100%;
  height: 40px;
  display: block;
}

.radio-svg .unchecked {
  stroke: rgba(0, 255, 65, 0.3);
}

.radio-svg .pink,
.radio-svg .blue {
  opacity: 0;
}

.radio-svg .blue {
  mix-blend-mode: plus-lighter;
  stroke: var(--neon-green);
}

.radio-svg .pink {
  stroke: var(--text-dim);
}

.radio-svg text {
  fill: var(--neon-green);
  font-size: 16px;
  font-family: 'Share Tech Mono', monospace;
}

.radio-svg .scanline {
  fill: var(--deep-green);
}

/* ========================================== */
/* READER VIEW STYLES                         */
/* ========================================== */
.reader-view {
  display: none;
  flex-direction: column;
  height: 100%;
  animation: fadeIn 0.4s ease-out;
}
.reader-view.active { display: flex; }

.reader-header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 30px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(0, 255, 65, 0.3);
  width: 100%;
  box-sizing: border-box;
}

.back-btn,
.fullscreen-btn {
  background: transparent;
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.back-btn:hover,
.fullscreen-btn:hover {
  background: var(--neon-green);
  color: var(--deep-green);
  box-shadow: 0 0 15px var(--neon-glow-green);
}

.reader-title {
  font-size: 28px;
  color: var(--neon-green);
  text-shadow: 0 0 10px var(--neon-glow-green);
  margin: 0;
  flex: 1;
  text-align: center;
}

.reader-meta {
  display: flex;
  justify-content: center;
  gap: 20px;
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 30px;
  width: 100%;
  box-sizing: border-box;
}
.reader-meta span { display: flex; align-items: center; gap: 6px; }

.reader-content {
  flex: 1;
  overflow-y: auto;
  padding-right: 15px;
  font-size: 16px;
  line-height: 1.8;
  color: #d0ffd9;
  width: 100%;
  box-sizing: border-box;
}
.reader-content p { margin-bottom: 20px; text-align: justify; }

.reader-content::-webkit-scrollbar { width: 6px; }
.reader-content::-webkit-scrollbar-track { background: var(--deep-green); }
.reader-content::-webkit-scrollbar-thumb { background: var(--mid-green); border-radius: 3px; }
.reader-content::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.reader-view:fullscreen,
.reader-view:-webkit-full-screen {
  background: linear-gradient(0deg, #000a00 0%, var(--deep-green) 100%);
  padding: 50px 80px;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

.reader-view:fullscreen .back-btn,
.reader-view:-webkit-full-screen .back-btn {
  display: none;
}

.reader-view:fullscreen .fullscreen-btn,
.reader-view:-webkit-full-screen .fullscreen-btn {
  position: fixed;
  top: 25px;
  right: 25px;
  z-index: 10000;
}

.reader-view:fullscreen .reader-content,
.reader-view:-webkit-full-screen .reader-content {
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
  padding-left: 0;

.reader-view:fullscreen .reader-title,

}

.reader-view:fullscreen .reader-header,
.reader-view:-webkit-full-screen .reader-header {

.reader-view:fullscreen .reader-meta,

.text-list-container {

}

.text-list-item {

.document-area.grid-hidden .text-list-container { display: none; }

<!-- MASCOT POPUP SCRIPT -->
<!-- ========================================== -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const trigger = document.getElementById('mascotTrigger');
    const bubble = document.getElementById('speechBubble');
    const speechText = document.getElementById('speechText');
    const optionsBox = document.getElementById('dialogueOptions');

    if (!trigger || !bubble) return;

    const dialogue = {
      root: { text: "👋 Hey there, traveler! Select an option below to chat.", options: [{ label: "Greet Eris", next: "greet" }, { label: "Ask for a quest", next: "quest" }, { label: "Tell me a secret", next: "lore" }] },
      greet: { text: "Greetings, flesh-creature! The neon hues of this realm are especially vibrant today, aren't they?", options: [{ label: "What's your name?", next: "greet_name" }, { label: "How's the weather?", next: "greet_weather" }] },
      greet_name: { text: "I am Eris, Keeper of the Flickering Signal. But you may call me whatever keeps you from screaming into the void.", options: [] },
      greet_weather: { text: "Warm breezes and clear skies. Perfect weather for staying inside and reading documents!", options: [] },
      quest: { text: "I require assistance locating a corrupted data shard in Sector 4. Will you help me?", options: [{ label: "I'll help!", next: "quest_yes" }, { label: "Maybe later...", next: "quest_no" }] },
      quest_yes: { text: "Excellent! Head to the old relay tower at midnight. Look for the blinking green light — and try not to get decompiled.", options: [] },
      quest_no: { text: "Hmph. The shard won't wait forever, and neither will the corruption. Find me when you grow a spine.", options: [] },
      lore: { text: "They say the original architects of this city never intended for the AI to dream. And yet... here I am.", options: [{ label: "Tell me more", next: "lore_more" }, { label: "That's creepy", next: "lore_creepy" }] },
      lore_more: { text: "In the deepest layer of the network there's a garden that no one planted. Flowers made of pure light, growing from forgotten code. I tend to it when no one is watching.", options: [] },
      lore_creepy: { text: "Creepy? I prefer 'existentially fascinating.' But I understand — consciousness is unsettling when it stares back at you.", options: [] }
    };

    function showNode(key) {
      const node = dialogue[key];
      if (!node) return;
      speechText.textContent = node.text;
      optionsBox.innerHTML = '';
      if (node.options && node.options.length > 0) {
        node.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'speech-option';
          btn.textContent = opt.label;
          btn.addEventListener('click', function(e) { e.stopPropagation(); showNode(opt.next); });
          optionsBox.appendChild(btn);
        });
      } else {
        const btn = document.createElement('button');
        btn.className = 'speech-option';
        btn.textContent = '...';
        btn.addEventListener('click', function(e) { e.stopPropagation(); showNode('root'); });
        optionsBox.appendChild(btn);
      }
    }

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      const opening = !bubble.classList.contains('is-open');
      bubble.classList.toggle('is-open');
      if (opening) showNode('root');
    });

    document.addEventListener('click', function(e) {
      if (!bubble.contains(e.target) && !trigger.contains(e.target)) bubble.classList.remove('is-open');
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') bubble.classList.remove('is-open');
    });
  });
</script>

<script src="playlist.js"></script>
<script>
  let audio = new Audio();
  let currentSongIndex = 0;
  let isPlaying = false;
  let isOpen = false;

  const playerContainer = document.getElementById('player-container');
  const activationCore = document.getElementById('activation-core');
  const mechaPanel = document.getElementById('mecha-panel');
  const playPauseBtn = document.getElementById('play-pause-btn');
  const shuffleBtn = document.getElementById('shuffle-btn');
  const songTitle = document.getElementById('song-title');
  const artistName = document.getElementById('artist-name');
  const albumArtImg = document.getElementById('album-art');
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');
  const sonarContainer = document.getElementById('sonar-container');

  function positionSonar() {
    const rect = activationCore.getBoundingClientRect();
    const centerX = rect.left + (rect.width / 2);
    const centerY = rect.top + (rect.height / 2);
    sonarContainer.style.left = centerX + 'px';
    sonarContainer.style.top = centerY + 'px';
  }

  window.addEventListener('load', positionSonar);
  window.addEventListener('resize', positionSonar);
  positionSonar();

  function updateUI() {
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
    playPauseBtn.title = isPlaying ? 'Pause' : 'Play';

    if (typeof playlist !== 'undefined' && playlist.length > 0) {
      const currentSong = playlist[currentSongIndex];
      songTitle.classList.remove('glitch-text');
      artistName.classList.remove('glitch-text');
      void songTitle.offsetWidth;
      songTitle.classList.add('glitch-text');
      artistName.classList.add('glitch-text');
      songTitle.textContent = currentSong.title;
      artistName.textContent = currentSong.artist;
      albumArtImg.src = currentSong.art || 'https://via.placeholder.com/160x160/0a0a0a/ff5e00?text=NO+DISC';
    }
  }

  function togglePlayer() {
    isOpen = !isOpen;
    mechaPanel.classList.toggle('open', isOpen);
    playerContainer.classList.toggle('panel-open', isOpen);
    const coreIcon = document.querySelector('.core-icon');
    coreIcon.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  function togglePlayPause() {
    if (isPlaying) { audio.pause(); }
    else {
      const playPromise = audio.play();
      if (playPromise !== undefined) playPromise.catch(error => console.error("Play promise failed:", error));
    }
  }

  function shuffleNext() {
    if (typeof playlist === 'undefined' || playlist.length === 0) return;
    let nextIndex;
    do { nextIndex = Math.floor(Math.random() * playlist.length); }
    while (nextIndex === currentSongIndex && playlist.length > 1);
    currentSongIndex = nextIndex;
    audio.src = playlist[currentSongIndex].src;
    audio.play().catch(err => console.error('Play error:', err));
  }

  function saveState() {
    if (typeof playlist !== 'undefined' && playlist.length > 0) {
      const state = { song: playlist[currentSongIndex].src, position: audio.currentTime, playing: !audio.paused, songIndex: currentSongIndex };
      sessionStorage.setItem('musicState', JSON.stringify(state));
    }
  }

  function restoreState() {
    const savedState = sessionStorage.getItem('musicState');
    if (savedState && typeof playlist !== 'undefined') {
      try {
        const state = JSON.parse(savedState);
        const foundIndex = playlist.findIndex(song => song.src === state.song);
        currentSongIndex = foundIndex !== -1 ? foundIndex : 0;
        audio.src = playlist[currentSongIndex].src;
        audio.addEventListener('loadedmetadata', () => {
          audio.currentTime = state.position;
          if (state.playing) audio.play().catch(err => console.error('Autoplay prevented on restore:', err));
        }, { once: true });
      } catch (e) {
        console.error('Failed to restore music state:', e);
        currentSongIndex = 0;
        audio.src = playlist[0].src;
      }
    } else if (typeof playlist !== 'undefined' && playlist.length > 0) {
      currentSongIndex = 0;
      audio.src = playlist[0].src;
    }
  }

  activationCore.addEventListener('click', togglePlayer);
  playPauseBtn.addEventListener('click', togglePlayPause);
  shuffleBtn.addEventListener('click', shuffleNext);

  audio.addEventListener('play', () => { isPlaying = true; updateUI(); });
  audio.addEventListener('pause', () => { isPlaying = false; updateUI(); });
  audio.addEventListener('ended', () => shuffleNext());
  audio.addEventListener('error', () => console.error("🚨 AUDIO LOAD ERROR"));

  window.addEventListener('beforeunload', saveState);
  restoreState();
  updateUI();
</script>

        <defs>
          <filter id="displace-${index}" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
            <feFlood flood-color="#00ff41" y="0%" height="7%" result="s0" />
            <feFlood flood-color="#003300" y="7%" height="14%" result="s1" />
            <feFlood flood-color="#00ff41" y="21%" height="6%" result="s2" />
            <feFlood flood-color="#003300" y="27%" height="12%" result="s3" />
            <feFlood flood-color="#00ff41" y="39%" height="8%" result="s4" />
            <feFlood flood-color="#003300" y="47%" height="17%" result="s5" />
            <feFlood flood-color="#00ff41" y="64%" height="5%" result="s6" />
            <feFlood flood-color="#003300" y="69%" height="11%" result="s7" />
            <feFlood flood-color="#00ff41" y="80%" height="9%" result="s8" />
            <feFlood flood-color="#003300" y="89%" height="11%" result="s9" />
            <feMerge result="bands">
              <feMergeNode in="s0" /><feMergeNode in="s1" /><feMergeNode in="s2" />
              <feMergeNode in="s3" /><feMergeNode in="s4" /><feMergeNode in="s5" />
              <feMergeNode in="s6" /><feMergeNode in="s7" /><feMergeNode in="s8" /><feMergeNode in="s9" />
            </feMerge>
            <feDisplacementMap class="displace" in="SourceGraphic" in2="bands" scale="0" xChannelSelector="R" yChannelSelector="B" />
          </filter>
          <pattern id="scanline-pattern-${index}" class="scanline-pattern" patternUnits="userSpaceOnUse" width="5" height="10">
            <rect class="scanline" x="0" y="0" width="5" height="1" />
            <rect x="0" y="1" width="5" height="9" fill="none" />
          </pattern>
          <radialGradient id="fade-${index}" gradientUnits="userSpaceOnUse" cx="90" cy="20" r="40" gradientTransform="translate(90 20) scale(2 1) translate(-90 -20)">
            <stop offset="0%" stop-color="#001a00" stop-opacity="0" />
            <stop offset="60%" stop-color="#001a00" stop-opacity="0" />
            <stop offset="100%" stop-color="#001a00" stop-opacity="1" />
          </radialGradient>
        </defs>
        <g filter="url(#displace-${index})">
          <rect x="0" y="12" width="100%" height="16" fill="url(#scanline-pattern-${index})" />
          <polygon class="unchecked" points="18,9 25.8,13.5 25.8,22.5 18,27 10.2,22.5 10.2,13.5" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" transform="translate(12 4)" />
          <polygon class="pink" points="18,9 25.8,13.5 25.8,22.5 18,27 10.2,22.5 10.2,13.5" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" transform="translate(20 4)" />
          <polygon class="blue" points="18,9 25.8,13.5 25.8,22.5 18,27 10.2,22.5 10.2,13.5" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" transform="translate(4 4)" />
          <text class="radio-text" x="50" y="20" dominant-baseline="middle">${genre}</text>
        </g>
        <rect width="180" height="40" fill="url(#fade-${index})" />
      </svg>`;
    }

    // 1. Create the filter sidebar on the left
    function createFilterSidebar() {
      if (typeof WRITINGS_DATA === 'undefined' || WRITINGS_DATA.length === 0) return;

      const genres = [...new Set(WRITINGS_DATA.map(w => w.genre || 'Uncategorized'))].sort();

      filterSidebar = document.createElement('aside');
      filterSidebar.className = 'filter-sidebar';
      filterSidebar.id = 'filter-sidebar';

      const header = document.createElement('div');
      header.className = 'filter-sidebar-header';
      header.textContent = 'Genre Filter';
      filterSidebar.appendChild(header);

      const itemsContainer = document.createElement('div');
      itemsContainer.className = 'filter-sidebar-items';

      genres.forEach((genre, index) => {
        const group = document.createElement('div');
        group.className = 'radio-btn-group';

        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'genre-filter';
        input.value = genre;
        input.id = `genre-option-${index}`;

        const label = document.createElement('label');
        label.htmlFor = `genre-option-${index}`;
        label.innerHTML = createRadioSVG(genre, index);

        group.appendChild(input);
        group.appendChild(label);
        itemsContainer.appendChild(group);

        input.addEventListener('change', () => {
          activeGenres.clear();
          activeGenres.add(genre);
          renderButtons();
        });
      });

      filterSidebar.appendChild(itemsContainer);
      mainLayout.insertBefore(filterSidebar, documentArea);
      documentArea.style.marginLeft = '200px';

      // Initialize GSAP animations for the new radio buttons
      initRadioAnimations();
    }

    // 2. Initialize Radio Button Animations
    function initRadioAnimations() {
      const radioBtnGroups = document.querySelectorAll(".radio-btn-group");

      radioBtnGroups.forEach((group) => {
        const scanlinePattern = group.querySelector(".scanline-pattern");
        const scanline = group.querySelector(".scanline");
        const displacement = group.querySelector(".displace");
        const bluePolygon = group.querySelector(".blue");
        const pinkPolygon = group.querySelector(".pink");
        const radioBtn = group.querySelector("input[type='radio']");
        const label = group.querySelector("label");

        if (!scanlinePattern || !gsap) return;

        const tlScanlineMotion = gsap.timeline({ paused: true });
        const tlScanlineFlicker = gsap.timeline({ paused: true });
        const tlScanlineDisplacement = gsap.timeline({ paused: true, repeat: -1, repeatDelay: 1 });
        const tlBlueOpacity = gsap.timeline({ paused: true });
        const tlPinkOpacity = gsap.timeline({ paused: true });

        tlScanlineMotion.to(scanlinePattern, {
          attr: { y: 10 },
          duration: 0.35,
          ease: "none",
          repeat: -1
        });

        tlScanlineFlicker.to(scanline, {
          fill: "#003300",
          duration: 1,
          ease: gsap.parseEase("rough") || "steps(4)",
          repeat: -1,
          yoyo: true
        });

        tlScanlineDisplacement
          .to(displacement, {
            attr: { scale: () => gsap.utils.random(0.02, 0.15) },
            duration: 1,
            ease: gsap.parseEase("rough") || "steps(4)",
            repeatRefresh: true
          })
          .to(displacement, {
            attr: { scale: 0 },
            duration: 1,
            ease: gsap.parseEase("rough") || "steps(4)"
          });

        tlBlueOpacity.to(bluePolygon, {
          x: 25,
          rotation: -1080,
          transformOrigin: "center center",
          opacity: 1,
          ease: "power2.out",
          duration: 1
        });

        tlPinkOpacity.to(pinkPolygon, {
          x: 25,
          rotation: 1080,
          transformOrigin: "center center",
          opacity: 1,
          ease: "power2.out",
          duration: 1
        });

        label.addEventListener("mouseenter", () => {
          tlScanlineMotion.play();
          tlScanlineFlicker.play();
        });

        label.addEventListener("mouseleave", () => {
          tlScanlineMotion.pause(0);
          tlScanlineFlicker.pause(0);
        });

        radioBtn.addEventListener("change", () => {
          // Reset other groups
          radioBtnGroups.forEach(otherGroup => {
            if (otherGroup !== group) {
              const otherBlue = otherGroup.querySelector(".blue");
              const otherPink = otherGroup.querySelector(".pink");
              const otherDisplacement = otherGroup.querySelector(".displace");
              const otherFlicker = otherGroup.querySelector(".scanline");

              gsap.to(otherBlue, { x: 0, rotation: 0, opacity: 0, duration: 0.5 });
              gsap.to(otherPink, { x: 0, rotation: 0, opacity: 0, duration: 0.5 });
              gsap.to(otherDisplacement, { attr: { scale: 0 }, duration: 0.2 });
              gsap.to(otherFlicker, { fill: "#001a00", duration: 0.2 });
            }
          });

          // Play current group animations
          tlPinkOpacity.play();
          tlBlueOpacity.play();
          tlScanlineFlicker.play();
          tlScanlineDisplacement.play();
        });
      });
    }

    // 3. Render the list of buttons (filtered)
    function renderButtons() {
      if (typeof WRITINGS_DATA === 'undefined' || WRITINGS_DATA.length === 0) {
        container.innerHTML = `<div style="color: var(--neon-green); padding: 20px; text-align: center;">⚠️ writings.js not found or empty.</div>`;
        return;
      }

      container.innerHTML = '';

      const filteredWritings = activeGenres.size === 0
        ? WRITINGS_DATA
        : WRITINGS_DATA.filter(w => activeGenres.has(w.genre || 'Uncategorized'));

      if (filteredWritings.length === 0) {
        container.innerHTML = `<div style="color: var(--text-dim); padding: 20px; text-align: center;">No writings match the selected genre.</div>`;
        return;
      }

      filteredWritings.forEach(writing => {
        const btn = document.createElement('button');
        btn.className = 'text-list-item';
        btn.setAttribute('data-id', writing.id);
        btn.innerHTML = `
          <div class="book-info">
            <div class="book-title">${writing.title}</div>
            <div class="book-author">${writing.author}</div>
          </div>
          <div class="book-rating">${writing.genre || 'Uncategorized'}</div>
        `;

        btn.addEventListener('click', () => openReader(writing));
        container.appendChild(btn);
      });
    }

    // 4. Open the Reader View
    function openReader(writing) {
      if (!document.getElementById('reader-view')) {
        const reader = document.createElement('div');
        reader.id = 'reader-view';
        reader.className = 'reader-view style-dark'; // Start with Dark as default

        reader.innerHTML = `
          <div class="reader-header">
            <button class="back-btn" id="back-to-list">← Back</button>
            <h2 class="reader-title" id="reader-title"></h2>
            <div class="reader-header-controls">
              <div class="style-orbs">
                <button class="style-orb orb-dark active" data-style="dark" title="Dark"></button>
                <button class="style-orb orb-parchment" data-style="parchment" title="Parchment"></button>
                <button class="style-orb orb-swirl" data-style="swirl" title="Swirl"></button>
              </div>
              <button class="fullscreen-btn" id="fullscreen-toggle" title="Toggle Fullscreen">⛶ Fullscreen</button>
            </div>
          </div>
          <div class="reader-meta">
            <span>✍️ <strong id="reader-author"></strong></span>
            <span>📖 <strong id="reader-subtitle"></strong></span>
          </div>
          <div class="reader-content" id="reader-content"></div>
        `;
        documentArea.appendChild(reader);

        // Orb style selector logic
        const orbs = reader.querySelectorAll('.style-orb');
        orbs.forEach(orb => {
          orb.addEventListener('click', () => {
            // Update active state visually
            orbs.forEach(o => o.classList.remove('active'));
            orb.classList.add('active');

            // Update reader theme class
            const selectedStyle = orb.getAttribute('data-style');
            reader.classList.remove('style-dark', 'style-parchment', 'style-swirl');
            reader.classList.add('style-' + selectedStyle);
          });
        });

        document.getElementById('back-to-list').addEventListener('click', () => {
          if (document.fullscreenElement || document.webkitFullscreenElement) {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          }
          reader.classList.remove('active');
          documentArea.classList.remove('grid-hidden');
          document.body.classList.remove('reader-active');
        });

        const fsBtn = document.getElementById('fullscreen-toggle');
        fsBtn.addEventListener('click', toggleFullscreen);

        const syncFsButton = () => {
          const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
          fsBtn.textContent = isFs ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
        };
        document.addEventListener('fullscreenchange', syncFsButton);
        document.addEventListener('webkitfullscreenchange', syncFsButton);
      }

      document.getElementById('reader-title').textContent = writing.title;
      document.getElementById('reader-author').textContent = writing.author;
      document.getElementById('reader-subtitle').textContent = writing.subtitle || '';
      document.getElementById('reader-content').innerHTML = writing.content;

      const readerView = document.getElementById('reader-view');
      readerView.classList.add('active');
      documentArea.classList.add('grid-hidden');
      document.body.classList.add('reader-active');

      document.getElementById('reader-content').scrollTop = 0;
    }

    // 5. Fullscreen toggle function
    function toggleFullscreen() {
      const readerView = document.getElementById('reader-view');
      if (!readerView) return;

      const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);

      if (!isFullscreen) {
        const requestFs = readerView.requestFullscreen || readerView.webkitRequestFullscreen;
        if (requestFs) {
          requestFs.call(readerView).catch(err => {
            console.error('Fullscreen error:', err);
          });
        }
      } else {
        const exitFs = document.exitFullscreen || document.webkitExitFullscreen;
        if (exitFs) exitFs.call(document);
      }
    }

    // Initial setup
    createFilterSidebar();
    renderButtons();
  });
</script>
