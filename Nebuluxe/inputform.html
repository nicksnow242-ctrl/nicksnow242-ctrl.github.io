<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inquiry Form - Nebuluxe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
/* =====================
   RESET & BASE
===================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Orbitron', sans-serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #0f2027, #000);
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 20px;
}

/* =====================
   PARTICLES
===================== */
.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: cyan;
  opacity: 0.6;
  animation: float 12s linear infinite;
  pointer-events: none;
}

@keyframes float {
  from {
    transform: translateY(100vh) translateX(0);
  }
  to {
    transform: translateY(-10vh) translateX(80px);
  }
}

/* =====================
   INQUIRY CARD
===================== */
.inquiry-box {
  position: relative;
  width: 100%;
  max-width: 500px;
  padding: 45px 40px;
  background: rgba(0, 0, 0, 0.75);
  border-radius: 18px;
  box-shadow:
    0 0 30px rgba(0, 255, 255, 0.25),
    inset 0 0 20px rgba(0, 255, 255, 0.15);
  border: 1px solid rgba(0, 255, 255, 0.4);
  animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.inquiry-box::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 20px;
  background: linear-gradient(45deg, cyan, magenta, cyan);
  z-index: -1;
  filter: blur(18px);
  animation: glow 6s linear infinite;
}

@keyframes glow {
  0% { filter: blur(18px) hue-rotate(0deg); }
  100% { filter: blur(18px) hue-rotate(360deg); }
}

/* =====================
   TITLE
===================== */
.inquiry-box h2 {
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 3px;
  color: #fff;
}

.inquiry-box > p {
  text-align: center;
  font-size: 11px;
  opacity: 0.7;
  margin-bottom: 35px;
  letter-spacing: 1px;
}

/* =====================
   INPUTS & TEXTAREA
===================== */
.field {
  position: relative;
  margin-bottom: 28px;
}

.field input,
.field textarea {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: none;
  outline: none;
  color: cyan;
  border-bottom: 2px solid rgba(0, 255, 255, 0.3);
  font-size: 14px;
  font-family: 'Orbitron', sans-serif;
  transition: 0.3s;
}

.field textarea {
  min-height: 100px;
  padding-top: 24px;
  resize: vertical;
}

.field input:focus,
.field textarea:focus {
  border-bottom-color: cyan;
  box-shadow: 0 8px 20px rgba(0, 255, 255, 0.15);
}

/* Readonly styling */
.field input[readonly] {
  color: rgba(0, 255, 255, 0.4);
  border-bottom-color: rgba(0, 255, 255, 0.1);
  cursor: not-allowed;
}

.field label {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: rgba(255, 255, 255, 0.5);
  pointer-events: none;
  transition: 0.3s;
  letter-spacing: 1px;
}

.field textarea + label {
  top: 24px;
  transform: translateY(0);
}

/* Float label up on focus or when not empty */
.field input:focus + label,
.field input:not(:placeholder-shown) + label,
.field textarea:focus + label,
.field textarea:not(:placeholder-shown) + label {
  top: -6px;
  font-size: 10px;
  color: cyan;
}

/* Adjust label color for readonly fields */
.field input[readonly] + label {
  color: rgba(0, 255, 255, 0.4);
}

/* =====================
   BUTTONS
===================== */
.form-actions {
  display: flex;
  gap: 15px;
  margin-top: 35px;
}

.neon-btn {
  flex: 1;
  padding: 14px;
  background: transparent;
  border: 2px solid cyan;
  border-radius: 12px;
  color: cyan;
  cursor: pointer;
  letter-spacing: 2px;
  font-size: 13px;
  font-family: 'Orbitron', sans-serif;
  transition: 0.4s;
  position: relative;
  overflow: hidden;
  text-align: center;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.neon-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: cyan;
  transform: scaleX(0);
  transform-origin: left;
  transition: 0.4s;
  z-index: -1;
}

.neon-btn:hover::before {
  transform: scaleX(1);
}

.neon-btn:hover {
  color: #000;
  box-shadow: 0 0 25px cyan;
}

/* Secondary Button (Magenta) */
.neon-btn.secondary {
  border-color: magenta;
  color: magenta;
}

.neon-btn.secondary::before {
  background: magenta;
}

.neon-btn.secondary:hover {
  color: #000;
  box-shadow: 0 0 25px magenta;
}

/* =====================
   FOOTER / BACK LINK
===================== */
.footer {
  margin-top: 25px;
  text-align: center;
}

.back-link {
  color: rgba(0, 255, 255, 0.6);
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 1px;
  transition: 0.3s;
}

.back-link:hover {
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* =====================
   RESPONSIVE
===================== */
@media (max-width: 480px) {
  .inquiry-box {
    padding: 35px 25px;
  }

  .form-actions {
    flex-direction: column;
  }

  .inquiry-box h2 {
    font-size: 20px;
  }
}
</style>
</head>
<body>

<!-- PARTICLES -->
<script>
for (let i = 0; i < 50; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = 6 + Math.random() * 10 + "s";
  p.style.animationDelay = Math.random() * 5 + "s";
  document.body.appendChild(p);
}
</script>

<div class="inquiry-box">
  <h2>INQUIRY</h2>
  <p>Remember, you are talking to a person. I will get back to you promptly.</p>

  <form id="inquiry-form">
    <div class="field">
      <input type="text" id="item-name" name="item-name" readonly placeholder=" ">
      <label>ITEM NAME</label>
    </div>

    <div class="field">
      <input type="text" id="item-price" name="item-price" readonly placeholder=" ">
      <label>PRICE</label>
    </div>

    <div class="field">
      <input type="email" id="user-email" name="user-email" required placeholder=" ">
      <label>YOUR EMAIL *</label>
    </div>

    <div class="field">
      <textarea id="message" name="message" required placeholder=" "></textarea>
      <label>MESSAGE *</label>
    </div>

    <div class="form-actions">
      <button type="submit" class="neon-btn primary">SEND</button>
      <a href="index.html" class="neon-btn secondary">CANCEL</a>
    </div>
  </form>

  <div class="footer">
    <a href="index.html" class="back-link">← BACK TO HOME</a>
  </div>
</div>

<script>
  // Read URL parameters and pre-fill the form
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  // Pre-fill fields on page load
  window.addEventListener('DOMContentLoaded', () => {
    const itemName = getQueryParam('name');
    const itemPrice = getQueryParam('price');

    if (itemName) {
      document.getElementById('item-name').value = decodeURIComponent(itemName);
    }

    if (itemPrice) {
      document.getElementById('item-price').value = decodeURIComponent(itemPrice);
    }

    // Set default message
    const defaultMessage = `Hello,\n\nI am interested in learning more about "${itemName || 'this item'}".\n\nCould you please provide more information regarding availability and purchasing?\n\nThank you.`;
    document.getElementById('message').value = defaultMessage;
  });

  // Handle form submission
  document.getElementById('inquiry-form').addEventListener('submit', (e) => {
    e.preventDefault();

    const itemName = document.getElementById('item-name').value;
    const itemPrice = document.getElementById('item-price').value;
    const userEmail = document.getElementById('user-email').value;
    const message = document.getElementById('message').value;

    // Build mailto link
    const subject = encodeURIComponent(`Inquiry about: ${itemName}`);
    const body = encodeURIComponent(
      `From: ${userEmail}\n\n` +
      `Item: ${itemName}\n` +
      `Price: ${itemPrice}\n\n` +
      `Message:\n${message}`
    );

    const mailtoLink = `mailto:nebuluxeart@gmail.com?subject=${subject}&body=${body}`;

    // Open mail client
    window.location.href = mailtoLink;

    // Optional: Show confirmation or redirect
    setTimeout(() => {
      alert('Thank you for your inquiry! Your email client should open shortly.');
      window.location.href = 'other_services.html';
    }, 1000);
  });
</script>

</body>
</html>
