<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiry Form - Nebuluxe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #F7F5F0 0%, #E8DFD0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .inquiry-container {
      background: rgba(253, 251, 247, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(74, 64, 54, 0.15);
    }

    .inquiry-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .inquiry-header h1 {
      font-size: 28px;
      color: #4A4036;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .inquiry-header p {
      color: #6B5B4F;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #4A4036;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(192, 122, 95, 0.3);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: rgba(253, 251, 247, 0.6);
      color: #4A4036;
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #C07A5F;
      background: #FDFBF7;
      box-shadow: 0 0 0 3px rgba(192, 122, 95, 0.1);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group input[readonly] {
      background: rgba(192, 122, 95, 0.08);
      cursor: not-allowed;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      border: none;
      font-family: inherit;
    }

    .btn-primary {
      background: #C07A5F;
      color: #FDFBF7;
    }

    .btn-primary:hover {
      background: #A6684F;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(192, 122, 95, 0.35);
    }

    .btn-secondary {
      background: rgba(192, 122, 95, 0.1);
      color: #C07A5F;
      border: 1px solid rgba(192, 122, 95, 0.4);
    }

    .btn-secondary:hover {
      background: rgba(192, 122, 95, 0.2);
      transform: translateY(-2px);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #C07A5F;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #A6684F;
      transform: translateX(-4px);
    }

    @media (max-width: 768px) {
      .inquiry-container {
        padding: 30px 20px;
      }

      .inquiry-header h1 {
        font-size: 24px;
      }

      .form-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="inquiry-container">
    <a href="other_services.html" class="back-link">← Back to Gallery</a>

    <div class="inquiry-header">
      <h1>Inquiry Form</h1>
      <p>Fill out the form below and we'll get back to you shortly</p>
    </div>

    <form id="inquiry-form">
      <div class="form-group">
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" name="item-name" readonly>
      </div>

      <div class="form-group">
        <label for="item-price">Price Range</label>
        <input type="text" id="item-price" name="item-price" readonly>
      </div>

      <div class="form-group">
        <label for="user-email">Your Email *</label>
        <input type="email" id="user-email" name="user-email" required placeholder="your.email@example.com">
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" required placeholder="Your message here..."></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Send Inquiry</button>
        <a href="other_services.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>

  <script>
    // Read URL parameters and pre-fill the form
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Pre-fill fields on page load
    window.addEventListener('DOMContentLoaded', () => {
      const itemName = getQueryParam('name');
      const itemPrice = getQueryParam('price');

      if (itemName) {
        document.getElementById('item-name').value = decodeURIComponent(itemName);
      }

      if (itemPrice) {
        document.getElementById('item-price').value = decodeURIComponent(itemPrice);
      }

      // Set default message
      const defaultMessage = `Hello,\n\nI am interested in learning more about "${itemName || 'this item'}".\n\nCould you please provide more information regarding availability and purchasing?\n\nThank you.`;
      document.getElementById('message').value = defaultMessage;
    });

    // Handle form submission
    document.getElementById('inquiry-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const itemName = document.getElementById('item-name').value;
      const itemPrice = document.getElementById('item-price').value;
      const userEmail = document.getElementById('user-email').value;
      const message = document.getElementById('message').value;

      // Build mailto link
      const subject = encodeURIComponent(`Inquiry about: ${itemName}`);
      const body = encodeURIComponent(
        `From: ${userEmail}\n\n` +
        `Item: ${itemName}\n` +
        `Price: ${itemPrice}\n\n` +
        `Message:\n${message}`
      );

      const mailtoLink = `mailto:nebuluxeart@gmail.com?subject=${subject}&body=${body}`;

      // Open mail client
      window.location.href = mailtoLink;

      // Optional: Show confirmation or redirect
      setTimeout(() => {
        alert('Thank you for your inquiry! Your email client should open shortly.');
        window.location.href = 'other_services.html';
      }, 1000);
    });
  </script>
</body>
</html>
