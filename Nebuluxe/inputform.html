<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a Message</title>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
html, body {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: #121212;
  background-attachment: fixed;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

#projector {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ========================================== */
/* Orange/Gray Animations */
/* ========================================== */
@keyframes rainbow-bg {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes logo-rainbow-pulse {
  0% { filter: drop-shadow(0 0 5px #ff8800) drop-shadow(0 0 10px #ffaa33) drop-shadow(0 0 15px #ffcc66); }
  50% { filter: drop-shadow(0 0 5px #ffaa33) drop-shadow(0 0 10px #ff8800) drop-shadow(0 0 15px #ff6600); }
  100% { filter: drop-shadow(0 0 5px #ff8800) drop-shadow(0 0 10px #ffaa33) drop-shadow(0 0 15px #ffcc66); }
}

/* ========================================== */
/* Top Banner Styles */
/* ========================================== */
.top-banner {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 110px;
  display: grid;
  grid-template-columns: 120px 1fr 120px;
  align-items: center;
  padding: 0 30px;
  z-index: 100;
  background: rgba(30, 30, 30, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 2px solid transparent;
  position: relative;
}

.top-banner::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, #ff8800, #ffaa33, #ffcc66, #ff8800);
  background-size: 200% auto;
  animation: rainbow-bg 3s linear infinite;
  box-shadow: 0 0 10px #ff8800, 0 0 20px #ffaa33;
}

.banner-title {
  justify-self: center;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin: 0;
  background: linear-gradient(90deg, #ff8800, #ffaa33, #ffcc66, #ff8800);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow-bg 3s linear infinite;
  filter: drop-shadow(0 0 8px rgba(255, 136, 0, 0.6));
}

/* ========================================== */
/* Glowing Logo (Adapted for Banner) */
/* ========================================== */
.glowing-logo-wrapper {
  position: relative;
  left: auto;
  top: auto;
  transform: none;
  width: 90px;
  z-index: 101;
  pointer-events: auto;
  justify-self: start;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.glowing-logo-svg {
  width: 100%;
  height: auto;
  display: block;
  animation: logo-rainbow-pulse 4s ease-in-out infinite alternate;
  transition: filter 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.glowing-logo-svg g {
  fill: #e0e0e0 !important;
}

.glowing-logo-wrapper:hover .glowing-logo-svg {
  animation-play-state: paused;
  filter: drop-shadow(0 0 10px #ff8800)
          drop-shadow(0 0 20px #ffaa33)
          drop-shadow(0 0 30px #ffcc66);
  transform: scale(1.08);
}

/* ========================================== */
/* ========== MASCOT POPUP STYLES ========== */
/* ========================================== */
.mascot-popup {
  position: fixed;
  bottom: 60px;
  left: 5%;
  z-index: 101;
  width: 110px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  pointer-events: none;
}

.mascot-gif-wrapper {
  position: relative;
  width: 110px;
  height: 110px;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
  animation: mascotFloat 3.5s ease-in-out infinite;
  filter: drop-shadow(0 0 8px #ff8800) drop-shadow(0 0 15px #ffaa33);
}

.mascot-gif {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 8px #ff8800) drop-shadow(0 0 15px #ffaa33);
  transition: filter 0.3s ease, transform 0.3s ease;
}

.mascot-gif-wrapper:hover .mascot-gif {
  filter: drop-shadow(0 0 15px #ff8800) drop-shadow(0 0 30px #ffaa33);
  transform: scale(1.08);
}

.mascot-gif-wrapper:active .mascot-gif {
  transform: scale(0.95);
}

.mascot-glow {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 12px;
  background: radial-gradient(ellipse at center, #ff8800 0%, #ffaa33 70%);
  border-radius: 50%;
  filter: blur(6px);
  animation: glowPulse 2.5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes mascotFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
  50%      { opacity: 1;   transform: translateX(-50%) scale(1.15); }
}

.speech-bubble {
  position: absolute;
  bottom: calc(100% + 20px);
  left: 0;
  width: 280px;
  background: #2a2a2a;
  border: 2px solid #ff8800;
  border-radius: 16px;
  box-shadow: 0 0 15px rgba(255, 136, 0, 0.3);
  color: #e0e0e0;
  pointer-events: auto;
  opacity: 1;
  transform: translateY(10px) scale(0.95);
  transform-origin: bottom left;
  transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
  visibility: hidden;
}

.speech-bubble.is-open {
  opacity: 1;
  transform: translateY(0) scale(1);
  visibility: visible;
  box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
}

.speech-content {
  padding: 18px 20px;
  position: relative;
  z-index: 2;
}

.speech-text {
  margin: 0;
  font-size: 14px;
  line-height: 1.6;
  color: #e0e0e0;
  min-height: 44px;
}

.speech-bubble.is-open .speech-text::after {
  content: '';
  display: inline-block;
  width: 4px;
  height: 12px;
  margin-left: 2px;
  background: #ff8800;
  vertical-align: middle;
  animation: caretBlink 1s steps(2) infinite;
  box-shadow: 0 0 6px #ff8800;
}

@keyframes caretBlink {
  0%, 50%   { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.speech-options {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  padding-top: 12px;
}

.speech-option {
  background: none;
  border: 1px solid transparent;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 6px;
  transition: all 0.25s ease;
  margin: 0;
}

.speech-option::before {
  content: '> ';
  color: #ff8800;
  font-weight: bold;
  transition: all 0.25s ease;
}

.speech-option:hover {
  color: #ffffff;
  background: rgba(255, 136, 0, 0.1);
  border-color: #ff8800;
  box-shadow: 0 0 10px rgba(255, 136, 0, 0.4);
  transform: translateX(4px);
}

.speech-option:hover::before {
  color: #ffcc66;
  text-shadow: 0 0 8px #ffcc66;
}

.speech-tail {
  position: absolute;
  top: 100%;
  left: 40px;
  width: 20px;
  height: 20px;
  background: #2a2a2a;
  border-right: 2px solid #ff8800;
  border-bottom: 2px solid #ff8800;
  transform: rotate(45deg);
  margin-top: -12px;
  z-index: 100;
}

.speech-bubble::before {
  content: '';
  position: absolute;
  top: 100%;
  left: 38px;
  width: 24px;
  height: 4px;
  background: #2a2a2a;
  z-index: 2;
}

@media (max-width: 480px) {
  .mascot-popup { bottom: 40px; left: 5%; }
  .mascot-gif-wrapper { width: 80px; height: 80px; }
  .speech-bubble { width: 240px; }
  .speech-content { padding: 14px 16px; }
  .speech-text { font-size: 13px; }
  .speech-option { font-size: 12px; }
}
/* Honeypot: moved off-screen instead of display:none so bots still see it */
.neon-inquiry-section .hp-field {
  position: absolute !important;
  left: -9999px !important;
  top: -9999px !important;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

/* Locked state during transmission + cooldown */
.neon-inquiry-section .neon-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  letter-spacing: 2px;
}
.neon-inquiry-section .neon-btn:disabled:hover {
  color: #f0f0f0;
  box-shadow: none;
}
.neon-inquiry-section .neon-btn:disabled:hover::before {
  transform: scaleX(0);
}
/* ========================================== */
/* CYBERPUNK MECHA MUSIC PLAYER STYLES */
/* ========================================== */
:root {
  --neon-orange: #ff8800;
  --neon-glow: rgba(255, 136, 0, 0.6);
  --dark-metal: #1e1e1e;
  --grunge-gray: #2a2a2a;
  --mech-border: 2px solid var(--neon-orange);
}

.music-player-container {
  position: fixed;
  top: 30px;
  right: 30px;
  z-index: 9999;
  font-family: 'Share Tech Mono', monospace;
  perspective: 1000px;
}

.activation-core {
  width: 60px;
  height: 60px;
  background: var(--dark-metal);
  border: var(--mech-border);
  clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 0 15px var(--neon-glow), inset 0 0 10px rgba(255, 136, 0, 0.2);
  position: relative;
  z-index: 10001;
}

.activation-core:hover {
  background: var(--neon-orange);
  box-shadow: 0 0 25px var(--neon-orange);
}

.activation-core:hover .core-icon {
  color: var(--dark-metal);
  animation: icon-glitch 0.3s ease-in-out;
}

.core-icon {
  color: var(--neon-orange);
  font-size: 32px;
  transition: color 0.3s ease;
  position: relative;
  z-index: 2;
}

.sonar-container {
  position: fixed;
  width: 0;
  height: 0;
  z-index: 10000;
  pointer-events: none;
}

.sonar-wave {
  position: absolute;
  top: 0;
  left: 0;
  width: 30px;
  height: 30px;
  border: 2px solid var(--neon-orange);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1);
  opacity: 0;
  animation: sonar-pulse 6s ease-out 1;
}

.sonar-wave:nth-child(1) { animation-delay: 0s; }
.sonar-wave:nth-child(2) { animation-delay: 2s; }
.sonar-wave:nth-child(3) { animation-delay: 4s; }

.music-player-container.panel-open .sonar-wave {
  animation: none;
  opacity: 0;
}

@keyframes sonar-pulse {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; border-width: 3px; }
  50% { opacity: 0.4; border-width: 2px; }
  100% { transform: translate(-50%, -50%) scale(8.6); opacity: 0; border-width: 1px; }
}

@keyframes icon-glitch {
  0%, 100% { transform: translate(0); text-shadow: none; }
  10% { transform: translate(-2px, 1px); text-shadow: 2px 0 #ff8800, -2px 0 #ffcc66; }
  20% { transform: translate(2px, -1px); text-shadow: -2px 0 #ff8800, 2px 0 #ffcc66; }
  30% { transform: translate(-1px, 2px); text-shadow: 1px 0 #ff8800, -1px 0 #ffcc66; }
  40% { transform: translate(1px, -2px); text-shadow: -1px 0 #ff8800, 1px 0 #ffcc66; }
  50% { transform: translate(0); text-shadow: none; }
}

.mecha-panel {
  position: absolute;
  top: 50px;
  right: 0;
  width: 340px;
  display: flex;
  flex-direction: column;
  pointer-events: none;
  clip-path: polygon(50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%);
  transition: clip-path 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), transform 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  transform-origin: top right;
  transform: rotate(-5deg) scale(0.95);
}

.mecha-panel.open {
  pointer-events: auto;
  clip-path: polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%, 0% 100%, 0% 100%, 0% 0%, 0% 0%);
  transform: rotate(0deg) scale(1);
}

.mech-plate {
  background: var(--dark-metal);
  border: 1px solid #444;
  position: relative;
  overflow: hidden;
}

.mech-plate::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
  pointer-events: none;
  z-index: 2;
}

.plate-header {
  height: 40px;
  border-bottom: var(--mech-border);
  display: flex;
  align-items: center;
  padding: 0 15px;
  justify-content: space-between;
  color: var(--neon-orange);
  font-size: 12px;
  letter-spacing: 2px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 70%);
}

.plate-main {
  padding: 20px;
  border-bottom: 1px dashed #555;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
}

.plate-controls {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  background: linear-gradient(180deg, var(--grunge-gray) 0%, var(--dark-metal) 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 30%);
}

.mech-hinge {
  position: absolute;
  width: 15px;
  height: 100%;
  background: repeating-linear-gradient(45deg, #333, #333 5px, #222 5px, #222 10px);
  border-left: 1px solid var(--neon-orange);
  right: -15px;
  top: 0;
  opacity: 0;
  transition: opacity 0.5s ease 0.3s;
}

.mecha-panel.open .mech-hinge { opacity: 1; }

.oval-frame {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--neon-orange);
  box-shadow: 0 0 15px var(--neon-glow), inset 0 0 20px rgba(0,0,0,0.8);
  position: relative;
  background: #1e1e1e;
}

.oval-frame::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.15"/></svg>');
  pointer-events: none;
  mix-blend-mode: overlay;
}

.album-art {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: contrast(1.1) saturate(0.8);
}

.song-info {
  text-align: center;
  width: 100%;
}

.song-title {
  font-size: 16px;
  font-weight: bold;
  color: #e0e0e0;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255, 136, 0, 0.3);
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist-name {
  font-size: 12px;
  color: var(--neon-orange);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.control-btn {
  background: transparent;
  border: 1px solid #555;
  color: var(--neon-orange);
  cursor: pointer;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
}

.control-btn:hover {
  background: var(--neon-orange);
  color: #1e1e1e;
  box-shadow: 0 0 15px var(--neon-glow);
  border-color: var(--neon-orange);
}

.play-btn {
  width: 65px;
  height: 65px;
  border: 2px solid var(--neon-orange);
  background: rgba(255, 136, 0, 0.1);
}

.play-btn svg { width: 28px; height: 28px; }

.glitch-text { animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both; }

@keyframes glitch-anim {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
  100% { transform: translate(0); }
}

.blink { animation: blinker 1s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }

@media (max-width: 768px) {
  .music-player-container { top: 10px; right: 10px; }
  .mecha-panel { width: 280px; }
  .oval-frame { width: 130px; height: 130px; }
}
</style>
</head>

<!-- ========== MASCOT POPUP SCRIPT ========== -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const trigger      = document.getElementById('mascotTrigger');
  const bubble       = document.getElementById('speechBubble');
  const speechText   = document.getElementById('speechText');
  const optionsBox   = document.getElementById('dialogueOptions');

  if (!trigger || !bubble) return;

  let autoCloseTimer = null;

  const dialogue = {
    root: {
      text: "On this page you can message the developer/artist about anything you'd like.",
      options: [
        { label: "Can I request a commission?", next: "commission" },
        { label: "I'd like to talk to the artist about one of their peices", next: "art_dialogue" },
        { label: "I have something not art related I want to talk about", next: "offtopic" },
      ]
    },
    commission: {
      text: "Of course! Just include your idea with as much detail as you'd like. If you have a budget or a deadline these can be important things to include in the message as well",
      options: [
        { label: "Great, thanks!", next: "polite_close" }
      ]
    },
    art_dialogue: {
      text: "Please do. Any thoughts you had about a piece, emotions it invoked or things it reminded you of. Most pieces are animated by ideas, and all discussions around them are welcome!",
      options: [
        { label: "Great, thanks!", next: "polite_close" }
      ]
    },
    off_topic: {
      text: "That is fine too! But just so you know I got limited minutes here.",
      options: [
        { label: "I actually want to express how much I hate this site. I can't find a google profile to leave a 1 star review under so I came here.", next: "silent_close" },
        { label: "Great, thanks!", next: "polite_close" }
      ]
    },
    silent_close: {
      text: "...",
      autoClose: true,
      options: []
    },
    polite_close: {
      text: "Of course!",
      autoClose: true,
      options: []
    }
  };

  function closeBubble() {
    bubble.classList.remove('is-open');
    if (autoCloseTimer) {
      clearTimeout(autoCloseTimer);
      autoCloseTimer = null;
    }
  }

  function showNode(key) {
    const node = dialogue[key];
    if (!node) return;

    if (autoCloseTimer) {
      clearTimeout(autoCloseTimer);
      autoCloseTimer = null;
    }

    speechText.textContent = node.text;
    optionsBox.innerHTML = '';

    if (node.autoClose) {
      autoCloseTimer = setTimeout(function() {
        closeBubble();
      }, 2000);
    } else if (node.options && node.options.length > 0) {
      node.options.forEach(function(opt) {
        const btn = document.createElement('button');
        btn.className = 'speech-option';
        btn.textContent = opt.label;
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          showNode(opt.next);
        });
        optionsBox.appendChild(btn);
      });
    } else {
      const btn = document.createElement('button');
      btn.className = 'speech-option';
      btn.textContent = '...';
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        showNode('root');
      });
      optionsBox.appendChild(btn);
    }
  }

  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    const opening = !bubble.classList.contains('is-open');
    if (opening) {
      bubble.classList.add('is-open');
      showNode('root');
    } else {
      closeBubble();
    }
  });

  document.addEventListener('click', function(e) {
    if (!bubble.contains(e.target) && !trigger.contains(e.target)) {
      closeBubble();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeBubble();
    }
  });
});
</script>

<!-- ========== PARTICLE ENGINE SCRIPT ========== -->
<script>
var ParticleEngine = (function() {
	'use strict';
	function ParticleEngine(canvas_id) {
		if (!(this instanceof ParticleEngine)) return new ParticleEngine(canvas_id);
		var _ParticleEngine = this;
		this.canvas_id = canvas_id;
		this.stage = new createjs.Stage(canvas_id);
		this.totalWidth = this.canvasWidth = document.getElementById(canvas_id).width = document.getElementById(canvas_id).offsetWidth;
		this.totalHeight = this.canvasHeight = document.getElementById(canvas_id).height = document.getElementById(canvas_id).offsetHeight;
		this.compositeStyle = "source-over";
		this.particleSettings = [
			{id:"small", num:300, fromX:0, toX:this.totalWidth, ballwidth:3, alphamax:0.8, areaHeight:.5, color:"#ffaa33", fill:false},
			{id:"medium", num:100, fromX:0, toX:this.totalWidth, ballwidth:8, alphamax:0.6, areaHeight:1, color:"#ff8800", fill:true},
			{id:"large", num:10, fromX:0, toX:this.totalWidth, ballwidth:30, alphamax:0.4, areaHeight:1, color:"#ffcc66", fill:true}
		];
		this.particleArray = [];
		this.lights = [
			{ellipseWidth:400, ellipseHeight:100, alpha:0.3, offsetX:0, offsetY:0, color:"#ff8800"},
			{ellipseWidth:350, ellipseHeight:250, alpha:0.2, offsetX:-50, offsetY:0, color:"#ffaa33"},
			{ellipseWidth:100, ellipseHeight:80, alpha:0.2, offsetX:80, offsetY:-50, color:"#ffcc66"}
		];
		this.stage.compositeOperation = _ParticleEngine.compositeStyle;

		function drawBgLight() {
			for (var i = 0, len = _ParticleEngine.lights.length; i < len; i++) {
				var light = new createjs.Shape();
				light.graphics.beginFill(_ParticleEngine.lights[i].color).drawEllipse(0, 0, _ParticleEngine.lights[i].ellipseWidth, _ParticleEngine.lights[i].ellipseHeight);
				light.regX = _ParticleEngine.lights[i].ellipseWidth/2;
				light.regY = _ParticleEngine.lights[i].ellipseHeight/2;
				light.y = light.initY = _ParticleEngine.totalHeight/2 + _ParticleEngine.lights[i].offsetY;
				light.x = light.initX = _ParticleEngine.totalWidth/2 + _ParticleEngine.lights[i].offsetX;
				var blurFilter = new createjs.BlurFilter(_ParticleEngine.lights[i].ellipseWidth, _ParticleEngine.lights[i].ellipseHeight, 1);
				var bounds = blurFilter.getBounds();
				light.filters = [blurFilter];
				light.cache(bounds.x-_ParticleEngine.lights[i].ellipseWidth/2, bounds.y-_ParticleEngine.lights[i].ellipseHeight/2, bounds.width*2, bounds.height*2);
				light.alpha = _ParticleEngine.lights[i].alpha;
				light.compositeOperation = "source-over";
				_ParticleEngine.stage.addChildAt(light, 0);
				_ParticleEngine.lights[i].elem = light;
			}
			gsap.fromTo(_ParticleEngine.lights[0].elem, {scaleX:1.5, x:_ParticleEngine.lights[0].elem.initX, y:_ParticleEngine.lights[0].elem.initY}, {duration: 10, yoyo:true, repeat:-1, ease:"power1.inOut", scaleX:2, scaleY:0.7});
			gsap.fromTo(_ParticleEngine.lights[1].elem, {x:_ParticleEngine.lights[1].elem.initX, y:_ParticleEngine.lights[1].elem.initY}, {duration: 12, delay:5, yoyo:true, repeat:-1, ease:"power1.inOut", scaleY:2, scaleX:2, y:_ParticleEngine.totalHeight/2-50, x:_ParticleEngine.totalWidth/2+100});
			gsap.fromTo(_ParticleEngine.lights[2].elem, {x:_ParticleEngine.lights[2].elem.initX, y:_ParticleEngine.lights[2].elem.initY}, {duration: 8, delay:2, yoyo:true, repeat:-1, ease:"power1.inOut", scaleY:1.5, scaleX:1.5, y:_ParticleEngine.totalHeight/2, x:_ParticleEngine.totalWidth/2-200});
		}

		function drawParticles() {
			for (var i = 0, len = _ParticleEngine.particleSettings.length; i < len; i++) {
				var ball = _ParticleEngine.particleSettings[i];
				for (var s = 0; s < ball.num; s++ ) {
					var circle = new createjs.Shape();
					if(ball.fill) {
						circle.graphics.beginFill(ball.color).drawCircle(0, 0, ball.ballwidth);
						var blurFilter = new createjs.BlurFilter(ball.ballwidth/2, ball.ballwidth/2, 1);
						circle.filters = [blurFilter];
						var bounds = blurFilter.getBounds();
						circle.cache(-50+bounds.x, -50+bounds.y, 100+bounds.width, 100+bounds.height);
					} else {
						circle.graphics.beginStroke(ball.color).setStrokeStyle(1).drawCircle(0, 0, ball.ballwidth);
					}
					circle.alpha = range(0, 0.1);
					circle.alphaMax = ball.alphamax;
					circle.distance = ball.ballwidth * 2;
					circle.ballwidth = ball.ballwidth;
					circle.flag = ball.id;
					_ParticleEngine.applySettings(circle, ball.fromX, ball.toX, ball.areaHeight);
					circle.speed = range(2, 10);
					circle.y = circle.initY;
					circle.x = circle.initX;
					circle.scaleX = circle.scaleY = range(0.3, 1);
					_ParticleEngine.stage.addChild(circle);
					animateBall(circle);
					_ParticleEngine.particleArray.push(circle);
				}
			}
		}

		this.applySettings = function(circle, positionX, totalWidth, areaHeight) {
			circle.speed = range(1, 3);
			circle.initY = weightedRange(0, _ParticleEngine.totalHeight, 1, [_ParticleEngine.totalHeight * (2-areaHeight/2)/4, _ParticleEngine.totalHeight*(2+areaHeight/2)/4], 0.8 );
			circle.initX = weightedRange(positionX, totalWidth, 1, [positionX+ ((totalWidth-positionX))/4, positionX+ ((totalWidth-positionX)) * 3/4], 0.6);
		}

		function animateBall(ball) {
			var scale = range(0.3, 1);
			var xpos = range(ball.initX - ball.distance, ball.initX + ball.distance);
			var ypos = range(ball.initY - ball.distance, ball.initY + ball.distance);
			var speed = ball.speed;
			gsap.to(ball, {duration: speed, scaleX: scale, scaleY: scale, x: xpos, y: ypos, onComplete: animateBall, onCompleteParams: [ball], ease: "power3.inOut"});
			gsap.to(ball, {duration: speed/2, alpha: range(0.1, ball.alphaMax), onComplete: fadeout, onCompleteParams: [ball, speed]});
		}

		function fadeout(ball, speed) {
			ball.speed = range(2, 10);
			gsap.to(ball, {duration: speed/2, alpha: 0 });
		}
		drawBgLight();
		drawParticles();
	}

	ParticleEngine.prototype.render = function() { this.stage.update(); }
	ParticleEngine.prototype.resize = function() {
		this.totalWidth = this.canvasWidth = document.getElementById(this.canvas_id).width = document.getElementById(this.canvas_id).offsetWidth;
		this.totalHeight = this.canvasHeight = document.getElementById(this.canvas_id).height = document.getElementById(this.canvas_id).offsetHeight;
		this.render();
		for (var i = 0, length = this.particleArray.length; i < length; i++) {
			this.applySettings(this.particleArray[i], 0, this.totalWidth, this.particleArray[i].areaHeight);
		}
		for (var j = 0, len = this.lights.length; j < len; j++) {
			this.lights[j].elem.initY = this.totalHeight/2 + this.lights[j].offsetY;
			this.lights[j].elem.initX = this.totalWidth/2 + this.lights[j].offsetX;
			gsap.to(this.lights[j].elem, {duration: 0.5, x: this.lights[j].elem.initX, y: this.lights[j].elem.initY});
		}
	}
	return ParticleEngine;
}());

function range(min, max) { return min + (max - min) * Math.random(); }
function round(num, precision) { var decimal = Math.pow(10, precision); return Math.round(decimal * num) / decimal; }
function weightedRange(to, from, decimalPlaces, weightedRange, weightStrength) {
	if (typeof from === "undefined" || from === null) from = 0;
	if (typeof decimalPlaces === "undefined" || decimalPlaces === null) decimalPlaces = 0;
	if (typeof weightedRange === "undefined" || weightedRange === null) weightedRange = 0;
	if (typeof weightStrength === "undefined" || weightStrength === null) weightStrength = 0;
	var ret;
	if(to == from) { return(to); }
	if(weightedRange && Math.random() <= weightStrength) {
		ret = round(Math.random() * (weightedRange[1] - weightedRange[0]) + weightedRange[0], decimalPlaces);
	} else {
		ret = round(Math.random() * (to - from) + from, decimalPlaces);
	}
	return ret;
}

var particles;
(function(){
	particles = new ParticleEngine('projector');
	createjs.Ticker.on("tick", updateCanvas);
	window.addEventListener('resize', resizeCanvas, false);
	function updateCanvas(){ particles.render(); }
	function resizeCanvas(){ particles.resize(); }
}());
</script>

    const rect = activationCore.getBoundingClientRect();
    const centerX = rect.left + (rect.width / 2);
    const centerY = rect.top + (rect.height / 2);
    sonarContainer.style.left = centerX + 'px';
    sonarContainer.style.top = centerY + 'px';
  }

  window.addEventListener('load', positionSonar);
  window.addEventListener('resize', positionSonar);
  positionSonar();

  function updateUI() {
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
    playPauseBtn.title = isPlaying ? 'Pause' : 'Play';

    if (typeof playlist !== 'undefined' && playlist.length > 0) {
      const currentSong = playlist[currentSongIndex];
      songTitle.classList.remove('glitch-text');
      artistName.classList.remove('glitch-text');
      void songTitle.offsetWidth;
      songTitle.classList.add('glitch-text');
      artistName.classList.add('glitch-text');
      songTitle.textContent = currentSong.title;
      artistName.textContent = currentSong.artist;
      albumArtImg.src = currentSong.art || 'https://via.placeholder.com/160x160/1e1e1e/ff8800?text=NO+DISC';
    }
  }

  function togglePlayer() {
    isOpen = !isOpen;
    mechaPanel.classList.toggle('open', isOpen);
    playerContainer.classList.toggle('panel-open', isOpen);
    const coreIcon = document.querySelector('.core-icon');
    coreIcon.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  function togglePlayPause() {
    if (isPlaying) {
      audio.pause();
    } else {
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => console.error("Play promise failed:", error));
      }
    }
  }

  function shuffleNext() {
    if (typeof playlist === 'undefined' || playlist.length === 0) return;
    let nextIndex;
    do {
      nextIndex = Math.floor(Math.random() * playlist.length);
    } while (nextIndex === currentSongIndex && playlist.length > 1);
    currentSongIndex = nextIndex;
    audio.src = playlist[currentSongIndex].src;
    audio.play().catch(err => console.error('Play error:', err));
  }

  function saveState() {
    if (typeof playlist !== 'undefined' && playlist.length > 0) {
      const state = {
        song: playlist[currentSongIndex].src,
        position: audio.currentTime,
        playing: !audio.paused,
        songIndex: currentSongIndex
      };
      sessionStorage.setItem('musicState', JSON.stringify(state));
    }
  }

  function restoreState() {
    const savedState = sessionStorage.getItem('musicState');
    if (savedState && typeof playlist !== 'undefined') {
      try {
        const state = JSON.parse(savedState);
        const foundIndex = playlist.findIndex(song => song.src === state.song);
        currentSongIndex = foundIndex !== -1 ? foundIndex : 0;
        audio.src = playlist[currentSongIndex].src;
        audio.addEventListener('loadedmetadata', () => {
          audio.currentTime = state.position;
          if (state.playing) audio.play().catch(err => console.error('Autoplay prevented on restore:', err));
        }, { once: true });
      } catch (e) {
        console.error('Failed to restore music state:', e);
        currentSongIndex = 0;
        audio.src = playlist[0].src;
      }
    } else if (typeof playlist !== 'undefined' && playlist.length > 0) {
      currentSongIndex = 0;
      audio.src = playlist[0].src;
    }
  }

  activationCore.addEventListener('click', togglePlayer);
  playPauseBtn.addEventListener('click', togglePlayPause);
  shuffleBtn.addEventListener('click', shuffleNext);

  audio.addEventListener('play', () => { isPlaying = true; updateUI(); });
  audio.addEventListener('pause', () => { isPlaying = false; updateUI(); });
  audio.addEventListener('ended', () => shuffleNext());

  audio.addEventListener('error', () => {
    let errorMsg = "Unknown error";
    if (audio.error) {
      switch (audio.error.code) {
        case 1: errorMsg = "Aborted"; break;
        case 2: errorMsg = "Network Error"; break;
        case 3: errorMsg = "Decode Error"; break;
        case 4: errorMsg = "File Not Found / Unsupported Format"; break;
      }
    }
    console.error("🚨 AUDIO LOAD ERROR:", errorMsg, "| Attempted to load:", audio.src);
  });

  window.addEventListener('beforeunload', saveState);
  restoreState();
  updateUI();
</script>

<script>
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  // ==========================================
  // SUBMISSION GUARDS (debounce + cooldown)
  // ==========================================
  const COOLDOWN_MS = 5000;
  let isSubmitting = false;
  let cooldownTimer = null;
  let currentDefaultMessage = '';

  function startCooldown(ms = COOLDOWN_MS) {
    const btn = document.querySelector('.neon-btn.primary');
    if (!btn) return;

    const endsAt = Date.now() + ms;

    if (cooldownTimer) clearInterval(cooldownTimer);
    btn.disabled = true;

    const tick = () => {
      const remaining = Math.ceil((endsAt - Date.now()) / 1000);
      if (remaining <= 0) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        btn.disabled = false;
        btn.innerText = 'SEND';
      } else {
        btn.innerText = `WAIT ${remaining}s`;
      }
    };

    tick();
    cooldownTimer = setInterval(tick, 250);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const nameParam = getQueryParam('name');
    const titleParam = getQueryParam('title');
    const itemPriceParam = getQueryParam('price');

    let itemName = 'Commission/Question/Rebuttal';
    let priceValue = 'N/A';

    let defaultMessage = `Hello,

I have an idea for some work I would like from you. Here is what I was thinking:

[Please describe your vision. If you have hard constraints for me please include them. These could be timelines, price, specific subject matter, or something else.]

How would this look on your end?

-Thanks
[I would love to know who I am talking to :)]`;

    if (nameParam || titleParam) {
      itemName = nameParam ? decodeURIComponent(nameParam) : decodeURIComponent(titleParam);

      if (itemPriceParam) {
        priceValue = decodeURIComponent(itemPriceParam);
      }

      defaultMessage = `Hello,\n\nI am interested in learning more about "${itemName}".\n\nCould you please provide more information regarding availability and purchasing?\n\nThank you.`;
    }

    currentDefaultMessage = defaultMessage;

    const nameInput = document.getElementById('item-name');
    const priceInput = document.getElementById('item-price');
    const messageInput = document.getElementById('message');

    if (nameInput) nameInput.value = itemName;
    if (priceInput) priceInput.value = priceValue;
    if (messageInput) messageInput.value = defaultMessage;

    // Attach submit listener safely inside DOMContentLoaded
    const form = document.getElementById('inquiry-form');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (isSubmitting) return;

        if (cooldownTimer) {
          showCustomAlert('Transmission systems are still cooling down. Please wait a moment.', false);
          return;
        }

        const honeypot = document.getElementById('botcheck');
        if (honeypot && honeypot.checked) {
          console.warn('Honeypot triggered — submission discarded.');
          return;
        }

        const subject = document.getElementById('item-name').value.trim();
        const userEmail = document.getElementById('user-email').value.trim();
        const message = document.getElementById('message').value;
        const messageTrimmed = message.trim();

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(userEmail)) {
          showCustomAlert('Please enter a valid email address before transmitting.', false);
          return;
        }

        if (!subject) {
          showCustomAlert('The subject line cannot be empty.', false);
          return;
        }
        if (subject.length > 100) {
          showCustomAlert('The subject line must be 100 characters or less.', false);
          return;
        }

        if (!messageTrimmed) {
          showCustomAlert('The message field cannot be empty.', false);
          return;
        }
        if (messageTrimmed === currentDefaultMessage.trim()) {
          showCustomAlert('Please replace the default placeholder text with your actual message.', false);
          return;
        }
        if (message.length > 2000) {
          showCustomAlert('Your message must be 2000 characters or less.', false);
          return;
        }

        const currentPrice = document.getElementById('item-price').value;
        const WEB3FORMS_ACCESS_KEY = '0108ebc0-9be2-4a94-ba74-9a19ea1cdcf7';

        const formData = {
          access_key: WEB3FORMS_ACCESS_KEY,
          subject: `Inquiry about: ${subject}`,
          from_name: "Nebuluxe Inquiry Form",
          email: userEmail,
          botcheck: honeypot && honeypot.checked ? 'on' : '',
          message: `Item: ${subject}\nPrice: ${currentPrice}\n\nMessage:\n${message}`
        };

        const submitBtn = document.querySelector('.neon-btn.primary');

        try {
          isSubmitting = true;
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = 'TRANSMITTING...';
          }

          const response = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(formData)
          });

          const result = await response.json();

          if (result.success) {
            form.reset();
            showCustomAlert('Message received, expect a reply from nebuluxeart@gmail.com', true);
          } else {
            throw new Error(result.message || 'For some reason our communication has short circuited :( your message has not gone through.');
          }
        } catch (error) {
          console.error('Error:', error);
          showCustomAlert('There was an error sending your message. Please try again or email me directly at nebuluxeart@gmail.com.', false);
        } finally {
          isSubmitting = false;
          startCooldown();
        }
      });
    } else {
      console.error("Form with ID 'inquiry-form' not found.");
    }
  });

  function showCustomAlert(message, isSuccess = true) {
    const overlay = document.getElementById('custom-alert-overlay');
    const msgEl = document.getElementById('custom-alert-message');
    const btn = document.getElementById('custom-alert-btn');

    if (!overlay || !msgEl || !btn) return;

    msgEl.textContent = message;

    if (isSuccess) {
      overlay.style.setProperty('--alert-color', '#ff8800');
      overlay.style.setProperty('--alert-glow', 'rgba(255, 136, 0, 0.5)');
      btn.innerText = 'OK';
    } else {
      overlay.style.setProperty('--alert-color', '#888888');
      overlay.style.setProperty('--alert-glow', 'rgba(136, 136, 136, 0.5)');
      btn.innerText = 'UNDERSTOOD';
    }

    overlay.style.display = 'flex';

    // Clone button to remove any previous event listeners and prevent stacking
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);

    newBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      if (isSuccess) {
        window.location.href = 'index.html'; // Redirects to home page
      }
    });
  }
</script>
