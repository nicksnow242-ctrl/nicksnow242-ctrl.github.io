<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Inquiry</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* =====================
   RESET & BASE
===================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Orbitron', sans-serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #0f2027, #000);
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 20px;
}

/* =====================
   PARTICLES
===================== */
.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: cyan;
  opacity: 0.6;
  animation: float 12s linear infinite;
  pointer-events: none;
}

@keyframes float {
  from {
    transform: translateY(100vh) translateX(0);
  }
  to {
    transform: translateY(-10vh) translateX(80px);
  }
}

/* =====================
   INQUIRY CARD
===================== */
.inquiry-box {
  position: relative;
  width: 100%;
  max-width: 500px;
  padding: 45px 40px;
  background: rgba(0, 0, 0, 0.75);
  border-radius: 18px;
  box-shadow:
    0 0 30px rgba(0, 255, 255, 0.25),
    inset 0 0 20px rgba(0, 255, 255, 0.15);
  border: 1px solid rgba(0, 255, 255, 0.4);
  animation: fadeIn 1.2s ease;
  z-index: 10;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.inquiry-box::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 20px;
  background: linear-gradient(45deg, cyan, magenta, cyan);
  z-index: -1;
  filter: blur(18px);
  animation: glow 6s linear infinite;
}

@keyframes glow {
  0% { filter: blur(18px) hue-rotate(0deg); }
  100% { filter: blur(18px) hue-rotate(360deg); }
}

/* =====================
   TITLE
===================== */
.inquiry-box h2 {
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 3px;
  color: #fff;
}

.inquiry-box > p {
  text-align: center;
  font-size: 11px;
  opacity: 0.7;
  margin-bottom: 35px;
  letter-spacing: 1px;
}

/* =====================
   INPUTS & TEXTAREA
===================== */
.field {
  position: relative;
  margin-bottom: 28px;
}

.field input,
.field textarea {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: none;
  outline: none;
  color: cyan;
  border-bottom: 2px solid rgba(0, 255, 255, 0.3);
  font-size: 14px;
  font-family: 'Orbitron', sans-serif;
  transition: 0.3s;
}

.field textarea {
  min-height: 100px;
  padding-top: 24px;
  resize: vertical;
}

.field input:focus,
.field textarea:focus {
  border-bottom-color: cyan;
  box-shadow: 0 8px 20px rgba(0, 255, 255, 0.15);
}

/* Readonly styling */
.field input[readonly] {
  color: rgba(0, 255, 255, 0.4);
  border-bottom-color: rgba(0, 255, 255, 0.1);
  cursor: not-allowed;
}

.field label {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: rgba(255, 255, 255, 0.5);
  pointer-events: none;
  transition: 0.3s;
  letter-spacing: 1px;
}

.field textarea + label {
  top: 24px;
  transform: translateY(0);
}

/* Float label up on focus or when not empty */
.field input:focus + label,
.field input:not(:placeholder-shown) + label,
.field textarea:focus + label,
.field textarea:not(:placeholder-shown) + label {
  top: -6px;
  font-size: 10px;
  color: cyan;
}

/* Adjust label color for readonly fields */
.field input[readonly] + label {
  color: rgba(0, 255, 255, 0.4);
}

/* =====================
   BUTTONS
===================== */
.form-actions {
  display: flex;
  gap: 15px;
  margin-top: 35px;
}

.neon-btn {
  flex: 1;
  padding: 14px;
  background: transparent;
  border: 2px solid cyan;
  border-radius: 12px;
  color: cyan;
  cursor: pointer;
  letter-spacing: 2px;
  font-size: 13px;
  font-family: 'Orbitron', sans-serif;
  transition: 0.4s;
  position: relative;
  overflow: hidden;
  text-align: center;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.neon-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: cyan;
  transform: scaleX(0);
  transform-origin: left;
  transition: 0.4s;
  z-index: -1;
}

.neon-btn:hover::before {
  transform: scaleX(1);
}

.neon-btn:hover {
  color: #000;
  box-shadow: 0 0 25px cyan;
}

/* Secondary Button (Magenta) */
.neon-btn.secondary {
  border-color: magenta;
  color: magenta;
}

.neon-btn.secondary::before {
  background: magenta;
}

.neon-btn.secondary:hover {
  color: #000;
  box-shadow: 0 0 25px magenta;
}

/* =====================
   FOOTER / BACK LINK
===================== */
.footer {
  margin-top: 25px;
  text-align: center;
}

.back-link {
  color: rgba(0, 255, 255, 0.6);
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 1px;
  transition: 0.3s;
}

.back-link:hover {
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* =====================
   RESPONSIVE
===================== */
@media (max-width: 480px) {
  .inquiry-box {
    padding: 35px 25px;
  }

  .form-actions {
    flex-direction: column;
  }

  .inquiry-box h2 {
    font-size: 20px;
  }
}

/* ========================================== */
/* CYBERPUNK MECHA MUSIC PLAYER STYLES */
/* ========================================== */
:root {
  --neon-orange: #ff5e00;
  --neon-glow: rgba(255, 94, 0, 0.6);
  --dark-metal: #0a0a0a;
  --grunge-gray: #1a1a1a;
  --mech-border: 2px solid var(--neon-orange);
}

.music-player-container {
  position: fixed;
  top: 30px;
  right: 30px;
  z-index: 9999;
  font-family: 'Share Tech Mono', monospace;
  perspective: 1000px;
}

.activation-core {
  width: 60px;
  height: 60px;
  background: var(--dark-metal);
  border: var(--mech-border);
  clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 0 15px var(--neon-glow), inset 0 0 10px rgba(255, 94, 0, 0.2);
  position: relative;
  z-index: 10001;
}

.activation-core:hover {
  background: var(--neon-orange);
  box-shadow: 0 0 25px var(--neon-orange);
}

.activation-core:hover .core-icon {
  color: var(--dark-metal);
  animation: icon-glitch 0.3s ease-in-out;
}

.core-icon {
  color: var(--neon-orange);
  font-size: 32px;
  transition: color 0.3s ease;
  position: relative;
  z-index: 2;
}

.sonar-container {
  position: fixed;
  width: 0;
  height: 0;
  z-index: 10000;
  pointer-events: none;
}

.sonar-wave {
  position: absolute;
  top: 0;
  left: 0;
  width: 30px;
  height: 30px;
  border: 2px solid var(--neon-orange);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1);
  opacity: 0;
  animation: sonar-pulse 6s ease-out 1;
}

.sonar-wave:nth-child(1) { animation-delay: 0s; }
.sonar-wave:nth-child(2) { animation-delay: 2s; }
.sonar-wave:nth-child(3) { animation-delay: 4s; }

.music-player-container.panel-open .sonar-wave {
  animation: none;
  opacity: 0;
}

@keyframes sonar-pulse {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; border-width: 3px; }
  50% { opacity: 0.4; border-width: 2px; }
  100% { transform: translate(-50%, -50%) scale(8.6); opacity: 0; border-width: 1px; }
}

@keyframes icon-glitch {
  0%, 100% { transform: translate(0); text-shadow: none; }
  10% { transform: translate(-2px, 1px); text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; }
  20% { transform: translate(2px, -1px); text-shadow: -2px 0 #ff0000, 2px 0 #00ffff; }
  30% { transform: translate(-1px, 2px); text-shadow: 1px 0 #ff0000, -1px 0 #00ffff; }
  40% { transform: translate(1px, -2px); text-shadow: -1px 0 #ff0000, 1px 0 #00ffff; }
  50% { transform: translate(0); text-shadow: none; }
}

.mecha-panel {
  position: absolute;
  top: 50px;
  right: 0;
  width: 340px;
  display: flex;
  flex-direction: column;
  pointer-events: none;
  clip-path: polygon(50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%);
  transition: clip-path 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), transform 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  transform-origin: top right;
  transform: rotate(-5deg) scale(0.95);
}

.mecha-panel.open {
  pointer-events: auto;
  clip-path: polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%, 0% 100%, 0% 100%, 0% 0%, 0% 0%);
  transform: rotate(0deg) scale(1);
}

.mech-plate {
  background: var(--dark-metal);
  border: 1px solid #333;
  position: relative;
  overflow: hidden;
}

.mech-plate::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
  pointer-events: none;
  z-index: 2;
}

.plate-header {
  height: 40px;
  border-bottom: var(--mech-border);
  display: flex;
  align-items: center;
  padding: 0 15px;
  justify-content: space-between;
  color: var(--neon-orange);
  font-size: 12px;
  letter-spacing: 2px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 70%);
}

.plate-main {
  padding: 20px;
  border-bottom: 1px dashed #444;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
}

.plate-controls {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  background: linear-gradient(180deg, var(--grunge-gray) 0%, var(--dark-metal) 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 30%);
}

.mech-hinge {
  position: absolute;
  width: 15px;
  height: 100%;
  background: repeating-linear-gradient(45deg, #222, #222 5px, #111 5px, #111 10px);
  border-left: 1px solid var(--neon-orange);
  right: -15px;
  top: 0;
  opacity: 0;
  transition: opacity 0.5s ease 0.3s;
}

.mecha-panel.open .mech-hinge { opacity: 1; }

.oval-frame {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--neon-orange);
  box-shadow: 0 0 15px var(--neon-glow), inset 0 0 20px rgba(0,0,0,0.8);
  position: relative;
  background: #000;
}

.oval-frame::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.15"/></svg>');
  pointer-events: none;
  mix-blend-mode: overlay;
}

.album-art {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: contrast(1.1) saturate(0.8);
}

.song-info {
  text-align: center;
  width: 100%;
}

.song-title {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist-name {
  font-size: 12px;
  color: var(--neon-orange);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.control-btn {
  background: transparent;
  border: 1px solid #444;
  color: var(--neon-orange);
  cursor: pointer;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
}

.control-btn:hover {
  background: var(--neon-orange);
  color: var(--dark-metal);
  box-shadow: 0 0 15px var(--neon-glow);
  border-color: var(--neon-orange);
}

.play-btn {
  width: 65px;
  height: 65px;
  border: 2px solid var(--neon-orange);
  background: rgba(255, 94, 0, 0.1);
}

.play-btn svg { width: 28px; height: 28px; }

.glitch-text { animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both; }

@keyframes glitch-anim {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
  100% { transform: translate(0); }
}

.blink { animation: blinker 1s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }

@media (max-width: 768px) {
  .music-player-container { top: 10px; right: 10px; }
  .mecha-panel { width: 280px; }
  .oval-frame { width: 130px; height: 130px; }
}
</style>
</head>
<body>

  <!-- Background Particles -->
  <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
  <div class="particle" style="left: 25%; animation-delay: 2s;"></div>
  <div class="particle" style="left: 40%; animation-delay: 4s;"></div>
  <div class="particle" style="left: 55%; animation-delay: 1s;"></div>
  <div class="particle" style="left: 70%; animation-delay: 3s;"></div>
  <div class="particle" style="left: 85%; animation-delay: 5s;"></div>

  <!-- Inquiry Box -->
  <div class="inquiry-box">
    <h2>SYSTEM INQUIRY</h2>
    <p>ESTABLISH SECURE CONNECTION WITH THE NETWORK</p>

    <form id="inquiryForm">
      <div class="field">
        <input type="text" id="name" placeholder=" " readonly value="Traveler">
        <label for="name">DESIGNATION</label>
      </div>

      <div class="field">
        <input type="email" id="email" placeholder=" " required>
        <label for="email">COMM-LINK (EMAIL)</label>
      </div>

      <div class="field">
        <textarea id="message" placeholder=" " required></textarea>
        <label for="message">TRANSMISSION DATA</label>
      </div>

      <div class="form-actions">
        <button type="button" class="neon-btn secondary" onclick="document.getElementById('inquiryForm').reset()">ABORT</button>
        <button type="submit" class="neon-btn">TRANSMIT</button>
      </div>
    </form>

    <div class="footer">
      <a href="index.html" class="back-link">[ RETURN TO MAINFRAME ]</a>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- CYBERPUNK MECHA MUSIC PLAYER (UNCHANGED) -->
  <!-- ========================================== -->
  <div class="music-player-container" id="player-container">
    <div id="sonar-container" class="sonar-container">
      <div class="sonar-wave"></div>
      <div class="sonar-wave"></div>
      <div class="sonar-wave"></div>
    </div>

    <div id="activation-core" class="activation-core">
      <span class="core-icon">♪</span>
    </div>

    <div id="mecha-panel" class="mecha-panel">
      <div class="mech-plate plate-header">
        <span>Wetware_Vibe_Alignment.exe</span>
        <span class="blink">▶_</span>
      </div>

      <div class="mech-plate plate-main">
        <div class="oval-frame">
          <img id="album-art" src="https://via.placeholder.com/160x160/0a0a0a/ff5e00?text=NO+DISC" alt="Album Art" class="album-art">
        </div>
        <div class="song-info">
          <div id="song-title" class="song-title">STANDBY</div>
          <div id="artist-name" class="artist-name">WAITING_FOR_INPUT</div>
        </div>
      </div>

      <div class="mech-plate plate-controls">
        <button id="play-pause-btn" class="control-btn play-btn" title="Play">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="shuffle-btn" class="control-btn shuffle-btn" title="Shuffle Next">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>
      </div>

      <div class="mech-hinge"></div>
    </div>
  </div>

  <!-- Music Player JavaScript Logic (UNCHANGED) -->
  <script src="playlist.js"></script>
  <script>
    let audio = new Audio();
    let currentSongIndex = 0;
    let isPlaying = false;
    let isOpen = false;

    const playerContainer = document.getElementById('player-container');
    const activationCore = document.getElementById('activation-core');
    const mechaPanel = document.getElementById('mecha-panel');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const songTitle = document.getElementById('song-title');
    const artistName = document.getElementById('artist-name');
    const albumArtImg = document.getElementById('album-art');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const sonarContainer = document.getElementById('sonar-container');

    function positionSonar() {
      const rect = activationCore.getBoundingClientRect();
      const centerX = rect.left + (rect.width / 2);
      const centerY = rect.top + (rect.height / 2);
      sonarContainer.style.left = centerX + 'px';
      sonarContainer.style.top = centerY + 'px';
    }

    window.addEventListener('load', positionSonar);
    window.addEventListener('resize', positionSonar);
    positionSonar();

    function updateUI() {
      playIcon.style.display = isPlaying ? 'none' : 'block';
      pauseIcon.style.display = isPlaying ? 'block' : 'none';
      playPauseBtn.title = isPlaying ? 'Pause' : 'Play';

      if (typeof playlist !== 'undefined' && playlist.length > 0) {
        const currentSong = playlist[currentSongIndex];
        songTitle.classList.remove('glitch-text');
        artistName.classList.remove('glitch-text');
        void songTitle.offsetWidth;
        songTitle.classList.add('glitch-text');
        artistName.classList.add('glitch-text');
        songTitle.textContent = currentSong.title;
        artistName.textContent = currentSong.artist;
        albumArtImg.src = currentSong.art || 'https://via.placeholder.com/160x160/0a0a0a/ff5e00?text=NO+DISC';
      }
    }

    function togglePlayer() {
      isOpen = !isOpen;
      mechaPanel.classList.toggle('open', isOpen);
      playerContainer.classList.toggle('panel-open', isOpen);
      const coreIcon = document.querySelector('.core-icon');
      coreIcon.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    function togglePlayPause() {
      if (isPlaying) {
        audio.pause();
      } else {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => console.error("Play promise failed:", error));
        }
      }
    }

    function shuffleNext() {
      if (typeof playlist === 'undefined' || playlist.length === 0) return;
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * playlist.length);
      } while (nextIndex === currentSongIndex && playlist.length > 1);
      currentSongIndex = nextIndex;
      audio.src = playlist[currentSongIndex].src;
      audio.play().catch(err => console.error('Play error:', err));
    }

    function saveState() {
      if (typeof playlist !== 'undefined' && playlist.length > 0) {
        const state = {
          song: playlist[currentSongIndex].src,
          position: audio.currentTime,
          playing: !audio.paused,
          songIndex: currentSongIndex
        };
        sessionStorage.setItem('musicState', JSON.stringify(state));
      }
    }

    function restoreState() {
      const savedState = sessionStorage.getItem('musicState');
      if (savedState && typeof playlist !== 'undefined') {
        try {
          const state = JSON.parse(savedState);
          const foundIndex = playlist.findIndex(song => song.src === state.song);
          currentSongIndex = foundIndex !== -1 ? foundIndex : 0;
          audio.src = playlist[currentSongIndex].src;
          audio.addEventListener('loadedmetadata', () => {
            audio.currentTime = state.position;
            if (state.playing) audio.play().catch(err => console.error('Autoplay prevented on restore:', err));
          }, { once: true });
        } catch (e) {
          console.error('Failed to restore music state:', e);
          currentSongIndex = 0;
          audio.src = playlist[0].src;
        }
      } else if (typeof playlist !== 'undefined' && playlist.length > 0) {
        currentSongIndex = 0;
        audio.src = playlist[0].src;
      }
    }

    activationCore.addEventListener('click', togglePlayer);
    playPauseBtn.addEventListener('click', togglePlayPause);
    shuffleBtn.addEventListener('click', shuffleNext);

    audio.addEventListener('play', () => { isPlaying = true; updateUI(); });
    audio.addEventListener('pause', () => { isPlaying = false; updateUI(); });
    audio.addEventListener('ended', () => shuffleNext());

    audio.addEventListener('error', () => {
      let errorMsg = "Unknown error";
      if (audio.error) {
        switch (audio.error.code) {
          case 1: errorMsg = "Aborted"; break;
          case 2: errorMsg = "Network Error"; break;
          case 3: errorMsg = "Decode Error"; break;
          case 4: errorMsg = "File Not Found / Unsupported Format"; break;
        }
      }
      console.error("🚨 AUDIO LOAD ERROR:", errorMsg, "| Attempted to load:", audio.src);
    });

    window.addEventListener('beforeunload', saveState);
    restoreState();
    updateUI();
  </script>
