<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° Wheel Navigation</title>
<style>
.ccm-11,
.ccm-11 *,
.ccm-11 *::before,
.ccm-11 *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.ccm-11 {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 50%, #2E433C 0%, #21292C 70%);
  --brand: #00FFFF;
  --brand-glow: rgba(0, 255, 255, 0.8);
  --ink: #E0FFFF;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--ink);
  position: relative;
  overflow: hidden;
}

.ccm-11__stage {
  width: 100%;
  height: 100vh;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.ccm-11__pointer {
  position: absolute;
  left: 50%;
  top: calc(50% - 196px);
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border: 9px solid transparent;
  border-top: 13px solid var(--brand);
  filter: drop-shadow(0 0 8px var(--brand-glow)) drop-shadow(0 0 16px var(--brand-glow));
  z-index: 3;
}

.ccm-11__machine {
  position: relative;
  width: 340px;
  height: 340px;
  display: grid;
  place-items: center;
  touch-action: none;
  cursor: grab;
}

.ccm-11__machine.is-dragging {
  cursor: grabbing;
}

.ccm-11__wheel {
  position: absolute;
  inset: 0;
  list-style: none;
  border-radius: 50%;
  border: 1px solid rgba(0, 255, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 20px rgba(0, 255, 255, 0.05);
  transition: transform 0.7s cubic-bezier(0.3, 1, 0.35, 1);
}

.ccm-11__wheel li {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.ccm-11__stop {
  pointer-events: auto;
  border: 1px solid rgba(0, 255, 255, 0.4);
  border-radius: 999px;
  padding: 9px 16px;
  background: rgba(33, 41, 44, 0.9);
  color: var(--brand);
  font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif;
  letter-spacing: 0.02em;
  cursor: pointer;
  text-align: center;
  transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__stop:hover {
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__stop:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 3px;
}

.ccm-11__stop.is-active {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  transform: scale(1.12);
  box-shadow: 0 0 20px var(--brand-glow), 0 0 40px var(--brand-glow), 0 0 60px rgba(0, 255, 255, 0.4), inset 0 0 16px rgba(0, 255, 255, 0.3);
}

.ccm-11__face {
  position: relative;
  z-index: 2;
  display: grid;
  justify-items: center;
  gap: 4px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  place-content: center;
  text-align: center;
  background: radial-gradient(circle at 38% 30%, #21292C 0%, #1a2022 100%);
  border: 1px solid rgba(0, 255, 255, 0.3);
  box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 30px rgba(0, 255, 255, 0.1), inset 0 1px 0 rgba(0, 255, 255, 0.2);
}

.ccm-11__face em {
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 8px var(--brand-glow);
}

.ccm-11__current {
  font-size: 25px;
  letter-spacing: -0.01em;
  color: #fff;
  text-shadow: 0 0 12px var(--brand-glow), 0 0 24px var(--brand-glow);
  transition: font-size 0.3s ease;
}

.ccm-11__current--small {
  font-size: 18px;
}

.ccm-11__steer {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.ccm-11__steer button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(0, 255, 255, 0.4);
  background: #21292C;
  color: var(--brand);
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__steer button:hover {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__steer button:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

.ccm-11__enter {
  width: 80px;
  height: 32px;
  border-radius: 16px;
  border: 1px solid rgba(0, 255, 255, 0.4);
  background: #21292C;
  color: var(--brand);
  font: 600 12px/1 'Segoe UI', system-ui, sans-serif;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__enter:hover {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__enter:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

.ccm-11__live {
  position: absolute;
  width: 1px;
  height: 1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}

/* Glitch Effects */
.glitch-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}

.glitch-bar {
  position: absolute;
  height: 2px;
  opacity: 0;
  animation: glitchBar 0.3s ease-out forwards;
}

@keyframes glitchBar {
  0% {
    opacity: 0.8;
    transform: scaleX(0);
  }
  50% {
    opacity: 1;
    transform: scaleX(1);
  }
  100% {
    opacity: 0;
    transform: scaleX(1);
  }
}

.glitch-block {
  position: absolute;
  opacity: 0;
  animation: glitchBlock 0.4s ease-out forwards;
}

@keyframes glitchBlock {
  0% {
    opacity: 0;
    transform: scale(0.5);
  }
  30% {
    opacity: 0.9;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(1.2);
  }
}

.glitch-line {
  position: absolute;
  width: 100%;
  height: 1px;
  opacity: 0;
  animation: glitchLine 0.5s ease-out forwards;
}

@keyframes glitchLine {
  0% {
    opacity: 0;
    transform: translateY(-10px);
  }
  20% {
    opacity: 0.7;
  }
  100% {
    opacity: 0;
    transform: translateY(10px);
  }
}

.glitch-noise {
  position: absolute;
  opacity: 0;
  animation: glitchNoise 0.3s ease-out forwards;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

@keyframes glitchNoise {
  0% {
    opacity: 0;
    transform: scale(0.8);
  }
  40% {
    opacity: 0.6;
  }
  100% {
    opacity: 0;
    transform: scale(1.3);
  }
}

.glitch-rgb-split {
  position: absolute;
  opacity: 0;
  animation: rgbSplit 0.4s ease-out forwards;
}

@keyframes rgbSplit {
  0% {
    opacity: 0.8;
    transform: translateX(0);
  }
  50% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateX(5px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .ccm-11 * {
    transition-duration: 0.01s !important;
  }
  .glitch-container * {
    animation-duration: 0.01s !important;
  }
}
</style>
</head>
<body>

<section class="ccm-11" aria-label="360 degree wheel navigation demo">
  <div class="glitch-container" id="glitchContainer"></div>
  <div class="ccm-11__stage">
    <div class="ccm-11__pointer" aria-hidden="true"></div>
    <nav class="ccm-11__machine" aria-label="Sections">
      <ul class="ccm-11__wheel">
        <li><button type="button" class="ccm-11__stop is-active" aria-pressed="true" data-url="gallery.html" data-label="Gallery">Gallery</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="writings.html" data-label="Writings">Writings</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="portal.html" data-label="Portal">Portal</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="other-services.html" data-label="Other Services">Other<br>Services</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="tools.html" data-label="Tools">Tools</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="events.html" data-label="Events">Events</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="my-consumption.html" data-label="My Consumption">My<br>Consumption</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="commissions.html" data-label="Commissions">Commissions</button></li>
      </ul>
      <div class="ccm-11__face">
        <em>consider:</em>
        <strong class="ccm-11__current">Gallery</strong>
        <div class="ccm-11__steer">
          <button type="button" class="ccm-11__prev" aria-label="Previous section">←</button>
          <button type="button" class="ccm-11__next" aria-label="Next section">→</button>
        </div>
        <button type="button" class="ccm-11__enter">Enter</button>
      </div>
      <p class="ccm-11__live" aria-live="polite"></p>
    </nav>
  </div>
</section>

<script>
(() => {
  const machine = document.querySelector('.ccm-11__machine');
  const wheel = machine.querySelector('.ccm-11__wheel');
  const stops = [...machine.querySelectorAll('.ccm-11__stop')];
  const current = machine.querySelector('.ccm-11__current');
  const live = machine.querySelector('.ccm-11__live');
  const enterBtn = machine.querySelector('.ccm-11__enter');
  const face = machine.querySelector('.ccm-11__face');
  const glitchContainer = document.getElementById('glitchContainer');

  const n = stops.length;
  const step = 360 / n;
  let rot = 0;
  let active = 0;

  const positionItems = () => {
    const radius = 170;
    stops.forEach((stop, i) => {
      const angle = (step * i - 90) * (Math.PI / 180);
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      stop.parentElement.style.transform = `translate(${x}px, ${y}px)`;
    });
  };

  const applyVisualRotation = () => {
    wheel.style.transform = `rotate(${rot}deg)`;
    stops.forEach(stop => {
      stop.style.transform = `rotate(${-rot}deg)`;
    });
  };

  const getActiveIndex = () => {
    const rawIdx = -rot / step;
    return ((Math.round(rawIdx) % n) + n) % n;
  };

  const updateActive = (idx) => {
    if (idx === active) return;
    active = idx;
    stops.forEach((s, k) => {
      s.classList.toggle('is-active', k === active);
      s.setAttribute('aria-pressed', String(k === active));
    });

    const label = stops[active].dataset.label;
    current.textContent = label;

    if (label === 'Other Services' || label === 'My Consumption') {
      current.classList.add('ccm-11__current--small');
    } else {
      current.classList.remove('ccm-11__current--small');
    }

    live.textContent = label + ' selected';
  };

  const animateTo = (targetRot, duration = 700) => {
    wheel.style.transition = `transform ${duration}ms cubic-bezier(0.3, 1, 0.35, 1)`;
    stops.forEach(s => {
      s.style.transition = `transform ${duration}ms cubic-bezier(0.3, 1, 0.35, 1)`;
    });
    rot = targetRot;
    applyVisualRotation();
    setTimeout(() => {
      wheel.style.transition = '';
      stops.forEach(s => s.style.transition = '');
    }, duration);
  };

  const goTo = (idx) => {
    idx = ((idx % n) + n) % n;
    const target = -idx * step;
    const currentRot = ((rot % 360) + 360) % 360;
    let delta = target - currentRot;
    delta = ((delta % 360) + 540) % 360 - 180;
    const finalRot = rot + delta;
    animateTo(finalRot);
    updateActive(idx);
  };

  let isDragging = false;
  let hasMoved = false;
  let startAngle = 0;
  let lastAngle = 0;
  let lastTime = 0;
  let velocity = 0;
  let suppressNextClick = false;
  let inertiaFrame = null;
  const DRAG_THRESHOLD = 5;

  const getAngleFromCenter = (clientX, clientY) => {
    const rect = machine.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
  };

  const cancelInertia = () => {
    if (inertiaFrame) {
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame = null;
    }
  };

  const onPointerDown = (e) => {
    if (e.target.closest('.ccm-11__face')) return;
    if (e.button !== undefined && e.button !== 0) return;

    cancelInertia();
    isDragging = true;
    hasMoved = false;
    startAngle = getAngleFromCenter(e.clientX, e.clientY);
    lastAngle = startAngle;
    lastTime = performance.now();
    velocity = 0;

    wheel.style.transition = 'none';
    stops.forEach(s => s.style.transition = 'none');
    document.body.style.userSelect = 'none';
    machine.classList.add('is-dragging');
  };

  const onPointerMove = (e) => {
    if (!isDragging) return;

    const currentAngle = getAngleFromCenter(e.clientX, e.clientY);

    let delta = currentAngle - lastAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    let totalDelta = currentAngle - startAngle;
    if (totalDelta > 180) totalDelta -= 360;
    if (totalDelta < -180) totalDelta += 360;

    if (Math.abs(totalDelta) > DRAG_THRESHOLD || hasMoved) {
      hasMoved = true;
      rot += delta;
      applyVisualRotation();
      updateActive(getActiveIndex());

      const now = performance.now();
      const dt = now - lastTime;
      if (dt > 0 && dt < 100) {
        velocity = delta / dt;
      }
      lastTime = now;
    }
    lastAngle = currentAngle;
  };

  const snapToNearest = () => {
    const normalizedRot = ((rot % 360) + 360) % 360;
    const nearestStep = Math.round(normalizedRot / step);
    let targetRot = nearestStep * step;

    let delta = targetRot - normalizedRot;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    const finalRot = rot + delta;
    const finalIdx = getActiveIndex();

    animateTo(finalRot, 500);
    updateActive(finalIdx);
  };

  const startInertia = () => {
    let currentVel = velocity * 16;
    const friction = 0.94;
    const minVel = 0.3;

    const animate = () => {
      currentVel *= friction;
      if (Math.abs(currentVel) < minVel) {
        snapToNearest();
        return;
      }
      rot += currentVel;
      applyVisualRotation();
      updateActive(getActiveIndex());
      inertiaFrame = requestAnimationFrame(animate);
    };
    inertiaFrame = requestAnimationFrame(animate);
  };

  const onPointerUp = () => {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    machine.classList.remove('is-dragging');
    wheel.style.transition = '';
    stops.forEach(s => s.style.transition = '');

    if (hasMoved) {
      suppressNextClick = true;
      startInertia();
    }
  };

  const onPointerCancel = () => {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    machine.classList.remove('is-dragging');
    wheel.style.transition = '';
    stops.forEach(s => s.style.transition = '');
    snapToNearest();
  };

  // ========== GLITCH EFFECTS ==========
  const glitchColors = [
    '#FF0000', '#00FF00', '#0000FF', '#FF00FF', '#00FFFF', '#FFFF00',
    'rgba(255, 0, 0, 0.8)', 'rgba(0, 255, 0, 0.8)', 'rgba(0, 0, 255, 0.8)',
    'rgba(255, 0, 255, 0.8)', 'rgba(0, 255, 255, 0.8)'
  ];

  const createGlitchBar = () => {
    const bar = document.createElement('div');
    bar.className = 'glitch-bar';
    bar.style.top = Math.random() * 100 + '%';
    bar.style.left = Math.random() * 50 + '%';
    bar.style.width = (Math.random() * 300 + 100) + 'px';
    bar.style.background = glitchColors[Math.floor(Math.random() * glitchColors.length)];
    bar.style.boxShadow = `0 0 10px ${bar.style.background}`;
    glitchContainer.appendChild(bar);
    setTimeout(() => bar.remove(), 300);
  };

  const createGlitchBlock = () => {
    const block = document.createElement('div');
    block.className = 'glitch-block';
    block.style.top = Math.random() * 100 + '%';
    block.style.left = Math.random() * 100 + '%';
    block.style.width = (Math.random() * 80 + 20) + 'px';
    block.style.height = (Math.random() * 80 + 20) + 'px';
    block.style.background = glitchColors[Math.floor(Math.random() * glitchColors.length)];
    block.style.boxShadow = `0 0 20px ${block.style.background}`;
    glitchContainer.appendChild(block);
    setTimeout(() => block.remove(), 400);
  };

  const createGlitchLine = () => {
    const line = document.createElement('div');
    line.className = 'glitch-line';
    line.style.top = Math.random() * 100 + '%';
    line.style.background = `linear-gradient(90deg, transparent, ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}, transparent)`;
    glitchContainer.appendChild(line);
    setTimeout(() => line.remove(), 500);
  };

  const createGlitchNoise = () => {
    const noise = document.createElement('div');
    noise.className = 'glitch-noise';
    noise.style.top = Math.random() * 80 + '%';
    noise.style.left = Math.random() * 80 + '%';
    noise.style.width = (Math.random() * 200 + 100) + 'px';
    noise.style.height = (Math.random() * 200 + 100) + 'px';
    noise.style.mixBlendMode = 'screen';
    glitchContainer.appendChild(noise);
    setTimeout(() => noise.remove(), 300);
  };

  const createRGBSplit = () => {
    const split = document.createElement('div');
    split.className = 'glitch-rgb-split';
    split.style.top = Math.random() * 100 + '%';
    split.style.left = Math.random() * 100 + '%';
    split.style.width = (Math.random() * 150 + 50) + 'px';
    split.style.height = '3px';
    split.style.background = `linear-gradient(90deg, #FF0000, #00FF00, #0000FF)`;
    split.style.boxShadow = `0 0 15px rgba(255, 0, 255, 0.8)`;
    glitchContainer.appendChild(split);
    setTimeout(() => split.remove(), 400);
  };

  const spawnGlitch = () => {
    const glitchType = Math.random();

    if (glitchType < 0.25) {
      createGlitchBar();
    } else if (glitchType < 0.45) {
      createGlitchBlock();
    } else if (glitchType < 0.6) {
      createGlitchLine();
    } else if (glitchType < 0.8) {
      createGlitchNoise();
    } else {
      createRGBSplit();
    }
  };

  const startGlitchLoop = () => {
    const spawnGlitchBurst = () => {
      const burstCount = Math.floor(Math.random() * 3) + 1;
      for (let i = 0; i < burstCount; i++) {
        setTimeout(spawnGlitch, i * 50);
      }

      const nextDelay = Math.random() * 3000 + 2000;
      setTimeout(spawnGlitchBurst, nextDelay);
    };

    spawnGlitchBurst();
  };

  positionItems();
  applyVisualRotation();

  machine.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);

  stops.forEach((s, k) => {
    s.addEventListener('click', () => {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }
      goTo(k);
    });
  });

  machine.querySelector('.ccm-11__prev').addEventListener('click', () => goTo(active - 1));
  machine.querySelector('.ccm-11__next').addEventListener('click', () => goTo(active + 1));

  const handleEnter = () => {
    const activeStop = stops[active];
    const url = activeStop.getAttribute('data-url');
    if (url) {
      window.location.href = url;
    }
  };
  enterBtn.addEventListener('click', handleEnter);

  startGlitchLoop();
})();
</script>

</body>
</html>
