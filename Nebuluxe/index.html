<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° Wheel Navigation</title>
<style>
.ccm-11,
.ccm-11 *,
.ccm-11 *::before,
.ccm-11 *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.ccm-11 {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #3d2817, #1f1410 70%);
  --brand: #ff6b35;
  --ink: #f5f5f5;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--ink);
}

.ccm-11__stage {
  width: 100%;
  height: 100vh;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.ccm-11__pointer {
  position: absolute;
  left: 50%;
  top: calc(50% - 196px);
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border: 9px solid transparent;
  border-top: 13px solid var(--brand);
  filter: drop-shadow(0 2px 6px rgba(255, 107, 53, 0.6));
  z-index: 3;
}

.ccm-11__machine {
  position: relative;
  width: 340px;
  height: 340px;
  display: grid;
  place-items: center;
  touch-action: none;
  cursor: grab;
}

.ccm-11__machine.is-dragging {
  cursor: grabbing;
}

.ccm-11__wheel {
  position: absolute;
  inset: 0;
  list-style: none;
  border-radius: 50%;
  border: 1px solid rgba(128, 100, 80, 0.4);
  transition: transform 0.7s cubic-bezier(0.3, 1, 0.35, 1);
}

.ccm-11__wheel li {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.ccm-11__stop {
  pointer-events: auto;
  border: 1px solid rgba(128, 100, 80, 0.5);
  border-radius: 999px;
  padding: 9px 16px;
  background: rgba(60, 40, 30, 0.85);
  color: #d4c5b5;
  font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif;
  letter-spacing: 0.02em;
