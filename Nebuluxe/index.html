<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° Wheel Navigation</title>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
html, body {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: #191d1e;
  background: linear-gradient(0deg, #191d1e 50%, #283139 100%);
  background-attachment: fixed;
}

#projector {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.ccm-11,
.ccm-11 *,
.ccm-11 *::before,
.ccm-11 *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.ccm-11 {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  --brand: #00FFFF;
  --brand-glow: rgba(0, 255, 255, 0.8);
  --ink: #E0FFFF;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--ink);
}

.ccm-11__stage {
  width: 100%;
  height: 100vh;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.ccm-11__pointer {
  position: absolute;
  left: 50%;
  top: calc(50% - 196px);
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border: 9px solid transparent;
  border-top: 13px solid var(--brand);
  filter: drop-shadow(0 0 8px var(--brand-glow)) drop-shadow(0 0 16px var(--brand-glow));
  z-index: 3;
}

.ccm-11__machine {
  position: relative;
  width: 340px;
  height: 340px;
  display: grid;
  place-items: center;
  touch-action: none;
  cursor: grab;
}

.ccm-11__machine.is-dragging {
  cursor: grabbing;
}

.ccm-11__wheel {
  position: absolute;
  inset: 0;
  list-style: none;
  border-radius: 50%;
  border: 1px solid rgba(0, 255, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 20px rgba(0, 255, 255, 0.05);
  transition: transform 0.7s cubic-bezier(0.3, 1, 0.35, 1);
}

.ccm-11__wheel li {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.ccm-11__stop {
  pointer-events: auto;
  border: 1px solid rgba(0, 255, 255, 0.4);
  border-radius: 999px;
  padding: 9px 16px;
  background: rgba(25, 29, 30, 0.85);
  color: var(--brand);
  font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif;
  letter-spacing: 0.02em;
  cursor: pointer;
  text-align: center;
  transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__stop:hover {
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__stop:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 3px;
}

.ccm-11__stop.is-active {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  transform: scale(1.12);
  box-shadow: 0 0 20px var(--brand-glow), 0 0 40px var(--brand-glow), 0 0 60px rgba(0, 255, 255, 0.4), inset 0 0 16px rgba(0, 255, 255, 0.3);
}

.ccm-11__face {
  position: relative;
  z-index: 2;
  display: grid;
  justify-items: center;
  gap: 4px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  place-content: center;
  text-align: center;
  background: radial-gradient(circle at 38% 30%, rgba(25, 29, 30, 0.9) 0%, rgba(26, 32, 34, 0.95) 100%);
  border: 1px solid rgba(0, 255, 255, 0.3);
  box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 30px rgba(0, 255, 255, 0.1), inset 0 1px 0 rgba(0, 255, 255, 0.2);
  backdrop-filter: blur(4px);
}

.ccm-11__face em {
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 8px var(--brand-glow);
}

.ccm-11__current {
  font-size: 25px;
  letter-spacing: -0.01em;
  color: #fff;
  text-shadow: 0 0 12px var(--brand-glow), 0 0 24px var(--brand-glow);
  transition: font-size 0.3s ease;
}

.ccm-11__current--small {
  font-size: 18px;
}

.ccm-11__steer {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.ccm-11__steer button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(0, 255, 255, 0.4);
  background: rgba(25, 29, 30, 0.9);
  color: var(--brand);
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__steer button:hover {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__steer button:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

.ccm-11__enter {
  width: 80px;
  height: 32px;
  border-radius: 16px;
  border: 1px solid rgba(0, 255, 255, 0.4);
  background: rgba(25, 29, 30, 0.9);
  color: var(--brand);
  font: 600 12px/1 'Segoe UI', system-ui, sans-serif;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__enter:hover {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__enter:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

.ccm-11__live {
  position: absolute;
  width: 1px;
  height: 1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}

/* Glitch Effects */
.glitch-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}

.glitch-bar {
  position: absolute;
  height: 2px;
  opacity: 0;
  animation: glitchBar 0.3s ease-out forwards;
}

@keyframes glitchBar {
  0% { opacity: 0.8; transform: scaleX(0); }
  50% { opacity: 1; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(1); }
}

.glitch-line {
  position: absolute;
  width: 100%;
  height: 1px;
  opacity: 0;
  animation: glitchLine 0.5s ease-out forwards;
}

@keyframes glitchLine {
  0% { opacity: 0; transform: translateY(-10px); }
  20% { opacity: 0.7; }
  100% { opacity: 0; transform: translateY(10px); }
}

.glitch-noise {
  position: absolute;
  opacity: 0;
  animation: glitchNoise 0.3s ease-out forwards;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

@keyframes glitchNoise {
  0% { opacity: 0; transform: scale(0.8); }
  40% { opacity: 0.6; }
  100% { opacity: 0; transform: scale(1.3); }
}

.glitch-rgb-split {
  position: absolute;
  opacity: 0;
  animation: rgbSplit 0.4s ease-out forwards;
}

@keyframes rgbSplit {
  0% { opacity: 0.8; transform: translateX(0); }
  50% { opacity: 1; }
  100% { opacity: 0; transform: translateX(5px); }
}

.glitch-moving-bar {
  position: absolute;
  height: 3px;
  opacity: 0;
  animation: movingBar 0.8s ease-out forwards;
}

@keyframes movingBar {
  0% { opacity: 0; transform: translateX(-100%); }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateX(100vw); }
}

.glitch-sweep-line {
  position: absolute;
  width: 2px;
  height: 100%;
  opacity: 0;
  animation: sweepLine 1s ease-out forwards;
}

@keyframes sweepLine {
  0% { opacity: 0; transform: translateY(-100%); }
  30% { opacity: 0.8; }
  70% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(100vh); }
}

.glitch-diagonal {
  position: absolute;
  width: 200px;
  height: 2px;
  opacity: 0;
  animation: diagonalStreak 0.6s ease-out forwards;
}

@keyframes diagonalStreak {
  0% { opacity: 0; transform: translate(-100px, -100px) rotate(45deg); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: translate(100vw, 100vh) rotate(45deg); }
}

@media (prefers-reduced-motion: reduce) {
  .ccm-11 * {
    transition-duration: 0.01s !important;
  }
  .glitch-container * {
    animation-duration: 0.01s !important;
  }
}
/* ========== ABOUT PULLDOWN ========== */
.about-pulldown {
  position: fixed;
  bottom: 0;
  right: 20px;
  /* Slides the panel down, leaving only the top 60px (the header) visible at the bottom */
  transform: translateY(calc(100% - 60px));
  width: 320px;
  z-index: 100;

  background: rgba(25, 29, 30, 0.85);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);

  border: 1px solid rgba(0, 255, 255, 0.4);
  border-bottom: none;
  border-radius: 16px 16px 0 0;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 255, 0.1);

  transition: transform 0.5s cubic-bezier(0.25, 1, 0.3, 1), box-shadow 0.5s ease;
  cursor: pointer;
  color: #E0FFFF;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

.about-pulldown:hover {
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 255, 255, 0.2);
}

.about-pulldown.is-open {
  transform: translateY(0);
  box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 255, 255, 0.3);
}

/* ========== HEADER (at bottom of panel, visible when closed) ========== */
.about-header {
  position: relative;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #00FFFF;
  text-shadow: 0 0 8px rgba(0, 255, 255, 0.9), 0 0 16px rgba(0, 255, 255, 0.5);
  user-select: none;
}

/* Pull handle indicator at bottom of the visible tab */
.about-header::after {
  content: '';
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 3px;
  background: rgba(0, 255, 255, 0.6);
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
}

.about-arrow {
  color: #00FFFF;
  filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.9));
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.3, 1);
  width: 16px;
  height: 16px;
}

.about-pulldown.is-open .about-arrow {
  transform: rotate(180deg);
}

/* ========== CONTENT (above header, hidden when closed) ========== */
.about-content {
  padding: 24px 24px 20px;
  font-size: 14px;
  line-height: 1.6;
  color: rgba(224, 255, 255, 0.85);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);

  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s;
}

.about-pulldown.is-open .about-content {
  opacity: 1;
  transform: translateY(0);
}
/* ========== END ABOUT PULLDOWN CSS========== */
/* --- Music Player Styles --- */

  top: 0;
  right: 0;
  z-index: 9999;
  font-family: Arial, sans-serif;
}

.pullout-tab {
  position: absolute;

  right: 0;
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 25px 0 0 25px;

  align-items: center;
  justify-content: center;

  z-index: 10000;
}

.pullout-tab:hover {
  width: 55px;
  background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
}

.pullout-tab.open {
  right: 320px;
}

.tab-icon {
  color: white;
  font-size: 24px;
}

.music-note {
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.player-panel {
  position: fixed;
  top: 0;
  right: -320px;
  width: 320px;
  height: 100vh;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
  box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
  transition: right 0.3s ease;
  overflow-y: auto;
  z-index: 9998;
}

.player-panel.open {
  right: 0;
}

.player-content {
  padding: 80px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.album-frame {
  width: 200px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.oval-frame {
  width: 180px;
  height: 140px;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid #667eea;
  box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
  background: #000;
}

.album-art {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.song-info {
  text-align: center;
  color: white;
}

.song-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 4px;
  text-transform: capitalize;
}

/* NEW: Artist Name Styling */
.artist-name {
  font-size: 14px;
  color: #a0a0b0; /* Muted light gray/blue */
  font-weight: normal;
}

.controls {
  display: flex;
  gap: 30px;
  align-items: center;
  margin-top: 20px;
}

.control-btn {
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  padding: 15px;
  border-radius: 50%;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.control-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  transform: scale(1.1);
}

.shuffle-btn {
  background: rgba(102, 126, 234, 0.2);
}

.play-btn {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  width: 60px;
  height: 60px;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

.play-btn:hover {
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
}

@media (max-width: 768px) {
  .player-panel { width: 280px; right: -280px; }
  .pullout-tab.open { right: 280px; }
  .album-frame { width: 160px; height: 160px; }
  .oval-frame { width: 140px; height: 110px; }
}
  /* --- End Music Player Styles --- */
</style>
</head>
<body>
<!-- // About pulldown html // -->
<div class="about-pulldown" id="aboutPulldown">
  <div class="about-header">
    <svg class="about-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 15 12 9 18 15"></polyline>
    </svg>
    <span>about this website</span>
  </div>
  <div class="about-content">
    <p>This is an interactive 360-degree wheel navigation experiment. It features drag-to-spin physics, neon aesthetics, and a dynamic particle background.</p>
    <p>Built with HTML, CSS, JavaScript, CreateJS, and GSAP.</p>
  </div>
</div>
<!-- //End about pulldown html // -->
<canvas id="projector"></canvas>

<section class="ccm-11" aria-label="360 degree wheel navigation demo">
  <div class="glitch-container" id="glitchContainer"></div>
  <div class="ccm-11__stage">
    <div class="ccm-11__pointer" aria-hidden="true"></div>
    <nav class="ccm-11__machine" aria-label="Sections">
      <ul class="ccm-11__wheel">
        <li><button type="button" class="ccm-11__stop is-active" aria-pressed="true" data-url="gallery.html" data-label="Gallery">Gallery</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="writings.html" data-label="Writings">Writings</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="portal.html" data-label="Portal">Portal</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="other-services.html" data-label="Other Services">Other<br>Services</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="tools.html" data-label="Tools">Tools</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="events.html" data-label="Events">Events</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="my-consumption.html" data-label="My Consumption">My<br>Consumption</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="commissions.html" data-label="Commissions">Commissions</button></li>
      </ul>
      <div class="ccm-11__face">
        <em>consider:</em>
        <strong class="ccm-11__current">Gallery</strong>
        <div class="ccm-11__steer">
          <button type="button" class="ccm-11__prev" aria-label="Previous section">←</button>
          <button type="button" class="ccm-11__next" aria-label="Next section">→</button>
        </div>
        <button type="button" class="ccm-11__enter">Enter</button>
      </div>
      <p class="ccm-11__live" aria-live="polite"></p>
    </nav>
  </div>
</section>

<script>
////////////////////////// PARTICLE ENGINE ////////////////////////////////////////
var ParticleEngine = (function() {
	'use strict';

	function ParticleEngine(canvas_id) {
		if (!(this instanceof ParticleEngine)) {
			return new ParticleEngine(canvas_id);
		}

		var _ParticleEngine = this;

		this.canvas_id = canvas_id;
		this.stage = new createjs.Stage(canvas_id);
		this.totalWidth = this.canvasWidth = document.getElementById(canvas_id).width = document.getElementById(canvas_id).offsetWidth;
		this.totalHeight = this.canvasHeight = document.getElementById(canvas_id).height = document.getElementById(canvas_id).offsetHeight;
		this.compositeStyle = "lighter";

		this.particleSettings = [
			{id:"small", num:300, fromX:0, toX:this.totalWidth, ballwidth:3, alphamax:0.4, areaHeight:.5, color:"#0cdbf3", fill:false},
			{id:"medium", num:100, fromX:0, toX:this.totalWidth, ballwidth:8, alphamax:0.3, areaHeight:1, color:"#6fd2f3", fill:true},
			{id:"large", num:10, fromX:0, toX:this.totalWidth, ballwidth:30, alphamax:0.2, areaHeight:1, color:"#93e9f3", fill:true}
		];
		this.particleArray = [];
		this.lights = [
			{ellipseWidth:400, ellipseHeight:100, alpha:0.6, offsetX:0, offsetY:0, color:"#6ac6e8"},
			{ellipseWidth:350, ellipseHeight:250, alpha:0.3, offsetX:-50, offsetY:0, color:"#54d5e8"},
			{ellipseWidth:100, ellipseHeight:80, alpha:0.2, offsetX:80, offsetY:-50, color:"#2ae8d8"}
		];

		this.stage.compositeOperation = _ParticleEngine.compositeStyle;

		function drawBgLight() {
			var light, bounds, blurFilter;
			for (var i = 0, len = _ParticleEngine.lights.length; i < len; i++) {
				light = new createjs.Shape();
				light.graphics.beginFill(_ParticleEngine.lights[i].color).drawEllipse(0, 0, _ParticleEngine.lights[i].ellipseWidth, _ParticleEngine.lights[i].ellipseHeight);
				light.regX = _ParticleEngine.lights[i].ellipseWidth/2;
				light.regY = _ParticleEngine.lights[i].ellipseHeight/2;
				light.y = light.initY = _ParticleEngine.totalHeight/2 + _ParticleEngine.lights[i].offsetY;
				light.x = light.initX = _ParticleEngine.totalWidth/2 + _ParticleEngine.lights[i].offsetX;

				blurFilter = new createjs.BlurFilter(_ParticleEngine.lights[i].ellipseWidth, _ParticleEngine.lights[i].ellipseHeight, 1);
				bounds = blurFilter.getBounds();
				light.filters = [blurFilter];
				light.cache(bounds.x-_ParticleEngine.lights[i].ellipseWidth/2, bounds.y-_ParticleEngine.lights[i].ellipseHeight/2, bounds.width*2, bounds.height*2);
				light.alpha = _ParticleEngine.lights[i].alpha;
				light.compositeOperation = "screen";

				_ParticleEngine.stage.addChildAt(light, 0);
				_ParticleEngine.lights[i].elem = light;
			}

			gsap.fromTo(_ParticleEngine.lights[0].elem,
				{scaleX:1.5, x:_ParticleEngine.lights[0].elem.initX, y:_ParticleEngine.lights[0].elem.initY},
				{duration: 10, yoyo:true, repeat:-1, ease:"power1.inOut", scaleX:2, scaleY:0.7}
			);
			gsap.fromTo(_ParticleEngine.lights[1].elem,
				{x:_ParticleEngine.lights[1].elem.initX, y:_ParticleEngine.lights[1].elem.initY},
				{duration: 12, delay:5, yoyo:true, repeat:-1, ease:"power1.inOut", scaleY:2, scaleX:2, y:_ParticleEngine.totalHeight/2-50, x:_ParticleEngine.totalWidth/2+100}
			);
			gsap.fromTo(_ParticleEngine.lights[2].elem,
				{x:_ParticleEngine.lights[2].elem.initX, y:_ParticleEngine.lights[2].elem.initY},
				{duration: 8, delay:2, yoyo:true, repeat:-1, ease:"power1.inOut", scaleY:1.5, scaleX:1.5, y:_ParticleEngine.totalHeight/2, x:_ParticleEngine.totalWidth/2-200}
			);
		}

		function drawParticles() {
			var blurFilter;
			for (var i = 0, len = _ParticleEngine.particleSettings.length; i < len; i++) {
				var ball = _ParticleEngine.particleSettings[i];
				var circle;
				for (var s = 0; s < ball.num; s++ ) {
					circle = new createjs.Shape();
					if(ball.fill) {
						circle.graphics.beginFill(ball.color).drawCircle(0, 0, ball.ballwidth);
						blurFilter = new createjs.BlurFilter(ball.ballwidth/2, ball.ballwidth/2, 1);
						circle.filters = [blurFilter];
						var bounds = blurFilter.getBounds();
						circle.cache(-50+bounds.x, -50+bounds.y, 100+bounds.width, 100+bounds.height);
					} else {
						circle.graphics.beginStroke(ball.color).setStrokeStyle(1).drawCircle(0, 0, ball.ballwidth);
					}

					circle.alpha = range(0, 0.1);
					circle.alphaMax = ball.alphamax;
					circle.distance = ball.ballwidth * 2;
					circle.ballwidth = ball.ballwidth;
					circle.flag = ball.id;
					_ParticleEngine.applySettings(circle, ball.fromX, ball.toX, ball.areaHeight);
					circle.speed = range(2, 10);
					circle.y = circle.initY;
					circle.x = circle.initX;
					circle.scaleX = circle.scaleY = range(0.3, 1);

					_ParticleEngine.stage.addChild(circle);
					animateBall(circle);
					_ParticleEngine.particleArray.push(circle);
				}
			}
		}

		this.applySettings = function(circle, positionX, totalWidth, areaHeight) {
			circle.speed = range(1, 3);
			circle.initY = weightedRange(0, _ParticleEngine.totalHeight, 1, [_ParticleEngine.totalHeight * (2-areaHeight/2)/4, _ParticleEngine.totalHeight*(2+areaHeight/2)/4], 0.8 );
			circle.initX = weightedRange(positionX, totalWidth, 1, [positionX+ ((totalWidth-positionX))/4, positionX+ ((totalWidth-positionX)) * 3/4], 0.6);
		}

		function animateBall(ball) {
			var scale = range(0.3, 1);
			var xpos = range(ball.initX - ball.distance, ball.initX + ball.distance);
			var ypos = range(ball.initY - ball.distance, ball.initY + ball.distance);
			var speed = ball.speed;

			gsap.to(ball, {
				duration: speed,
				scaleX: scale,
				scaleY: scale,
				x: xpos,
				y: ypos,
				onComplete: animateBall,
				onCompleteParams: [ball],
				ease: "power3.inOut"
			});

			gsap.to(ball, {
				duration: speed/2,
				alpha: range(0.1, ball.alphaMax),
				onComplete: fadeout,
				onCompleteParams: [ball, speed]
			});
		}

		function fadeout(ball, speed) {
			ball.speed = range(2, 10);
			gsap.to(ball, {duration: speed/2, alpha: 0 });
		}

		drawBgLight();
		drawParticles();
	}

	ParticleEngine.prototype.render = function() {
		this.stage.update();
	}

	ParticleEngine.prototype.resize = function() {
		this.totalWidth = this.canvasWidth = document.getElementById(this.canvas_id).width = document.getElementById(this.canvas_id).offsetWidth;
		this.totalHeight = this.canvasHeight = document.getElementById(this.canvas_id).height = document.getElementById(this.canvas_id).offsetHeight;
		this.render();

		for (var i = 0, length = this.particleArray.length; i < length; i++) {
			this.applySettings(this.particleArray[i], 0, this.totalWidth, this.particleArray[i].areaHeight);
		}

		for (var j = 0, len = this.lights.length; j < len; j++) {
			this.lights[j].elem.initY = this.totalHeight/2 + this.lights[j].offsetY;
			this.lights[j].elem.initX = this.totalWidth/2 + this.lights[j].offsetX;
			gsap.to(this.lights[j].elem, {duration: 0.5, x: this.lights[j].elem.initX, y: this.lights[j].elem.initY});
		}
	}

	return ParticleEngine;
}());

//////////////////////// UTILS ////////////////////////////////////////
function range(min, max) {
	return min + (max - min) * Math.random();
}

function round(num, precision) {
   var decimal = Math.pow(10, precision);
   return Math.round(decimal * num) / decimal;
}

function weightedRange(to, from, decimalPlaces, weightedRange, weightStrength) {
	if (typeof from === "undefined" || from === null) from = 0;
	if (typeof decimalPlaces === "undefined" || decimalPlaces === null) decimalPlaces = 0;
	if (typeof weightedRange === "undefined" || weightedRange === null) weightedRange = 0;
	if (typeof weightStrength === "undefined" || weightStrength === null) weightStrength = 0;

	var ret;
	if(to == from) { return(to); }

	if(weightedRange && Math.random() <= weightStrength) {
		ret = round(Math.random() * (weightedRange[1] - weightedRange[0]) + weightedRange[0], decimalPlaces);
	} else {
		ret = round(Math.random() * (to - from) + from, decimalPlaces);
	}
	return ret;
}

//////////////////////// WHEEL NAVIGATION //////////////////////////
(() => {
  const machine = document.querySelector('.ccm-11__machine');
  const wheel = machine.querySelector('.ccm-11__wheel');
  const stops = [...machine.querySelectorAll('.ccm-11__stop')];
  const current = machine.querySelector('.ccm-11__current');
  const live = machine.querySelector('.ccm-11__live');
  const enterBtn = machine.querySelector('.ccm-11__enter');
  const glitchContainer = document.getElementById('glitchContainer');

  const n = stops.length;
  const step = 360 / n;
  let rot = 0;
  let active = 0;

  const positionItems = () => {
    const radius = 170;
    stops.forEach((stop, i) => {
      const angle = (step * i - 90) * (Math.PI / 180);
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      stop.parentElement.style.transform = `translate(${x}px, ${y}px)`;
    });
  };

  const applyVisualRotation = () => {
    wheel.style.transform = `rotate(${rot}deg)`;
    stops.forEach(stop => {
      stop.style.transform = `rotate(${-rot}deg)`;
    });
  };

  const getActiveIndex = () => {
    const rawIdx = -rot / step;
    return ((Math.round(rawIdx) % n) + n) % n;
  };

  const updateActive = (idx) => {
    if (idx === active) return;
    active = idx;
    stops.forEach((s, k) => {
      s.classList.toggle('is-active', k === active);
      s.setAttribute('aria-pressed', String(k === active));
    });

    const label = stops[active].dataset.label;
    current.textContent = label;

    if (label === 'Other Services' || label === 'My Consumption') {
      current.classList.add('ccm-11__current--small');
    } else {
      current.classList.remove('ccm-11__current--small');
    }

    live.textContent = label + ' selected';
  };

  const animateTo = (targetRot, duration = 700) => {
    wheel.style.transition = `transform ${duration}ms cubic-bezier(0.3, 1, 0.35, 1)`;
    stops.forEach(s => {
      s.style.transition = `transform ${duration}ms cubic-bezier(0.3, 1, 0.35, 1)`;
    });
    rot = targetRot;
    applyVisualRotation();
    setTimeout(() => {
      wheel.style.transition = '';
      stops.forEach(s => s.style.transition = '');
    }, duration);
  };

  const goTo = (idx) => {
    idx = ((idx % n) + n) % n;
    const target = -idx * step;
    const currentRot = ((rot % 360) + 360) % 360;
    let delta = target - currentRot;
    delta = ((delta % 360) + 540) % 360 - 180;
    const finalRot = rot + delta;
    animateTo(finalRot);
    updateActive(idx);
  };

  let isDragging = false;
  let hasMoved = false;
  let startAngle = 0;
  let lastAngle = 0;
  let lastTime = 0;
  let velocity = 0;
  let suppressNextClick = false;
  let inertiaFrame = null;
  const DRAG_THRESHOLD = 5;

  const getAngleFromCenter = (clientX, clientY) => {
    const rect = machine.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
  };

  const cancelInertia = () => {
    if (inertiaFrame) {
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame = null;
    }
  };

  const onPointerDown = (e) => {
    if (e.target.closest('.ccm-11__face')) return;
    if (e.button !== undefined && e.button !== 0) return;

    cancelInertia();
    isDragging = true;
    hasMoved = false;
    startAngle = getAngleFromCenter(e.clientX, e.clientY);
    lastAngle = startAngle;
    lastTime = performance.now();
    velocity = 0;

    wheel.style.transition = 'none';
    stops.forEach(s => s.style.transition = 'none');
    document.body.style.userSelect = 'none';
    machine.classList.add('is-dragging');
  };

  const onPointerMove = (e) => {
    if (!isDragging) return;

    const currentAngle = getAngleFromCenter(e.clientX, e.clientY);

    let delta = currentAngle - lastAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    let totalDelta = currentAngle - startAngle;
    if (totalDelta > 180) totalDelta -= 360;
    if (totalDelta < -180) totalDelta += 360;

    if (Math.abs(totalDelta) > DRAG_THRESHOLD || hasMoved) {
      hasMoved = true;
      rot += delta;
      applyVisualRotation();
      updateActive(getActiveIndex());

      const now = performance.now();
      const dt = now - lastTime;
      if (dt > 0 && dt < 100) {
        velocity = delta / dt;
      }
      lastTime = now;
    }
    lastAngle = currentAngle;
  };

  const snapToNearest = () => {
    const normalizedRot = ((rot % 360) + 360) % 360;
    const nearestStep = Math.round(normalizedRot / step);
    let targetRot = nearestStep * step;

    let delta = targetRot - normalizedRot;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    const finalRot = rot + delta;
    const finalIdx = getActiveIndex();

    animateTo(finalRot, 500);
    updateActive(finalIdx);
  };

  const startInertia = () => {
    let currentVel = velocity * 16;
    const friction = 0.94;
    const minVel = 0.3;

    const animate = () => {
      currentVel *= friction;
      if (Math.abs(currentVel) < minVel) {
        snapToNearest();
        return;
      }
      rot += currentVel;
      applyVisualRotation();
      updateActive(getActiveIndex());
      inertiaFrame = requestAnimationFrame(animate);
    };
    inertiaFrame = requestAnimationFrame(animate);
  };

  const onPointerUp = () => {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    machine.classList.remove('is-dragging');
    wheel.style.transition = '';
    stops.forEach(s => s.style.transition = '');

    if (hasMoved) {
      suppressNextClick = true;
      startInertia();
    }
  };

  const onPointerCancel = () => {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    machine.classList.remove('is-dragging');
    wheel.style.transition = '';
    stops.forEach(s => s.style.transition = '');
    snapToNearest();
  };

  // ========== GLITCH EFFECTS ==========
  const glitchColors = [
    '#FF0000', '#00FF00', '#0000FF', '#FF00FF', '#00FFFF', '#FFFF00',
    'rgba(255, 0, 0, 0.8)', 'rgba(0, 255, 0, 0.8)', 'rgba(0, 0, 255, 0.8)',
    'rgba(255, 0, 255, 0.8)', 'rgba(0, 255, 255, 0.8)'
  ];

  const createGlitchBar = () => {
    const bar = document.createElement('div');
    bar.className = 'glitch-bar';
    bar.style.top = Math.random() * 100 + '%';
    bar.style.left = Math.random() * 50 + '%';
    bar.style.width = (Math.random() * 300 + 100) + 'px';
    bar.style.background = glitchColors[Math.floor(Math.random() * glitchColors.length)];
    bar.style.boxShadow = `0 0 10px ${bar.style.background}`;
    glitchContainer.appendChild(bar);
    setTimeout(() => bar.remove(), 300);
  };

  const createGlitchLine = () => {
    const line = document.createElement('div');
    line.className = 'glitch-line';
    line.style.top = Math.random() * 100 + '%';
    line.style.background = `linear-gradient(90deg, transparent, ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}, transparent)`;
    glitchContainer.appendChild(line);
    setTimeout(() => line.remove(), 500);
  };

  const createGlitchNoise = () => {
    const noise = document.createElement('div');
    noise.className = 'glitch-noise';
    noise.style.top = Math.random() * 80 + '%';
    noise.style.left = Math.random() * 80 + '%';
    noise.style.width = (Math.random() * 200 + 100) + 'px';
    noise.style.height = (Math.random() * 200 + 100) + 'px';
    noise.style.mixBlendMode = 'screen';
    glitchContainer.appendChild(noise);
    setTimeout(() => noise.remove(), 300);
  };

  const createRGBSplit = () => {
    const split = document.createElement('div');
    split.className = 'glitch-rgb-split';
    split.style.top = Math.random() * 100 + '%';
    split.style.left = Math.random() * 100 + '%';
    split.style.width = (Math.random() * 150 + 50) + 'px';
    split.style.height = '3px';
    split.style.background = `linear-gradient(90deg, #FF0000, #00FF00, #0000FF)`;
    split.style.boxShadow = `0 0 15px rgba(255, 0, 255, 0.8)`;
    glitchContainer.appendChild(split);
    setTimeout(() => split.remove(), 400);
  };

  const createMovingBar = () => {
    const bar = document.createElement('div');
    bar.className = 'glitch-moving-bar';
    bar.style.top = Math.random() * 100 + '%';
    bar.style.left = '0';
    bar.style.width = (Math.random() * 200 + 100) + 'px';
    bar.style.background = glitchColors[Math.floor(Math.random() * glitchColors.length)];
    bar.style.boxShadow = `0 0 15px ${bar.style.background}`;
    glitchContainer.appendChild(bar);
    setTimeout(() => bar.remove(), 800);
  };

  const createSweepLine = () => {
    const line = document.createElement('div');
    line.className = 'glitch-sweep-line';
    line.style.left = Math.random() * 100 + '%';
    line.style.top = '0';
    line.style.background = `linear-gradient(180deg, transparent, ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}, transparent)`;
    line.style.boxShadow = `0 0 10px ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}`;
    glitchContainer.appendChild(line);
    setTimeout(() => line.remove(), 1000);
  };

  const createDiagonalStreak = () => {
    const streak = document.createElement('div');
    streak.className = 'glitch-diagonal';
    streak.style.top = Math.random() * 100 + '%';
    streak.style.left = Math.random() * 100 + '%';
    streak.style.background = `linear-gradient(90deg, transparent, ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}, transparent)`;
    streak.style.boxShadow = `0 0 12px ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}`;
    glitchContainer.appendChild(streak);
    setTimeout(() => streak.remove(), 600);
  };

  const spawnGlitch = () => {
    const glitchType = Math.random();
    if (glitchType < 0.2) createGlitchBar();
    else if (glitchType < 0.35) createGlitchLine();
    else if (glitchType < 0.5) createGlitchNoise();
    else if (glitchType < 0.65) createRGBSplit();
    else if (glitchType < 0.8) createMovingBar();
    else if (glitchType < 0.9) createSweepLine();
    else createDiagonalStreak();
  };

  const startGlitchLoop = () => {
    let glitchTimeout;
    const startTime = Date.now();
    const duration = 30000;

    const spawnGlitchBurst = () => {
      if (Date.now() - startTime >= duration) return;

      const burstCount = Math.floor(Math.random() * 3) + 1;
      for (let i = 0; i < burstCount; i++) {
        setTimeout(spawnGlitch, i * 50);
      }

      const nextDelay = Math.random() * 3000 + 1000;
      glitchTimeout = setTimeout(spawnGlitchBurst, nextDelay);
    };

    spawnGlitchBurst();
    return () => clearTimeout(glitchTimeout);
  };

  positionItems();
  applyVisualRotation();

  machine.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);

  stops.forEach((s, k) => {
    s.addEventListener('click', () => {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }
      goTo(k);
    });
  });

  machine.querySelector('.ccm-11__prev').addEventListener('click', () => goTo(active - 1));
  machine.querySelector('.ccm-11__next').addEventListener('click', () => goTo(active + 1));

  const handleEnter = () => {
    const activeStop = stops[active];
    const url = activeStop.getAttribute('data-url');
  };
  enterBtn.addEventListener('click', handleEnter);

  startGlitchLoop();
})();

    stroke-width: 2;
    filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8));
  }
  .cable-3 {
    stroke: var(--rust-mid);
    stroke-width: 2.5;
    filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8));
  }

  /* ============================================
     TRANSFORMER PANEL
     ============================================ */
  .mecha-panel {
    position: absolute;
    top: 80px;
    right: 0;
    width: 340px;
    display: flex;
    flex-direction: column;
    pointer-events: none;
  }

  /* --- MECH PLATES (base) --- */
  .mech-plate {
    position: relative;
    overflow: hidden;
    transform-origin: top right;
    transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    opacity: 0;
    transform: scaleY(0) rotateX(-90deg);
    border: 1px solid #444;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.07),
      inset 0 -1px 0 rgba(0,0,0,0.6),
      3px 3px 8px rgba(0,0,0,0.7);
  }

  /* Scanline overlay */
  .mech-plate::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.1) 0px,
      rgba(0,0,0,0.1) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 5;
  }

  /* --- RUST PATCHES (pseudo-element on each plate) --- */
  .mech-plate::after {
    content: "";
    position: absolute;
    pointer-events: none;
    z-index: 4;
    filter: blur(1.5px);
    opacity: 0.55;
  }

  .plate-header::after {
    top: 2px; right: 10px;
    width: 70px; height: 25px;
    background:
      radial-gradient(ellipse at 30% 60%, var(--rust-mid) 0%, transparent 70%),
      radial-gradient(ellipse at 80% 30%, var(--rust-dark) 0%, transparent 60%);
  }

  .plate-main::after {
    bottom: 10px; left: 8px;
    width: 90px; height: 50px;
    background:
      radial-gradient(ellipse at 40% 50%, var(--rust-light) 0%, transparent 65%),
      radial-gradient(ellipse at 75% 70%, var(--rust-dark) 0%, transparent 55%),
      radial-gradient(ellipse at 20% 80%, var(--rust-mid) 0%, transparent 50%);
  }

  .plate-controls::after {
    top: 5px; right: 15px;
    width: 55px; height: 35px;
    background:
      radial-gradient(ellipse at 50% 50%, var(--rust-mid) 0%, transparent 70%),
      radial-gradient(ellipse at 20% 30%, var(--rust-dark) 0%, transparent 60%);
  }

  /* --- RIVETS --- */
  .rivet {
    position: absolute;
    width: 8px; height: 8px;
    background: radial-gradient(circle at 35% 35%, #999, #444 60%, #222);
    border-radius: 50%;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.4),
      inset 0 -1px 1px rgba(0,0,0,0.6),
      0 1px 2px rgba(0,0,0,0.8);
    z-index: 6;
  }

  /* Rust drip below some rivets */
  .rivet.rusty::after {
    content: "";
    position: absolute;
    top: 7px; left: 2px;
    width: 4px; height: 18px;
    background: linear-gradient(180deg, var(--rust-mid) 0%, var(--rust-dark) 60%, transparent 100%);
    border-radius: 0 0 50% 50%;
    opacity: 0.6;
    filter: blur(0.5px);
  }

  /* --- WELD SEAMS --- */
  .weld-seam {
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    background:
      repeating-linear-gradient(
        90deg,
        #3a3a3c 0px, #3a3a3c 3px,
        #4a4a4e 3px, #4a4a4e 5px,
        #353538 5px, #353538 9px
      );
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -1px 0 rgba(0,0,0,0.5),
      0 0 3px rgba(0,0,0,0.5);
    z-index: 6;
  }

  /* ============================================
     PIPES
     ============================================ */
  .pipe {
    position: absolute;
    z-index: 7;
    transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    opacity: 0;
  }

  /* Vertical pipe (left side) */
  .pipe-vertical {
    left: -14px;
    top: 0;
    width: 14px;
    height: 100%;
    background: linear-gradient(90deg,
      var(--pipe-shadow) 0%,
      #555 20%,
      var(--pipe-highlight) 45%,
      #bbb 50%,
      var(--pipe-highlight) 55%,
      #555 80%,
      var(--pipe-shadow) 100%
    );
    box-shadow: 2px 0 6px rgba(0,0,0,0.7);
    transform-origin: top right;
    transform: scaleX(0);
    transition-delay: 0.55s;
  }

  /* Horizontal pipe (top) */
  .pipe-horizontal {
    top: -12px;
    left: 0;
    width: 100%;
    height: 12px;
    background: linear-gradient(180deg,
      var(--pipe-shadow) 0%,
      #555 20%,
      var(--pipe-highlight) 45%,
      #bbb 50%,
      var(--pipe-highlight) 55%,
      #555 80%,
      var(--pipe-shadow) 100%
    );
    box-shadow: 0 2px 6px rgba(0,0,0,0.7);
    transform-origin: top right;
    transform: scaleY(0);
    transition-delay: 0.5s;
  }

  /* Pipe flange / joint ring */
  .pipe-flange {
    position: absolute;
    z-index: 8;
    background: linear-gradient(135deg, #666 0%, #999 40%, #aaa 50%, #888 60%, #555 100%);
    border: 1px solid #444;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.3),
      0 2px 4px rgba(0,0,0,0.6);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    transition-delay: 0.65s;
  }

  .flange-top-left {
    top: -16px; left: -18px;
    width: 22px; height: 20px;
    border-radius: 4px;
  }

  .flange-top-left::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 6px;
    background: radial-gradient(circle at 35% 35%, #aaa, #444);
    border-radius: 50%;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.8);
  }

  .flange-mid-left {
    top: 50%; left: -18px;
    width: 22px; height: 16px;
    border-radius: 3px;
    transform: translateY(-50%) scale(0);
  }

  .flange-mid-left::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 5px; height: 5px;
    background: radial-gradient(circle at 35% 35%, #aaa, #444);
    border-radius: 50%;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
  }

  /* Pipe rust streak */
  .pipe-vertical::after {
    content: "";
    position: absolute;
    top: 30%; left: 2px;
    width: 8px; height: 40px;
    background: linear-gradient(180deg,
      transparent 0%,
      var(--rust-mid) 20%,
      var(--rust-dark) 60%,
      transparent 100%
    );
    opacity: 0.5;
    filter: blur(1px);
    border-radius: 50%;
  }

  /* ============================================
     CAUTION STRIPE ACCENT
     ============================================ */
  .caution-stripe {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 6px;
    background: repeating-linear-gradient(
      -45deg,
      #d4a017 0px, #d4a017 6px,
      #111 6px, #111 12px
    );
    opacity: 0.7;
    z-index: 6;
  }

  /* ============================================
     EXPOSED WIRE BUNDLE (between plates)
     ============================================ */
  .exposed-wires {
    position: absolute;
    left: 20px;
    bottom: -6px;
    width: 60px;
    height: 12px;
    z-index: 6;
    overflow: visible;
  }

  .exposed-wires svg {
    overflow: visible;
  }

  /* ============================================
     INDIVIDUAL PLATE STYLES
     ============================================ */
  .plate-header {
    height: 42px;
    border-bottom: 2px solid #555;
    display: flex;
    align-items: center;
    padding: 0 15px;
    justify-content: space-between;
    color: var(--neon-orange);
    font-size: 11px;
    letter-spacing: 2px;
    transition-delay: 0.1s;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 8% 100%, 0 65%);
  }

  .plate-main {
    padding: 25px 20px;
    border-bottom: 1px solid #3a3a3a;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    transition-delay: 0.25s;
    clip-path: polygon(0 0, 100% 0, 100% 96%, 96% 100%, 0 100%);
  }

  .plate-controls {
    height: 95px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    transition-delay: 0.4s;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 25%);
  }

  /* --- OPEN STATE --- */
  .mecha-panel.open { pointer-events: auto; }

  .mecha-panel.open .mech-plate {
    opacity: 1;
    transform: scaleY(1) rotateX(0deg);
  }

  .mecha-panel.open .pipe {
    opacity: 1;
  }
  .mecha-panel.open .pipe-vertical { transform: scaleX(1); }
  .mecha-panel.open .pipe-horizontal { transform: scaleY(1); }

  .mecha-panel.open .pipe-flange {
    opacity: 1;
    transform: scale(1);
  }
  .mecha-panel.open .flange-mid-left {
    transform: translateY(-50%) scale(1);
  }

  /* --- MECH HINGE (upgraded) --- */
  .mech-hinge {
    position: absolute;
    width: 18px;
    height: 100%;
    right: -18px;
    top: 0;
    transform-origin: top center;
    transform: rotateY(-90deg) scale(0.5);
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    transition-delay: 0.6s;
    opacity: 0;
    z-index: 7;
    background:
      repeating-linear-gradient(
        180deg,
        #3a3a3c 0px, #3a3a3c 8px,
        #2a2a2c 8px, #2a2a2c 10px
      );
    border-left: 2px solid #555;
    box-shadow: 2px 0 6px rgba(0,0,0,0.6);
  }

  /* Hinge bolts */
  .mech-hinge::before {
    content: "";
    position: absolute;
    top: 15px; left: 4px;
    width: 8px; height: 8px;
    background: radial-gradient(circle at 35% 35%, #aaa, #444);
    border-radius: 50%;
    box-shadow:
      0 60px 0 0 #666,
      0 120px 0 0 #666,
      0 180px 0 0 #666,
      inset 0 1px 1px rgba(255,255,255,0.4);
  }

  .mecha-panel.open .mech-hinge {
    opacity: 1;
    transform: rotateY(0deg) scale(1);
  }

  /* ============================================
     ALBUM ART OVAL
     ============================================ */
  .oval-frame {
    width: 160px; height: 160px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #555;
    box-shadow:
      0 0 15px var(--neon-glow),
      inset 0 0 20px rgba(0,0,0,0.9),
      0 0 0 2px #333,
      0 0 0 4px #555;
    position: relative;
    background: #000;
  }

  /* Inner ring detail */
  .oval-frame::before {
    content: "";
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border-radius: 50%;
    border: 1px solid rgba(255,94,0,0.3);
    z-index: 3;
    pointer-events: none;
  }

  .oval-frame::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%, rgba(0,0,0,0.3) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .album-art {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: contrast(1.15) saturate(0.75) brightness(0.95);
  }

  /* ============================================
     SONG INFO
     ============================================ */
  .song-info { text-align: center; width: 100%; }

  .song-title {
    font-size: 15px;
    font-weight: bold;
    color: #e0e0e0;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,255,255,0.3), 0 1px 0 #000;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .artist-name {
    font-size: 11px;
    color: var(--neon-orange);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 6px var(--neon-glow);
  }

  /* ============================================
     CONTROL BUTTONS
     ============================================ */
  .control-btn {
    background: linear-gradient(160deg, #3a3a3c, #222224);
    border: 1px solid #555;
    color: var(--neon-orange);
    cursor: pointer;
    width: 52px; height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.1),
      0 2px 4px rgba(0,0,0,0.6);
    position: relative;
  }

  .control-btn:hover {
    background: var(--neon-orange);
    color: var(--dark-metal);
    box-shadow: 0 0 20px var(--neon-glow), inset 0 1px 0 rgba(255,255,255,0.2);
    border-color: var(--neon-orange);
  }

  .play-btn {
    width: 66px; height: 66px;
    border: 2px solid var(--neon-orange);
    background: linear-gradient(160deg, #333336, #1a1a1c);
    box-shadow:
      0 0 10px rgba(255,94,0,0.2),
      inset 0 1px 0 rgba(255,255,255,0.1),
      0 3px 6px rgba(0,0,0,0.7);
  }

  .play-btn svg { width: 28px; height: 28px; }

  /* ============================================
     GLITCH & BLINK
     ============================================ */
  .glitch-text {
    animation: glitch-anim 0.3s cubic-bezier(.25,.46,.45,.94) both;
  }

  @keyframes glitch-anim {
    0%   { transform: translate(0); }
    20%  { transform: translate(-2px,2px); }
    40%  { transform: translate(-2px,-2px); }
    60%  { transform: translate(2px,2px); }
    80%  { transform: translate(2px,-2px); }
    100% { transform: translate(0); }
  }

  .blink { animation: blinker 1s linear infinite; }
  @keyframes blinker { 50% { opacity: 0; } }

  /* ============================================
     SCRATCHES (surface detail)
     ============================================ */
  .scratch {
    position: absolute;
    background: rgba(255,255,255,0.06);
    z-index: 4;
    pointer-events: none;
  }
  .scratch-1 {
    width: 80px; height: 1px;
    top: 35%; left: 10%;
    transform: rotate(-12deg);
  }
  .scratch-2 {
    width: 50px; height: 1px;
    top: 60%; right: 15%;
    transform: rotate(8deg);
  }
  .scratch-3 {
    width: 40px; height: 1px;
    top: 20%; left: 50%;
    transform: rotate(-25deg);
  }

  /* ============================================
     RESPONSIVE
     ============================================ */
  @media (max-width: 768px) {
    .music-player-container { top: 10px; right: 10px; }
    .mecha-panel { width: 280px; }
    .oval-frame { width: 130px; height: 130px; }
  }
</style>

<!-- JavaScript Logic (unchanged) -->
<script>
  const playlist = [
    { src: 'Tunes/The Uncanny Valley.mp3', title: 'The Uncanny Valley', artist: 'Unknown Artist', art: 'Tunes/AlbumArt/artwork.jpg' },
    { src: 'Tunes/She Moves Like a Knife.mp3', title: 'She Moves Like a Knife', artist: 'Unknown Artist', art: 'Tunes/AlbumArt/artwork.jpg' },
    { src: 'Tunes/Simulated Stimulation.mp3', title: 'Simulated Stimulation', artist: 'Unknown Artist', art: 'Tunes/AlbumArt/artwork (copy 2).jpg' },
    { src: 'Tunes/Nightmarket.mp3', title: 'Nightmarket', artist: 'Unknown Artist', art: 'Tunes/AlbumArt/artwork (copy 3).jpg' }
  ];

  let audio = new Audio();
  let currentSongIndex = 0;
  let isPlaying = false;
  let isOpen = false;

  const playerContainer = document.getElementById('player-container');
  const activationCore = document.getElementById('activation-core');
  const mechaPanel = document.getElementById('mecha-panel');
  const playPauseBtn = document.getElementById('play-pause-btn');
  const shuffleBtn = document.getElementById('shuffle-btn');
  const songTitle = document.getElementById('song-title');
  const artistName = document.getElementById('artist-name');
  const albumArtImg = document.getElementById('album-art');
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');

  function updateUI() {
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
    playPauseBtn.title = isPlaying ? 'Pause' : 'Play';

    const currentSong = playlist[currentSongIndex];
    songTitle.classList.remove('glitch-text');
    artistName.classList.remove('glitch-text');
    void songTitle.offsetWidth;
    songTitle.classList.add('glitch-text');
    artistName.classList.add('glitch-text');
    songTitle.textContent = currentSong.title;
    artistName.textContent = currentSong.artist;
    albumArtImg.src = currentSong.art || 'https://via.placeholder.com/160x160/1c1c1e/ff5e00?text=NO+DISC';
  }

  function togglePlayer() {
    isOpen = !isOpen;
    mechaPanel.classList.toggle('open', isOpen);
    playerContainer.classList.toggle('panel-open', isOpen);

    // Show weld seams when open
    document.querySelectorAll('.weld-seam').forEach(s => {
      s.style.opacity = isOpen ? '1' : '0';
    });

    const coreIcon = document.querySelector('.core-icon');
    coreIcon.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  function togglePlayPause() {
    if (isPlaying) {
      audio.pause();
    } else {
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("Play promise failed:", error);
          alert("SYSTEM ERROR: Audio file not found or blocked. Check console (F12).");
        });
      }
    }
  }

  function shuffleNext() {
    if (playlist.length === 0) return;
    let nextIndex;
    do { nextIndex = Math.floor(Math.random() * playlist.length); }
    while (nextIndex === currentSongIndex && playlist.length > 1);
    currentSongIndex = nextIndex;
    audio.src = playlist[currentSongIndex].src;
    audio.play().catch(err => console.error('Play error:', err));
  }

  function saveState() {
    sessionStorage.setItem('musicState', JSON.stringify({
      song: playlist[currentSongIndex].src,
      position: audio.currentTime,
      playing: !audio.paused,
      songIndex: currentSongIndex
    }));
  }

  function restoreState() {
    const saved = sessionStorage.getItem('musicState');
    if (saved) {
      try {
        const state = JSON.parse(saved);
        const idx = playlist.findIndex(s => s.src === state.song);
        currentSongIndex = idx !== -1 ? idx : 0;
        audio.src = playlist[currentSongIndex].src;
        audio.addEventListener('loadedmetadata', () => {
          audio.currentTime = state.position;
          if (state.playing) audio.play().catch(() => {});
        }, { once: true });
      } catch (e) {
        currentSongIndex = 0;
        audio.src = playlist[0].src;
      }
    } else {
      currentSongIndex = 0;
      audio.src = playlist[0].src;
    }
  }

  activationCore.addEventListener('click', togglePlayer);
  playPauseBtn.addEventListener('click', togglePlayPause);
  shuffleBtn.addEventListener('click', shuffleNext);
  audio.addEventListener('play', () => { isPlaying = true; updateUI(); });
  audio.addEventListener('pause', () => { isPlaying = false; updateUI(); });
  audio.addEventListener('ended', () => shuffleNext());
  audio.addEventListener('error', () => {
    let msg = "Unknown";
    if (audio.error) {
      switch (audio.error.code) {
        case 1: msg = "Aborted"; break;
        case 2: msg = "Network Error"; break;
        case 3: msg = "Decode Error"; break;
        case 4: msg = "File Not Found"; break;
      }
    }
    console.error("AUDIO ERROR:", msg, audio.src);
  });
  window.addEventListener('beforeunload', saveState);
  restoreState();
  updateUI();
</script>
