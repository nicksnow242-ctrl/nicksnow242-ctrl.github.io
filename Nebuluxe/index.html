<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° Wheel Navigation</title>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
html, body {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: #191d1e;
  background: linear-gradient(0deg, #191d1e 50%, #283139 100%);
  background-attachment: fixed;
}

#projector {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.ccm-11,
.ccm-11 *,
.ccm-11 *::before,
.ccm-11 *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.ccm-11 {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  --brand: #00FFFF;
  --brand-glow: rgba(0, 255, 255, 0.8);
  --ink: #E0FFFF;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--ink);
}

.ccm-11__stage {
  width: 100%;
  height: 100vh;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.ccm-11__pointer {
  position: absolute;
  left: 50%;
  top: calc(50% - 196px);
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border: 9px solid transparent;
  border-top: 13px solid var(--brand);
  filter: drop-shadow(0 0 8px var(--brand-glow)) drop-shadow(0 0 16px var(--brand-glow));
  z-index: 3;
}

.ccm-11__machine {
  position: relative;
  width: 340px;
  height: 340px;
  display: grid;
  place-items: center;
  touch-action: none;
  cursor: grab;
}

.ccm-11__machine.is-dragging {
  cursor: grabbing;
}

.ccm-11__wheel {
  position: absolute;
  inset: 0;
  list-style: none;
  border-radius: 50%;
  border: 1px solid rgba(0, 255, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 20px rgba(0, 255, 255, 0.05);
  transition: transform 0.7s cubic-bezier(0.3, 1, 0.35, 1);
}

.ccm-11__wheel li {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.ccm-11__stop {
  pointer-events: auto;
  border: 1px solid rgba(0, 255, 255, 0.4);
  border-radius: 999px;
  padding: 9px 16px;
  background: rgba(25, 29, 30, 0.85);
  color: var(--brand);
  font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif;
  letter-spacing: 0.02em;
  cursor: pointer;
  text-align: center;
  transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__stop:hover {
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__stop:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 3px;
}

.ccm-11__stop.is-active {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  transform: scale(1.12);
  box-shadow: 0 0 20px var(--brand-glow), 0 0 40px var(--brand-glow), 0 0 60px rgba(0, 255, 255, 0.4), inset 0 0 16px rgba(0, 255, 255, 0.3);
}

.ccm-11__face {
  position: relative;
  z-index: 2;
  display: grid;
  justify-items: center;
  gap: 4px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  place-content: center;
  text-align: center;
  background: radial-gradient(circle at 38% 30%, rgba(25, 29, 30, 0.9) 0%, rgba(26, 32, 34, 0.95) 100%);
  border: 1px solid rgba(0, 255, 255, 0.3);
  box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 30px rgba(0, 255, 255, 0.1), inset 0 1px 0 rgba(0, 255, 255, 0.2);
  backdrop-filter: blur(4px);
}

.ccm-11__face em {
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 8px var(--brand-glow);
}

.ccm-11__current {
  font-size: 25px;
  letter-spacing: -0.01em;
  color: #fff;
  text-shadow: 0 0 12px var(--brand-glow), 0 0 24px var(--brand-glow);
  transition: font-size 0.3s ease;
}

.ccm-11__current--small {
  font-size: 18px;
}

.ccm-11__steer {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.ccm-11__steer button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(0, 255, 255, 0.4);
  background: rgba(25, 29, 30, 0.9);
  color: var(--brand);
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__steer button:hover {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__steer button:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

.ccm-11__enter {
  width: 80px;
  height: 32px;
  border-radius: 16px;
  border: 1px solid rgba(0, 255, 255, 0.4);
  background: rgba(25, 29, 30, 0.9);
  color: var(--brand);
  font: 600 12px/1 'Segoe UI', system-ui, sans-serif;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.1);
}

.ccm-11__enter:hover {
  background: rgba(0, 255, 255, 0.15);
  border-color: var(--brand);
  color: #fff;
  box-shadow: 0 0 16px var(--brand-glow), 0 0 24px var(--brand-glow), inset 0 0 12px rgba(0, 255, 255, 0.2);
}

.ccm-11__enter:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

.ccm-11__live {
  position: absolute;
  width: 1px;
  height: 1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}

/* Glitch Effects */
.glitch-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}

.glitch-bar {
  position: absolute;
  height: 2px;
  opacity: 0;
  animation: glitchBar 0.3s ease-out forwards;
}

@keyframes glitchBar {
  0% { opacity: 0.8; transform: scaleX(0); }
  50% { opacity: 1; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(1); }
}

.glitch-line {
  position: absolute;
  width: 100%;
  height: 1px;
  opacity: 0;
  animation: glitchLine 0.5s ease-out forwards;
}

@keyframes glitchLine {
  0% { opacity: 0; transform: translateY(-10px); }
  20% { opacity: 0.7; }
  100% { opacity: 0; transform: translateY(10px); }
}

.glitch-noise {
  position: absolute;
  opacity: 0;
  animation: glitchNoise 0.3s ease-out forwards;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

@keyframes glitchNoise {
  0% { opacity: 0; transform: scale(0.8); }
  40% { opacity: 0.6; }
  100% { opacity: 0; transform: scale(1.3); }
}

.glitch-rgb-split {
  position: absolute;
  opacity: 0;
  animation: rgbSplit 0.4s ease-out forwards;
}

@keyframes rgbSplit {
  0% { opacity: 0.8; transform: translateX(0); }
  50% { opacity: 1; }
  100% { opacity: 0; transform: translateX(5px); }
}

.glitch-moving-bar {
  position: absolute;
  height: 3px;
  opacity: 0;
  animation: movingBar 0.8s ease-out forwards;
}

@keyframes movingBar {
  0% { opacity: 0; transform: translateX(-100%); }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateX(100vw); }
}

.glitch-sweep-line {
  position: absolute;
  width: 2px;
  height: 100%;
  opacity: 0;
  animation: sweepLine 1s ease-out forwards;
}

@keyframes sweepLine {
  0% { opacity: 0; transform: translateY(-100%); }
  30% { opacity: 0.8; }
  70% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(100vh); }
}

.glitch-diagonal {
  position: absolute;
  width: 200px;
  height: 2px;
  opacity: 0;
  animation: diagonalStreak 0.6s ease-out forwards;
}

@keyframes diagonalStreak {
  0% { opacity: 0; transform: translate(-100px, -100px) rotate(45deg); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: translate(100vw, 100vh) rotate(45deg); }
}

@media (prefers-reduced-motion: reduce) {
  .ccm-11 * {
    transition-duration: 0.01s !important;
  }
  .glitch-container * {
    animation-duration: 0.01s !important;
  }
}
/* ========== ABOUT PULLDOWN ========== */
.about-pulldown {
  position: fixed;
  bottom: 0;
  right: 20px;
  /* Slides the panel down, leaving only the top 60px (the header) visible at the bottom */
  transform: translateY(calc(100% - 60px));
  width: 320px;
  z-index: 100;

  background: rgba(25, 29, 30, 0.85);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);

  border: 1px solid rgba(0, 255, 255, 0.4);
  border-bottom: none;
  border-radius: 16px 16px 0 0;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 255, 0.1);

  transition: transform 0.5s cubic-bezier(0.25, 1, 0.3, 1), box-shadow 0.5s ease;
  cursor: pointer;
  color: #E0FFFF;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

.about-pulldown:hover {
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 255, 255, 0.2);
}

.about-pulldown.is-open {
  transform: translateY(0);
  box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 255, 255, 0.3);
}

/* ========== HEADER (at bottom of panel, visible when closed) ========== */
.about-header {
  position: relative;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #00FFFF;
  text-shadow: 0 0 8px rgba(0, 255, 255, 0.9), 0 0 16px rgba(0, 255, 255, 0.5);
  user-select: none;
}

/* Pull handle indicator at bottom of the visible tab */
.about-header::after {
  content: '';
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 3px;
  background: rgba(0, 255, 255, 0.6);
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
}

.about-arrow {
  color: #00FFFF;
  filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.9));
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.3, 1);
  width: 16px;
  height: 16px;
}

.about-pulldown.is-open .about-arrow {
  transform: rotate(180deg);
}

/* ========== CONTENT (above header, hidden when closed) ========== */
.about-content {
  padding: 24px 24px 20px;
  font-size: 14px;
  line-height: 1.6;
  color: rgba(224, 255, 255, 0.85);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);

  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s;
}

.about-pulldown.is-open .about-content {
  opacity: 1;
  transform: translateY(0);
}
/* ========== END ABOUT PULLDOWN CSS========== */

  .music-player-container {

  .pullout-tab.open {

  .tab-icon {

  .music-note {

  @keyframes pulse {

  .player-panel {

  .player-panel.open {

  .player-content {

  .album-frame {

  }

  .oval-frame {
    width: 180px;

  }

  .album-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .song-info {
    text-align: center;
    color: white;
  }

  .song-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
    text-transform: capitalize;
  }

  .controls {
    display: flex;
    gap: 30px;
    align-items: center;
    margin-top: 20px;
  }

  .control-btn {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    padding: 15px;
    border-radius: 50%;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;

  }

  .control-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.1);
  }

  .shuffle-btn {
    background: rgba(102, 126, 234, 0.2);
  }

  .play-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    width: 60px;
    height: 60px;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
  }

  .play-btn:hover {
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
  }

  @media (max-width: 768px) {
    .player-panel { width: 280px; right: -280px; }
    .pullout-tab.open { right: 280px; }
    .album-frame { width: 160px; height: 160px; }
    .oval-frame { width: 140px; height: 110px; }
  }
  /* --- End Music Player Styles --- */
</style>
</head>
<body>
<!-- // About pulldown html // -->
<div class="about-pulldown" id="aboutPulldown">
  <div class="about-header">
    <svg class="about-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 15 12 9 18 15"></polyline>
    </svg>
    <span>about this website</span>

  <div class="about-content">
    <p>This is an interactive 360-degree wheel navigation experiment. It features drag-to-spin physics, neon aesthetics, and a dynamic particle background.</p>

</div>
<!-- //End about pulldown html // -->
<canvas id="projector"></canvas>

        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="events.html" data-label="Events">Events</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="my-consumption.html" data-label="My Consumption">My<br>Consumption</button></li>
        <li><button type="button" class="ccm-11__stop" aria-pressed="false" data-url="commissions.html" data-label="Commissions">Commissions</button></li>

      <div class="ccm-11__face">

<script>
////////////////////////// PARTICLE ENGINE ////////////////////////////////////////
var ParticleEngine = (function() {
	'use strict';

	function ParticleEngine(canvas_id) {
		if (!(this instanceof ParticleEngine)) {
			return new ParticleEngine(canvas_id);
		}

		var _ParticleEngine = this;

		this.canvas_id = canvas_id;
		this.stage = new createjs.Stage(canvas_id);
		this.totalWidth = this.canvasWidth = document.getElementById(canvas_id).width = document.getElementById(canvas_id).offsetWidth;
		this.totalHeight = this.canvasHeight = document.getElementById(canvas_id).height = document.getElementById(canvas_id).offsetHeight;
		this.compositeStyle = "lighter";

		this.particleSettings = [
			{id:"small", num:300, fromX:0, toX:this.totalWidth, ballwidth:3, alphamax:0.4, areaHeight:.5, color:"#0cdbf3", fill:false},
			{id:"medium", num:100, fromX:0, toX:this.totalWidth, ballwidth:8, alphamax:0.3, areaHeight:1, color:"#6fd2f3", fill:true},
			{id:"large", num:10, fromX:0, toX:this.totalWidth, ballwidth:30, alphamax:0.2, areaHeight:1, color:"#93e9f3", fill:true}
		];

			{ellipseWidth:400, ellipseHeight:100, alpha:0.6, offsetX:0, offsetY:0, color:"#6ac6e8"},
			{ellipseWidth:350, ellipseHeight:250, alpha:0.3, offsetX:-50, offsetY:0, color:"#54d5e8"},
			{ellipseWidth:100, ellipseHeight:80, alpha:0.2, offsetX:80, offsetY:-50, color:"#2ae8d8"}
		];

		this.stage.compositeOperation = _ParticleEngine.compositeStyle;

		function drawBgLight() {
			var light, bounds, blurFilter;
			for (var i = 0, len = _ParticleEngine.lights.length; i < len; i++) {
				light = new createjs.Shape();
				light.graphics.beginFill(_ParticleEngine.lights[i].color).drawEllipse(0, 0, _ParticleEngine.lights[i].ellipseWidth, _ParticleEngine.lights[i].ellipseHeight);
				light.regX = _ParticleEngine.lights[i].ellipseWidth/2;
				light.regY = _ParticleEngine.lights[i].ellipseHeight/2;
				light.y = light.initY = _ParticleEngine.totalHeight/2 + _ParticleEngine.lights[i].offsetY;
				light.x = light.initX = _ParticleEngine.totalWidth/2 + _ParticleEngine.lights[i].offsetX;

				blurFilter = new createjs.BlurFilter(_ParticleEngine.lights[i].ellipseWidth, _ParticleEngine.lights[i].ellipseHeight, 1);
				bounds = blurFilter.getBounds();
				light.filters = [blurFilter];
				light.cache(bounds.x-_ParticleEngine.lights[i].ellipseWidth/2, bounds.y-_ParticleEngine.lights[i].ellipseHeight/2, bounds.width*2, bounds.height*2);
				light.alpha = _ParticleEngine.lights[i].alpha;
				light.compositeOperation = "screen";

				_ParticleEngine.stage.addChildAt(light, 0);
				_ParticleEngine.lights[i].elem = light;
			}

			gsap.fromTo(_ParticleEngine.lights[0].elem,
				{scaleX:1.5, x:_ParticleEngine.lights[0].elem.initX, y:_ParticleEngine.lights[0].elem.initY},
				{duration: 10, yoyo:true, repeat:-1, ease:"power1.inOut", scaleX:2, scaleY:0.7}
			);
			gsap.fromTo(_ParticleEngine.lights[1].elem,
				{x:_ParticleEngine.lights[1].elem.initX, y:_ParticleEngine.lights[1].elem.initY},
				{duration: 12, delay:5, yoyo:true, repeat:-1, ease:"power1.inOut", scaleY:2, scaleX:2, y:_ParticleEngine.totalHeight/2-50, x:_ParticleEngine.totalWidth/2+100}
			);
			gsap.fromTo(_ParticleEngine.lights[2].elem,
				{x:_ParticleEngine.lights[2].elem.initX, y:_ParticleEngine.lights[2].elem.initY},
				{duration: 8, delay:2, yoyo:true, repeat:-1, ease:"power1.inOut", scaleY:1.5, scaleX:1.5, y:_ParticleEngine.totalHeight/2, x:_ParticleEngine.totalWidth/2-200}
			);
		}

		function drawParticles() {
			var blurFilter;
			for (var i = 0, len = _ParticleEngine.particleSettings.length; i < len; i++) {
				var ball = _ParticleEngine.particleSettings[i];
				var circle;
				for (var s = 0; s < ball.num; s++ ) {
					circle = new createjs.Shape();
					if(ball.fill) {
						circle.graphics.beginFill(ball.color).drawCircle(0, 0, ball.ballwidth);
						blurFilter = new createjs.BlurFilter(ball.ballwidth/2, ball.ballwidth/2, 1);
						circle.filters = [blurFilter];
						var bounds = blurFilter.getBounds();
						circle.cache(-50+bounds.x, -50+bounds.y, 100+bounds.width, 100+bounds.height);
					} else {
						circle.graphics.beginStroke(ball.color).setStrokeStyle(1).drawCircle(0, 0, ball.ballwidth);
					}

					circle.alpha = range(0, 0.1);
					circle.alphaMax = ball.alphamax;
					circle.distance = ball.ballwidth * 2;
					circle.ballwidth = ball.ballwidth;
					circle.flag = ball.id;
					_ParticleEngine.applySettings(circle, ball.fromX, ball.toX, ball.areaHeight);
					circle.speed = range(2, 10);
					circle.y = circle.initY;
					circle.x = circle.initX;
					circle.scaleX = circle.scaleY = range(0.3, 1);

					_ParticleEngine.stage.addChild(circle);
					animateBall(circle);
					_ParticleEngine.particleArray.push(circle);
				}
			}
		}

		this.applySettings = function(circle, positionX, totalWidth, areaHeight) {
			circle.speed = range(1, 3);
			circle.initY = weightedRange(0, _ParticleEngine.totalHeight, 1, [_ParticleEngine.totalHeight * (2-areaHeight/2)/4, _ParticleEngine.totalHeight*(2+areaHeight/2)/4], 0.8 );
			circle.initX = weightedRange(positionX, totalWidth, 1, [positionX+ ((totalWidth-positionX))/4, positionX+ ((totalWidth-positionX)) * 3/4], 0.6);
		}

		function animateBall(ball) {
			var scale = range(0.3, 1);
			var xpos = range(ball.initX - ball.distance, ball.initX + ball.distance);
			var ypos = range(ball.initY - ball.distance, ball.initY + ball.distance);
			var speed = ball.speed;

			gsap.to(ball, {
				duration: speed,
				scaleX: scale,
				scaleY: scale,
				x: xpos,
				y: ypos,
				onComplete: animateBall,
				onCompleteParams: [ball],
				ease: "power3.inOut"
			});

			gsap.to(ball, {
				duration: speed/2,
				alpha: range(0.1, ball.alphaMax),
				onComplete: fadeout,
				onCompleteParams: [ball, speed]
			});
		}

		function fadeout(ball, speed) {
			ball.speed = range(2, 10);
			gsap.to(ball, {duration: speed/2, alpha: 0 });
		}

		drawBgLight();
		drawParticles();
	}

	ParticleEngine.prototype.render = function() {
		this.stage.update();
	}

	ParticleEngine.prototype.resize = function() {
		this.totalWidth = this.canvasWidth = document.getElementById(this.canvas_id).width = document.getElementById(this.canvas_id).offsetWidth;
		this.totalHeight = this.canvasHeight = document.getElementById(this.canvas_id).height = document.getElementById(this.canvas_id).offsetHeight;
		this.render();

		for (var i = 0, length = this.particleArray.length; i < length; i++) {
			this.applySettings(this.particleArray[i], 0, this.totalWidth, this.particleArray[i].areaHeight);
		}

		for (var j = 0, len = this.lights.length; j < len; j++) {
			this.lights[j].elem.initY = this.totalHeight/2 + this.lights[j].offsetY;
			this.lights[j].elem.initX = this.totalWidth/2 + this.lights[j].offsetX;
			gsap.to(this.lights[j].elem, {duration: 0.5, x: this.lights[j].elem.initX, y: this.lights[j].elem.initY});
		}
	}

	return ParticleEngine;
}());

//////////////////////// UTILS ////////////////////////////////////////
function range(min, max) {
	return min + (max - min) * Math.random();
}

function round(num, precision) {
   var decimal = Math.pow(10, precision);
   return Math.round(decimal * num) / decimal;
}

function weightedRange(to, from, decimalPlaces, weightedRange, weightStrength) {
	if (typeof from === "undefined" || from === null) from = 0;
	if (typeof decimalPlaces === "undefined" || decimalPlaces === null) decimalPlaces = 0;
	if (typeof weightedRange === "undefined" || weightedRange === null) weightedRange = 0;
	if (typeof weightStrength === "undefined" || weightStrength === null) weightStrength = 0;

	var ret;
	if(to == from) { return(to); }

	if(weightedRange && Math.random() <= weightStrength) {
		ret = round(Math.random() * (weightedRange[1] - weightedRange[0]) + weightedRange[0], decimalPlaces);
	} else {
		ret = round(Math.random() * (to - from) + from, decimalPlaces);
	}
	return ret;
}

//////////////////////// WHEEL NAVIGATION //////////////////////////
(() => {
  const machine = document.querySelector('.ccm-11__machine');
  const wheel = machine.querySelector('.ccm-11__wheel');
  const stops = [...machine.querySelectorAll('.ccm-11__stop')];
  const current = machine.querySelector('.ccm-11__current');
  const live = machine.querySelector('.ccm-11__live');
  const enterBtn = machine.querySelector('.ccm-11__enter');
  const glitchContainer = document.getElementById('glitchContainer');

  const n = stops.length;
  const step = 360 / n;
  let rot = 0;
  let active = 0;

  const positionItems = () => {
    const radius = 170;
    stops.forEach((stop, i) => {
      const angle = (step * i - 90) * (Math.PI / 180);
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      stop.parentElement.style.transform = `translate(${x}px, ${y}px)`;
    });
  };

  const applyVisualRotation = () => {
    wheel.style.transform = `rotate(${rot}deg)`;
    stops.forEach(stop => {
      stop.style.transform = `rotate(${-rot}deg)`;
    });
  };

  const getActiveIndex = () => {
    const rawIdx = -rot / step;
    return ((Math.round(rawIdx) % n) + n) % n;
  };

  const updateActive = (idx) => {
    if (idx === active) return;
    active = idx;
    stops.forEach((s, k) => {
      s.classList.toggle('is-active', k === active);
      s.setAttribute('aria-pressed', String(k === active));
    });

    const label = stops[active].dataset.label;
    current.textContent = label;

    if (label === 'Other Services' || label === 'My Consumption') {
      current.classList.add('ccm-11__current--small');
    } else {
      current.classList.remove('ccm-11__current--small');
    }

    live.textContent = label + ' selected';
  };

  const animateTo = (targetRot, duration = 700) => {
    wheel.style.transition = `transform ${duration}ms cubic-bezier(0.3, 1, 0.35, 1)`;
    stops.forEach(s => {
      s.style.transition = `transform ${duration}ms cubic-bezier(0.3, 1, 0.35, 1)`;
    });
    rot = targetRot;
    applyVisualRotation();
    setTimeout(() => {
      wheel.style.transition = '';
      stops.forEach(s => s.style.transition = '');
    }, duration);
  };

  const goTo = (idx) => {
    idx = ((idx % n) + n) % n;
    const target = -idx * step;
    const currentRot = ((rot % 360) + 360) % 360;
    let delta = target - currentRot;
    delta = ((delta % 360) + 540) % 360 - 180;
    const finalRot = rot + delta;
    animateTo(finalRot);
    updateActive(idx);
  };

  let isDragging = false;
  let hasMoved = false;
  let startAngle = 0;
  let lastAngle = 0;
  let lastTime = 0;
  let velocity = 0;
  let suppressNextClick = false;
  let inertiaFrame = null;
  const DRAG_THRESHOLD = 5;

  const getAngleFromCenter = (clientX, clientY) => {
    const rect = machine.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
  };

  const cancelInertia = () => {
    if (inertiaFrame) {
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame = null;
    }
  };

  const onPointerDown = (e) => {
    if (e.target.closest('.ccm-11__face')) return;
    if (e.button !== undefined && e.button !== 0) return;

    cancelInertia();
    isDragging = true;
    hasMoved = false;
    startAngle = getAngleFromCenter(e.clientX, e.clientY);
    lastAngle = startAngle;
    lastTime = performance.now();
    velocity = 0;

    wheel.style.transition = 'none';
    stops.forEach(s => s.style.transition = 'none');
    document.body.style.userSelect = 'none';
    machine.classList.add('is-dragging');
  };

  const onPointerMove = (e) => {
    if (!isDragging) return;

    const currentAngle = getAngleFromCenter(e.clientX, e.clientY);

    let delta = currentAngle - lastAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    let totalDelta = currentAngle - startAngle;
    if (totalDelta > 180) totalDelta -= 360;
    if (totalDelta < -180) totalDelta += 360;

    if (Math.abs(totalDelta) > DRAG_THRESHOLD || hasMoved) {
      hasMoved = true;
      rot += delta;
      applyVisualRotation();
      updateActive(getActiveIndex());

      const now = performance.now();
      const dt = now - lastTime;
      if (dt > 0 && dt < 100) {
        velocity = delta / dt;
      }
      lastTime = now;
    }
    lastAngle = currentAngle;
  };

  const snapToNearest = () => {
    const normalizedRot = ((rot % 360) + 360) % 360;
    const nearestStep = Math.round(normalizedRot / step);
    let targetRot = nearestStep * step;

    let delta = targetRot - normalizedRot;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    const finalRot = rot + delta;
    const finalIdx = getActiveIndex();

    animateTo(finalRot, 500);
    updateActive(finalIdx);
  };

  const startInertia = () => {
    let currentVel = velocity * 16;
    const friction = 0.94;
    const minVel = 0.3;

    const animate = () => {
      currentVel *= friction;
      if (Math.abs(currentVel) < minVel) {
        snapToNearest();
        return;
      }
      rot += currentVel;
      applyVisualRotation();
      updateActive(getActiveIndex());
      inertiaFrame = requestAnimationFrame(animate);
    };
    inertiaFrame = requestAnimationFrame(animate);
  };

  const onPointerUp = () => {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    machine.classList.remove('is-dragging');
    wheel.style.transition = '';
    stops.forEach(s => s.style.transition = '');

    if (hasMoved) {
      suppressNextClick = true;
      startInertia();
    }
  };

  const onPointerCancel = () => {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    machine.classList.remove('is-dragging');
    wheel.style.transition = '';
    stops.forEach(s => s.style.transition = '');
    snapToNearest();
  };

  };

  const createGlitchLine = () => {
    const line = document.createElement('div');
    line.className = 'glitch-line';
    line.style.top = Math.random() * 100 + '%';
    line.style.background = `linear-gradient(90deg, transparent, ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}, transparent)`;
    glitchContainer.appendChild(line);
    setTimeout(() => line.remove(), 500);
  };

  const createGlitchNoise = () => {
    const noise = document.createElement('div');
    noise.className = 'glitch-noise';
    noise.style.top = Math.random() * 80 + '%';
    noise.style.left = Math.random() * 80 + '%';
    noise.style.width = (Math.random() * 200 + 100) + 'px';
    noise.style.height = (Math.random() * 200 + 100) + 'px';
    noise.style.mixBlendMode = 'screen';

  };

  const createRGBSplit = () => {
    const split = document.createElement('div');

    split.style.boxShadow = `0 0 15px rgba(255, 0, 255, 0.8)`;
    glitchContainer.appendChild(split);
    setTimeout(() => split.remove(), 400);
  };

  const createMovingBar = () => {
    const bar = document.createElement('div');
    bar.className = 'glitch-moving-bar';
    bar.style.top = Math.random() * 100 + '%';
    bar.style.left = '0';
    bar.style.width = (Math.random() * 200 + 100) + 'px';
    bar.style.background = glitchColors[Math.floor(Math.random() * glitchColors.length)];
    bar.style.boxShadow = `0 0 15px ${bar.style.background}`;
    glitchContainer.appendChild(bar);
    setTimeout(() => bar.remove(), 800);
  };

  const createSweepLine = () => {
    const line = document.createElement('div');
    line.className = 'glitch-sweep-line';
    line.style.left = Math.random() * 100 + '%';
    line.style.top = '0';

    line.style.boxShadow = `0 0 10px ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}`;
    glitchContainer.appendChild(line);
    setTimeout(() => line.remove(), 1000);
  };

  const createDiagonalStreak = () => {
    const streak = document.createElement('div');
    streak.className = 'glitch-diagonal';
    streak.style.top = Math.random() * 100 + '%';
    streak.style.left = Math.random() * 100 + '%';
    streak.style.background = `linear-gradient(90deg, transparent, ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}, transparent)`;
    streak.style.boxShadow = `0 0 12px ${glitchColors[Math.floor(Math.random() * glitchColors.length)]}`;
    glitchContainer.appendChild(streak);
    setTimeout(() => streak.remove(), 600);
  };

  const spawnGlitch = () => {
    const glitchType = Math.random();
    if (glitchType < 0.2) createGlitchBar();
    else if (glitchType < 0.35) createGlitchLine();
    else if (glitchType < 0.5) createGlitchNoise();
    else if (glitchType < 0.65) createRGBSplit();
    else if (glitchType < 0.8) createMovingBar();
    else if (glitchType < 0.9) createSweepLine();
    else createDiagonalStreak();
  };

  const startGlitchLoop = () => {
    let glitchTimeout;
    const startTime = Date.now();
    const duration = 30000;

    const spawnGlitchBurst = () => {
      if (Date.now() - startTime >= duration) return;

      const burstCount = Math.floor(Math.random() * 3) + 1;
      for (let i = 0; i < burstCount; i++) {
        setTimeout(spawnGlitch, i * 50);
      }

      const nextDelay = Math.random() * 3000 + 1000;
      glitchTimeout = setTimeout(spawnGlitchBurst, nextDelay);
    };

    spawnGlitchBurst();
    return () => clearTimeout(glitchTimeout);
  };

  positionItems();
  applyVisualRotation();

  machine.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);

  stops.forEach((s, k) => {
    s.addEventListener('click', () => {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }
      goTo(k);
    });
  });

  machine.querySelector('.ccm-11__prev').addEventListener('click', () => goTo(active - 1));
  machine.querySelector('.ccm-11__next').addEventListener('click', () => goTo(active + 1));

  const handleEnter = () => {
    const activeStop = stops[active];
    const url = activeStop.getAttribute('data-url');
  };
  enterBtn.addEventListener('click', handleEnter);

  startGlitchLoop();
})();

    playPauseBtn.title = isPlaying ? 'Pause' : 'Play';

  }

  function togglePlayer() {
    isOpen = !isOpen;
    playerPanel.classList.toggle('open', isOpen);
    pulloutTab.classList.toggle('open', isOpen);
  }

  function togglePlayPause() {
    if (isPlaying) {
      audio.pause();
    } else {
      audio.play().catch(err => console.log('Autoplay prevented:', err));
    }
  }

  function shuffleNext() {
    if (playlist.length === 0) return;

    let nextIndex;
    do {
      nextIndex = Math.floor(Math.random() * playlist.length);
    } while (nextIndex === currentSongIndex && playlist.length > 1);

    currentSongIndex = nextIndex;
    audio.src = playlist[currentSongIndex];
    audio.play().catch(err => console.log('Play error:', err));
  }

  function saveState() {
    const state = {
      song: playlist[currentSongIndex],
      position: audio.currentTime,
      playing: !audio.paused,
      songIndex: currentSongIndex
    };
    sessionStorage.setItem('musicState', JSON.stringify(state));
  }

  function restoreState() {
    const savedState = sessionStorage.getItem('musicState');
    if (savedState) {
      try {
        const state = JSON.parse(savedState);
        currentSongIndex = state.songIndex;
        audio.src = state.song;

        audio.addEventListener('loadedmetadata', () => {
          audio.currentTime = state.position;
          if (state.playing) {
            audio.play().catch(err => console.log('Autoplay prevented on restore:', err));
          }
        }, { once: true });
      } catch (e) {
        console.error('Failed to restore music state:', e);
      }
    } else {
      // If no saved state, load the first song
      audio.src = playlist[0];

  playPauseBtn.addEventListener('click', togglePlayPause);
  shuffleBtn.addEventListener('click', shuffleNext);

  audio.addEventListener('play', () => { isPlaying = true; updateUI(); });
  audio.addEventListener('pause', () => { isPlaying = false; updateUI(); });
  audio.addEventListener('ended', () => shuffleNext());

  // Save state when navigating away or closing tab
  window.addEventListener('beforeunload', saveState);

  // --- Initialize ---
  restoreState();
  updateUI();
  // ========== END Music Player Script ==========
</script>

</body>
</html>
