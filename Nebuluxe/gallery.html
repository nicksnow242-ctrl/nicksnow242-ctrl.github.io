<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
html, body {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: #FFFFFF;
  background: linear-gradient(0deg, #FFFFFF 0%, #F2E8D5 100%);
  background-attachment: fixed;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

#projector {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ========================================== */
/* Top Banner Styles */
/* ========================================== */
.top-banner {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 90px;
  display: grid;
  grid-template-columns: 120px 1fr 120px;
  align-items: center;
  padding: 0 30px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(180, 154, 93, 0.2);
}

.banner-title {
  justify-self: center;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #b49a5d;
  text-shadow: 0 0 10px rgba(180, 154, 93, 0.3);
  margin: 0;
}

/* ========================================== */
/* Glowing Logo (Adapted for Banner) */
/* ========================================== */
.glowing-logo-wrapper {
  position: relative;
  left: auto;
  top: auto;
  transform: none;
  width: 90px;
  z-index: 101;
  pointer-events: auto;
  justify-self: start;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.glowing-logo-svg {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 0 8px rgba(180, 154, 93, 0.7))
          drop-shadow(0 0 15px rgba(180, 154, 93, 0.5))
          drop-shadow(0 0 30px rgba(255, 215, 0, 0.3));
  animation: logo-glow-pulse 4s ease-in-out infinite alternate;
  transition: filter 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.glowing-logo-wrapper:hover .glowing-logo-svg {
  animation-play-state: paused;
  filter: drop-shadow(0 0 15px rgba(255, 215, 0, 1))
          drop-shadow(0 0 35px rgba(180, 154, 93, 1))
          drop-shadow(0 0 70px rgba(255, 215, 0, 0.8))
          drop-shadow(0 0 100px rgba(255, 240, 150, 0.6));
  transform: scale(1.08);
}

@keyframes logo-glow-pulse {
  0% {
    filter: drop-shadow(0 0 8px rgba(180, 154, 93, 0.7))
            drop-shadow(0 0 15px rgba(180, 154, 93, 0.5))
            drop-shadow(0 0 30px rgba(255, 215, 0, 0.3));
  }
  100% {
    filter: drop-shadow(0 0 12px rgba(180, 154, 93, 0.9))
            drop-shadow(0 0 25px rgba(180, 154, 93, 0.7))
            drop-shadow(0 0 45px rgba(255, 215, 0, 0.5));
  }
}

/* ========== MASCOT POPUP STYLES ========== */
/* ========================================== */
