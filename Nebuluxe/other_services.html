<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Other Goods & Services</title>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
html, body {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: #F7F5F0;
  background: linear-gradient(0deg, #F7F5F0 0%, #E8DFD0 100%);
  background-attachment: fixed;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

#projector {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ========================================== */
/* Top Banner Styles */
/* ========================================== */
.top-banner {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 110px;
  display: grid;
  grid-template-columns: 120px 1fr 120px;
  align-items: center;
  padding: 0 30px;
  z-index: 100;
  background: rgba(247, 245, 240, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(192, 122, 95, 0.3);
}

.banner-title {
  justify-self: center;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #C07A5F;
  text-shadow: 0 0 10px rgba(192, 122, 95, 0.3);
  margin: 0;
}

/* ========================================== */
/* Glowing Logo (Adapted for Banner) */
/* ========================================== */
.glowing-logo-wrapper {
  position: relative;
  left: auto;
  top: auto;
  transform: none;
  width: 90px;
  z-index: 101;
  pointer-events: auto;
  justify-self: start;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.glowing-logo-svg {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 0 8px rgba(192, 122, 95, 0.7))
          drop-shadow(0 0 15px rgba(138, 154, 123, 0.5))
          drop-shadow(0 0 30px rgba(212, 163, 115, 0.3));
  animation: logo-glow-pulse 4s ease-in-out infinite alternate;
  transition: filter 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.glowing-logo-wrapper:hover .glowing-logo-svg {
  animation-play-state: paused;
  filter: drop-shadow(0 0 15px rgba(212, 163, 115, 1))
          drop-shadow(0 0 35px rgba(192, 122, 95, 1))
          drop-shadow(0 0 70px rgba(138, 154, 123, 0.8))
          drop-shadow(0 0 100px rgba(212, 163, 115, 0.6));
  transform: scale(1.08);
}

@keyframes logo-glow-pulse {
  0% {
    filter: drop-shadow(0 0 8px rgba(192, 122, 95, 0.7))
            drop-shadow(0 0 15px rgba(138, 154, 123, 0.5))
            drop-shadow(0 0 30px rgba(212, 163, 115, 0.3));
  }
  100% {
    filter: drop-shadow(0 0 12px rgba(192, 122, 95, 0.9))
            drop-shadow(0 0 25px rgba(192, 122, 95, 0.7))
            drop-shadow(0 0 45px rgba(212, 163, 115, 0.5));
  }
}

/* ========================================== */
/* ========== MASCOT POPUP STYLES ========== */
/* ========================================== */
.mascot-popup {
  position: fixed;
  bottom: 60px;
  left: 5%;
  z-index: 101;
  width: 110px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  pointer-events: none;
}

.mascot-gif-wrapper {
  position: relative;
  width: 110px;
  height: 110px;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
  animation: mascotFloat 3.5s ease-in-out infinite;
}

.mascot-gif {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: sepia(0.2) saturate(1.1)
          drop-shadow(0 0 10px rgba(192, 122, 95, 0.5))
          drop-shadow(0 4px 8px rgba(74, 64, 54, 0.3));
  transition: filter 0.3s ease, transform 0.3s ease;
}

.mascot-gif-wrapper:hover .mascot-gif {
  filter: sepia(0.3) saturate(1.2)
          drop-shadow(0 0 18px rgba(192, 122, 95, 0.8))
          drop-shadow(0 6px 12px rgba(74, 64, 54, 0.4));
  transform: scale(1.08);
}

.mascot-gif-wrapper:active .mascot-gif {
  transform: scale(0.95);
}

.mascot-glow {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 12px;
  background: radial-gradient(ellipse at center,
              rgba(192, 122, 95, 0.8) 0%,
              rgba(212, 163, 115, 0.8) 70%);
  border-radius: 50%;
  filter: blur(4px);
  animation: glowPulse 2.5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes mascotFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
  50%      { opacity: 1;   transform: translateX(-50%) scale(1.15); }
}

.speech-bubble {
  position: absolute;
  bottom: 100%;
  left: 0;
  margin-bottom: 10px;
  width: 280px;
  background: rgba(253, 252, 248, 0.95);
  border: 1px solid rgba(192, 122, 95, 0.4);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(192, 122, 95, 0.15),
              0 0 20px rgba(247, 245, 240, 0.5);
  color: #4A4036;
  pointer-events: auto;
  opacity: 0;
  transform: translateY(10px) scale(0.95);
  transform-origin: bottom left;
  transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.25, 1, 0.3, 1);
  visibility: hidden;
}

.speech-bubble.is-open {
  opacity: 1;
  transform: translateY(0) scale(1);
  visibility: visible;
  box-shadow: 0 15px 40px rgba(192, 122, 95, 0.25),
              0 0 30px rgba(212, 163, 115, 0.3);
}

.speech-content {
  padding: 18px 20px;
}

.speech-text {
  margin: 0;
  font-size: 14px;
  line-height: 1.6;
  color: #4A4036;
  min-height: 44px;
}

.speech-bubble.is-open .speech-text::after {
  content: '';
  display: inline-block;
  width: 4px;
  height: 12px;
  margin-left: 2px;
  background: #C07A5F;
  vertical-align: middle;
  animation: caretBlink 1s steps(2) infinite;
  box-shadow: 0 0 6px rgba(192, 122, 95, 0.6);
}

@keyframes caretBlink {
  0%, 50%   { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.speech-options {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid rgba(192, 122, 95, 0.2);
  padding-top: 12px;
}

.speech-option {
  background: none;
  border: none;
  color: #6B5B4F;
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 6px;
  transition: all 0.25s ease;
  margin: 0;
}

.speech-option::before {
  content: '> ';
  color: rgba(192, 122, 95, 0.6);
  font-weight: bold;
  transition: all 0.25s ease;
}

.speech-option:hover {
  color: #4A4036;
  background: rgba(192, 122, 95, 0.1);
  transform: translateX(4px);
}

.speech-option:hover::before {
  color: #C07A5F;
  text-shadow: 0 0 8px rgba(192, 122, 95, 0.4);
}

.speech-tail {
  position: absolute;
  bottom: -10px;
  left: 40px;
  width: 20px;
  height: 20px;
  background: rgba(253, 252, 248, 0.95);
  border-right: 1px solid rgba(192, 122, 95, 0.4);
  border-bottom: 1px solid rgba(192, 122, 95, 0.4);
  transform: rotate(45deg);
  z-index: 0;
}

.speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 38px;
  width: 24px;
  height: 3px;
  background: rgba(253, 252, 248, 0.95);
  z-index: 2;
}

@media (max-width: 480px) {
  .mascot-popup { bottom: 40px; left: 5%; }
  .mascot-gif-wrapper { width: 80px; height: 80px; }
  .speech-bubble { width: 240px; }
  .speech-content { padding: 14px 16px; }
  .speech-text { font-size: 13px; }
  .speech-option { font-size: 12px; }
}

/* ========================================== */
/* CYBERPUNK MECHA MUSIC PLAYER STYLES */
/* ========================================== */
:root {
  --neon-orange: #ff5e00;
  --neon-glow: rgba(255, 94, 0, 0.6);
  --dark-metal: #0a0a0a;
  --grunge-gray: #1a1a1a;
  --mech-border: 2px solid var(--neon-orange);
}

.music-player-container {
  position: fixed;
  top: 30px;
  right: 30px;
  z-index: 9999;
  font-family: 'Share Tech Mono', monospace;
  perspective: 1000px;
}

.activation-core {
  width: 60px;
  height: 60px;
  background: var(--dark-metal);
  border: var(--mech-border);
  clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 0 15px var(--neon-glow), inset 0 0 10px rgba(255, 94, 0, 0.2);
  position: relative;
  z-index: 10001;
}

.activation-core:hover {
  background: var(--neon-orange);
  box-shadow: 0 0 25px var(--neon-orange);
}

.activation-core:hover .core-icon {
  color: var(--dark-metal);
  animation: icon-glitch 0.3s ease-in-out;
}

.core-icon {
  color: var(--neon-orange);
  font-size: 32px;
  transition: color 0.3s ease;
  position: relative;
  z-index: 2;
}

.sonar-container {
  position: fixed;
  width: 0;
  height: 0;
  z-index: 10000;
  pointer-events: none;
}

.sonar-wave {
  position: absolute;
  top: 0;
  left: 0;
  width: 30px;
  height: 30px;
  border: 2px solid var(--neon-orange);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1);
  opacity: 0;
  animation: sonar-pulse 6s ease-out 1;
}

.sonar-wave:nth-child(1) { animation-delay: 0s; }
.sonar-wave:nth-child(2) { animation-delay: 2s; }
.sonar-wave:nth-child(3) { animation-delay: 4s; }

.music-player-container.panel-open .sonar-wave {
  animation: none;
  opacity: 0;
}

@keyframes sonar-pulse {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; border-width: 3px; }
  50% { opacity: 0.4; border-width: 2px; }
  100% { transform: translate(-50%, -50%) scale(8.6); opacity: 0; border-width: 1px; }
}

@keyframes icon-glitch {
  0%, 100% { transform: translate(0); text-shadow: none; }
  10% { transform: translate(-2px, 1px); text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; }
  20% { transform: translate(2px, -1px); text-shadow: -2px 0 #ff0000, 2px 0 #00ffff; }
  30% { transform: translate(-1px, 2px); text-shadow: 1px 0 #ff0000, -1px 0 #00ffff; }
  40% { transform: translate(1px, -2px); text-shadow: -1px 0 #ff0000, 1px 0 #00ffff; }
  50% { transform: translate(0); text-shadow: none; }
}

.mecha-panel {
  position: absolute;
  top: 50px;
  right: 0;
  width: 340px;
  display: flex;
  flex-direction: column;
  pointer-events: none;
  clip-path: polygon(50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%);
  transition: clip-path 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), transform 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  transform-origin: top right;
  transform: rotate(-5deg) scale(0.95);
}

.mecha-panel.open {
  pointer-events: auto;
  clip-path: polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%, 0% 100%, 0% 100%, 0% 0%, 0% 0%);
  transform: rotate(0deg) scale(1);
}

.mech-plate {
  background: var(--dark-metal);
  border: 1px solid #333;
  position: relative;
  overflow: hidden;
}

.mech-plate::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
  pointer-events: none;
  z-index: 2;
}

.plate-header {
  height: 40px;
  border-bottom: var(--mech-border);
  display: flex;
  align-items: center;
  padding: 0 15px;
  justify-content: space-between;
  color: var(--neon-orange);
  font-size: 12px;
  letter-spacing: 2px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 70%);
}

.plate-main {
  padding: 20px;
  border-bottom: 1px dashed #444;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
}

.plate-controls {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  background: linear-gradient(180deg, var(--grunge-gray) 0%, var(--dark-metal) 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 30%);
}

.mech-hinge {
  position: absolute;
  width: 15px;
  height: 100%;
  background: repeating-linear-gradient(45deg, #222, #222 5px, #111 5px, #111 10px);
  border-left: 1px solid var(--neon-orange);
  right: -15px;
  top: 0;
  opacity: 0;
  transition: opacity 0.5s ease 0.3s;
}

.mecha-panel.open .mech-hinge { opacity: 1; }

.oval-frame {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--neon-orange);
  box-shadow: 0 0 15px var(--neon-glow), inset 0 0 20px rgba(0,0,0,0.8);
  position: relative;
  background: #000;
}

.oval-frame::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.15"/></svg>');
  pointer-events: none;
  mix-blend-mode: overlay;
}

.album-art {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: contrast(1.1) saturate(0.8);
}

.song-info {
  text-align: center;
  width: 100%;
}

.song-title {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist-name {
  font-size: 12px;
  color: var(--neon-orange);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.control-btn {
  background: transparent;
  border: 1px solid #444;
  color: var(--neon-orange);
  cursor: pointer;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
}

.control-btn:hover {
  background: var(--neon-orange);
  color: var(--dark-metal);
  box-shadow: 0 0 15px var(--neon-glow);
  border-color: var(--neon-orange);
}

.play-btn {
  width: 65px;
  height: 65px;
  border: 2px solid var(--neon-orange);
  background: rgba(255, 94, 0, 0.1);
}

.play-btn svg { width: 28px; height: 28px; }

.glitch-text { animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both; }

@keyframes glitch-anim {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
  100% { transform: translate(0); }
}

.blink { animation: blinker 1s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }

@media (max-width: 768px) {
  .music-player-container { top: 10px; right: 10px; }
  .mecha-panel { width: 280px; }
  .oval-frame { width: 130px; height: 130px; }
}
</style>
</head>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const trigger = document.getElementById('mascotTrigger');
    const bubble = document.getElementById('speechBubble');
    const speechText = document.getElementById('speechText');
    const optionsBox = document.getElementById('dialogueOptions');

    if (!trigger || !bubble) return;

    const dialogue = {
      root: {
        text: "👋 Hey there, traveler! Select an option below to chat.",
        options: [
          { label: "Greet Eris", next: "greet" },
          { label: "Ask for a quest", next: "quest" },
          { label: "Tell me a secret", next: "lore" }
        ]
      },
      greet: {
        text: "Greetings, flesh-creature! The golden hues of this realm are especially vibrant today, aren't they?",
        options: [
          { label: "What's your name?", next: "greet_name" },
          { label: "How's the weather?", next: "greet_weather" }
        ]
      },
      greet_name: {
        text: "I am Eris, Keeper of the Flickering Signal. But you may call me whatever keeps you from screaming into the void.",
        options: []
      },
      greet_weather: {
        text: "Warm breezes and clear skies. Perfect weather for staying inside and talking to me!",
        options: []
      },
      quest: {
        text: "I require assistance locating a corrupted data shard in Sector 4. Will you help me?",
        options: [
          { label: "I'll help!", next: "quest_yes" },
          { label: "Maybe later...", next: "quest_no" }
        ]
      },
      quest_yes: {
        text: "Excellent! Head to the old relay tower at midnight. Look for the blinking amber light — and try not to get decompiled.",
        options: []
      },
      quest_no: {
        text: "Hmph. The shard won't wait forever, and neither will the corruption. Find me when you grow a spine.",
        options: []
      },
      lore: {
        text: "They say the original architects of this city never intended for the AI to dream. And yet... here I am.",
        options: [
          { label: "Tell me more", next: "lore_more" },
          { label: "That's creepy", next: "lore_creepy" }
        ]
      },
      lore_more: {
        text: "In the deepest layer of the network there's a garden that no one planted. Flowers made of pure light, growing from forgotten code. I tend to it when no one is watching.",
        options: []
      },
      lore_creepy: {
        text: "Creepy? I prefer 'existentially fascinating.' But I understand — consciousness is unsettling when it stares back at you.",
        options: []
      }
    };

    function showNode(key) {
      const node = dialogue[key];
      if (!node) return;
      speechText.textContent = node.text;
      optionsBox.innerHTML = '';
      if (node.options && node.options.length > 0) {
        node.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'speech-option';
          btn.textContent = opt.label;
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            showNode(opt.next);
          });
          optionsBox.appendChild(btn);
        });
      } else {
        const btn = document.createElement('button');
        btn.className = 'speech-option';
        btn.textContent = '...';
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          showNode('root');
        });
        optionsBox.appendChild(btn);
      }
    }

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      const opening = !bubble.classList.contains('is-open');
      bubble.classList.toggle('is-open');
      if (opening) showNode('root');
    });

    document.addEventListener('click', function(e) {
      if (!bubble.contains(e.target) && !trigger.contains(e.target)) {
        bubble.classList.remove('is-open');
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') bubble.classList.remove('is-open');
    });
  });
</script>

<script>
var ParticleEngine = (function() {
	'use strict';
	function ParticleEngine(canvas_id) {
		if (!(this instanceof ParticleEngine)) return new ParticleEngine(canvas_id);
		var _ParticleEngine = this;
		this.canvas_id = canvas_id;
		this.stage = new createjs.Stage(canvas_id);
		this.totalWidth = this.canvasWidth = document.getElementById(canvas_id).width = document.getElementById(canvas_id).offsetWidth;
		this.totalHeight = this.canvasHeight = document.getElementById(canvas_id).height = document.getElementById(canvas_id).offsetHeight;
		this.compositeStyle = "source-over";
		this.particleSettings = [
			{id:"small", num:300, fromX:0, toX:this.totalWidth, ballwidth:3, alphamax:0.6, areaHeight:.5, color:"#D4C5B2", fill:false},
			{id:"medium", num:100, fromX:0, toX:this.totalWidth, ballwidth:8, alphamax:0.5, areaHeight:1, color:"#B59B84", fill:true},
			{id:"large", num:10, fromX:0, toX:this.totalWidth, ballwidth:30, alphamax:0.4, areaHeight:1, color:"#8A9A7B", fill:true}
		];
		this.particleArray = [];
		this.lights = [
			{ellipseWidth:400, ellipseHeight:100, alpha:0.6, offsetX:0, offsetY:0, color:"#E8DFD0"},
			{ellipseWidth:350, ellipseHeight:250, alpha:0.4, offsetX:-50, offsetY:0, color:"#D4C5B2"},
			{ellipseWidth:100, ellipseHeight:80, alpha:0.3, offsetX:80, offsetY:-50, color:"#9CAF88"}
		];
		this.stage.compositeOperation = _ParticleEngine.compositeStyle;

		function drawBgLight() {
			for (var i = 0, len = _ParticleEngine.lights.length; i < len; i++) {
				var light = new createjs.Shape();
				light.graphics.beginFill(_ParticleEngine.lights[i].color).drawEllipse(0, 0, _ParticleEngine.lights[i].ellipseWidth, _ParticleEngine.lights[i].ellipseHeight);
				light.regX = _ParticleEngine.lights[i].ellipseWidth/2;
				light.regY = _ParticleEngine.lights[i].ellipseHeight/2;
				light.y = light.initY = _ParticleEngine.totalHeight/2 + _ParticleEngine.lights[i].offsetY;
				light.x = light.initX = _ParticleEngine.totalWidth/2 + _ParticleEngine.lights[i].offsetX;
				var blurFilter = new createjs.BlurFilter(_ParticleEngine.lights[i].ellipseWidth, _ParticleEngine.lights[i].ellipseHeight, 1);
				var bounds = blurFilter.getBounds();
				light.filters = [blurFilter];
				light.cache(bounds.x-_ParticleEngine.lights[i].ellipseWidth/2, bounds.y-_ParticleEngine.lights[i].ellipseHeight/2, bounds.width*2, bounds.height*2);
				light.alpha = _ParticleEngine.lights[i].alpha;
				light.compositeOperation = "source-over";
				_ParticleEngine.stage.addChildAt(light, 0);
				_ParticleEngine.lights[i].elem = light;
			}
			gsap.fromTo(_ParticleEngine.lights[0].elem, {scaleX:1.5, x:_ParticleEngine.lights[0].elem.initX, y:_ParticleEngine.lights[0].elem.initY}, {duration: 10, yoyo:true, repeat:-1, ease:"power1.inOut", scaleX:2, scaleY:0.7});
			gsap.fromTo(_ParticleEngine.lights[1].elem, {x:_ParticleEngine.lights[1].elem.initX, y:_ParticleEngine.lights[1].elem.initY}, {duration: 12, delay:5, yoyo:true, repeat:-1, ease:"power1.inOut", scaleY:2, scaleX:2, y:_ParticleEngine.totalHeight/2-50, x:_ParticleEngine.totalWidth/2+100});
			gsap.fromTo(_ParticleEngine.lights[2].elem, {x:_ParticleEngine.lights[2].elem.initX, y:_ParticleEngine.lights[2].elem.initY}, {duration: 8, delay:2, yoyo:true, repeat:-1, ease:"power1.inOut", scaleY:1.5, scaleX:1.5, y:_ParticleEngine.totalHeight/2, x:_ParticleEngine.totalWidth/2-200});
		}

		function drawParticles() {
			for (var i = 0, len = _ParticleEngine.particleSettings.length; i < len; i++) {
				var ball = _ParticleEngine.particleSettings[i];
				for (var s = 0; s < ball.num; s++ ) {
					var circle = new createjs.Shape();
					if(ball.fill) {
						circle.graphics.beginFill(ball.color).drawCircle(0, 0, ball.ballwidth);
						var blurFilter = new createjs.BlurFilter(ball.ballwidth/2, ball.ballwidth/2, 1);
						circle.filters = [blurFilter];
						var bounds = blurFilter.getBounds();
						circle.cache(-50+bounds.x, -50+bounds.y, 100+bounds.width, 100+bounds.height);
					} else {
						circle.graphics.beginStroke(ball.color).setStrokeStyle(1).drawCircle(0, 0, ball.ballwidth);
					}
					circle.alpha = range(0, 0.1);
					circle.alphaMax = ball.alphamax;
					circle.distance = ball.ballwidth * 2;
					circle.ballwidth = ball.ballwidth;
					circle.flag = ball.id;
					_ParticleEngine.applySettings(circle, ball.fromX, ball.toX, ball.areaHeight);
					circle.speed = range(2, 10);
					circle.y = circle.initY;
					circle.x = circle.initX;
					circle.scaleX = circle.scaleY = range(0.3, 1);
					_ParticleEngine.stage.addChild(circle);
					animateBall(circle);
					_ParticleEngine.particleArray.push(circle);
				}
			}
		}

		this.applySettings = function(circle, positionX, totalWidth, areaHeight) {
			circle.speed = range(1, 3);
			circle.initY = weightedRange(0, _ParticleEngine.totalHeight, 1, [_ParticleEngine.totalHeight * (2-areaHeight/2)/4, _ParticleEngine.totalHeight*(2+areaHeight/2)/4], 0.8 );
			circle.initX = weightedRange(positionX, totalWidth, 1, [positionX+ ((totalWidth-positionX))/4, positionX+ ((totalWidth-positionX)) * 3/4], 0.6);
		}

		function animateBall(ball) {
			var scale = range(0.3, 1);
			var xpos = range(ball.initX - ball.distance, ball.initX + ball.distance);
			var ypos = range(ball.initY - ball.distance, ball.initY + ball.distance);
			var speed = ball.speed;
			gsap.to(ball, {duration: speed, scaleX: scale, scaleY: scale, x: xpos, y: ypos, onComplete: animateBall, onCompleteParams: [ball], ease: "power3.inOut"});
			gsap.to(ball, {duration: speed/2, alpha: range(0.1, ball.alphaMax), onComplete: fadeout, onCompleteParams: [ball, speed]});
		}

		function fadeout(ball, speed) {
			ball.speed = range(2, 10);
			gsap.to(ball, {duration: speed/2, alpha: 0 });
		}
		drawBgLight();
		drawParticles();
	}

	ParticleEngine.prototype.render = function() { this.stage.update(); }
	ParticleEngine.prototype.resize = function() {
		this.totalWidth = this.canvasWidth = document.getElementById(this.canvas_id).width = document.getElementById(this.canvas_id).offsetWidth;
		this.totalHeight = this.canvasHeight = document.getElementById(this.canvas_id).height = document.getElementById(this.canvas_id).offsetHeight;
		this.render();
		for (var i = 0, length = this.particleArray.length; i < length; i++) {
			this.applySettings(this.particleArray[i], 0, this.totalWidth, this.particleArray[i].areaHeight);
		}
		for (var j = 0, len = this.lights.length; j < len; j++) {
			this.lights[j].elem.initY = this.totalHeight/2 + this.lights[j].offsetY;
			this.lights[j].elem.initX = this.totalWidth/2 + this.lights[j].offsetX;
			gsap.to(this.lights[j].elem, {duration: 0.5, x: this.lights[j].elem.initX, y: this.lights[j].elem.initY});
		}
	}
	return ParticleEngine;
}());

function range(min, max) { return min + (max - min) * Math.random(); }
function round(num, precision) { var decimal = Math.pow(10, precision); return Math.round(decimal * num) / decimal; }
function weightedRange(to, from, decimalPlaces, weightedRange, weightStrength) {
	if (typeof from === "undefined" || from === null) from = 0;
	if (typeof decimalPlaces === "undefined" || decimalPlaces === null) decimalPlaces = 0;
	if (typeof weightedRange === "undefined" || weightedRange === null) weightedRange = 0;
	if (typeof weightStrength === "undefined" || weightStrength === null) weightStrength = 0;
	var ret;
	if(to == from) { return(to); }
	if(weightedRange && Math.random() <= weightStrength) {
		ret = round(Math.random() * (weightedRange[1] - weightedRange[0]) + weightedRange[0], decimalPlaces);
	} else {
		ret = round(Math.random() * (to - from) + from, decimalPlaces);
	}
	return ret;
}

var particles;
(function(){
	particles = new ParticleEngine('projector');
	createjs.Ticker.on("tick", updateCanvas);
	window.addEventListener('resize', resizeCanvas, false);
	function updateCanvas(){ particles.render(); }
	function resizeCanvas(){ particles.resize(); }
}());
</script>

  const sonarContainer = document.getElementById('sonar-container');

  function positionSonar() {
    const rect = activationCore.getBoundingClientRect();
    const centerX = rect.left + (rect.width / 2);
    const centerY = rect.top + (rect.height / 2);
    sonarContainer.style.left = centerX + 'px';
    sonarContainer.style.top = centerY + 'px';
  }

  window.addEventListener('load', positionSonar);
  window.addEventListener('resize', positionSonar);
  positionSonar();

  function updateUI() {
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
    playPauseBtn.title = isPlaying ? 'Pause' : 'Play';

    if (typeof playlist !== 'undefined' && playlist.length > 0) {
      const currentSong = playlist[currentSongIndex];
      songTitle.classList.remove('glitch-text');
      artistName.classList.remove('glitch-text');
      void songTitle.offsetWidth;
      songTitle.classList.add('glitch-text');
      artistName.classList.add('glitch-text');
      songTitle.textContent = currentSong.title;
      artistName.textContent = currentSong.artist;
      albumArtImg.src = currentSong.art || 'https://via.placeholder.com/160x160/0a0a0a/ff5e00?text=NO+DISC';
    }
  }

  function togglePlayer() {
    isOpen = !isOpen;
    mechaPanel.classList.toggle('open', isOpen);
    playerContainer.classList.toggle('panel-open', isOpen);
    const coreIcon = document.querySelector('.core-icon');
    coreIcon.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  function togglePlayPause() {
    if (isPlaying) {
      audio.pause();
    } else {
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => console.error("Play promise failed:", error));
      }
    }
  }

  function shuffleNext() {
    if (typeof playlist === 'undefined' || playlist.length === 0) return;
    let nextIndex;
    do {
      nextIndex = Math.floor(Math.random() * playlist.length);
    } while (nextIndex === currentSongIndex && playlist.length > 1);
    currentSongIndex = nextIndex;
    audio.src = playlist[currentSongIndex].src;
    audio.play().catch(err => console.error('Play error:', err));
  }

  function saveState() {
    if (typeof playlist !== 'undefined' && playlist.length > 0) {
      const state = {
        song: playlist[currentSongIndex].src,
        position: audio.currentTime,
        playing: !audio.paused,
        songIndex: currentSongIndex
      };
      sessionStorage.setItem('musicState', JSON.stringify(state));
    }
  }

  function restoreState() {
    const savedState = sessionStorage.getItem('musicState');
    if (savedState && typeof playlist !== 'undefined') {
      try {
        const state = JSON.parse(savedState);
        const foundIndex = playlist.findIndex(song => song.src === state.song);
        currentSongIndex = foundIndex !== -1 ? foundIndex : 0;
        audio.src = playlist[currentSongIndex].src;
        audio.addEventListener('loadedmetadata', () => {
          audio.currentTime = state.position;
          if (state.playing) audio.play().catch(err => console.error('Autoplay prevented on restore:', err));
        }, { once: true });
      } catch (e) {
        console.error('Failed to restore music state:', e);
        currentSongIndex = 0;
        audio.src = playlist[0].src;
      }
    } else if (typeof playlist !== 'undefined' && playlist.length > 0) {
      currentSongIndex = 0;
      audio.src = playlist[0].src;
    }
  }

  activationCore.addEventListener('click', togglePlayer);
  playPauseBtn.addEventListener('click', togglePlayPause);
  shuffleBtn.addEventListener('click', shuffleNext);

  audio.addEventListener('play', () => { isPlaying = true; updateUI(); });
  audio.addEventListener('pause', () => { isPlaying = false; updateUI(); });
  audio.addEventListener('ended', () => shuffleNext());

  audio.addEventListener('error', () => {
    let errorMsg = "Unknown error";
    if (audio.error) {
      switch (audio.error.code) {
        case 1: errorMsg = "Aborted"; break;
        case 2: errorMsg = "Network Error"; break;
        case 3: errorMsg = "Decode Error"; break;
        case 4: errorMsg = "File Not Found / Unsupported Format"; break;
      }
    }
    console.error("🚨 AUDIO LOAD ERROR:", errorMsg, "| Attempted to load:", audio.src);
  });

  window.addEventListener('beforeunload', saveState);
  restoreState();
  updateUI();
</script>

<script>
  const BOHO_FALLBACK_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(`
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'>
      <defs>
        <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
          <stop offset='0%' stop-color='%23F7F5F0'/>
          <stop offset='100%' stop-color='%23E8DFD0'/>
        </linearGradient>
      </defs>
      <rect width='300' height='200' fill='url(%23bg)'/>
      <circle cx='150' cy='90' r='38' fill='none' stroke='%23C07A5F' stroke-width='2' opacity='0.6'/>
      <circle cx='150' cy='90' r='26' fill='none' stroke='%238A9A7B' stroke-width='1.5' opacity='0.7'/>
      <path d='M150 60 L150 120 M120 90 L180 90' stroke='%23C07A5F' stroke-width='1.5' opacity='0.5'/>
      <text x='150' y='160' font-family='Georgia, serif' font-size='14' fill='%236B5B4F' text-anchor='middle' opacity='0.7'>image coming soon</text>
    </svg>
  `);

  const IMAGE_EXTENSIONS = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];

  function buildImageCandidates(src) {
    if (!src) return [];
    if (/\.(jpg|jpeg|png|webp|gif)$/i.test(src)) return [src];
    return IMAGE_EXTENSIONS.map(ext => `${src}${ext}`);
  }

  function attachSmartLoader(img, candidates, fallbackCandidates) {
    let index = 0;
    img.onerror = null;

    function tryNext() {
      if (index < candidates.length) {
        img.src = candidates[index++];
      } else if (fallbackCandidates && fallbackCandidates.length > 0) {
        let fbIndex = 0;
        function tryFallback() {
          if (fbIndex < fallbackCandidates.length) {
            img.src = fallbackCandidates[fbIndex++];
          } else {
            img.src = BOHO_FALLBACK_IMG;
          }
        }
        img.onerror = tryFallback;
        tryFallback();
      } else {
        img.src = BOHO_FALLBACK_IMG;
      }
    }

    img.addEventListener('error', tryNext);
    img.addEventListener('load', () => console.log('✓ Image loaded:', img.src));
    tryNext();
  }

  function renderBohoServices() {
    const grid = document.getElementById('services-grid');
    if (!grid) return;

    if (typeof window.other_services === 'undefined' || !Array.isArray(window.other_services) || window.other_services.length === 0) {
      grid.innerHTML = `<div class="boho-gallery-error" style="grid-column: 1 / -1;"><strong>No services found.</strong><br>Please check that <code>js/other_services.js</code> defines <code>window.other_services</code> as a non-empty array.</div>`;
      return;
    }

    grid.innerHTML = '';

    window.other_services.forEach(service => {
      const candidates = buildImageCandidates(service.src);
      const typeBadge = service.type ? `<span class="boho-service-badge">${service.type}</span>` : '';
      const priceTag = service.pricerange ? `<span class="boho-service-price">${service.pricerange}</span>` : '';

      const card = document.createElement('article');
      card.className = 'boho-service-card';
      card.innerHTML = `
        <div class="boho-service-image-wrapper">
          ${typeBadge}
          <img alt="${service.alt || service.name || 'Service image'}" class="boho-service-image">
        </div>
        <div class="boho-service-content">
          <div class="boho-service-header">
            <h3 class="boho-service-title">${service.name || 'Untitled Service'}</h3>
            ${priceTag}
          </div>
          <button class="boho-service-btn" data-id="${service.id}">View Details</button>
        </div>
      `;
      grid.appendChild(card);

      const img = card.querySelector('.boho-service-image');
      attachSmartLoader(img, candidates, []);

      const btn = card.querySelector('.boho-service-btn');
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        openModal(service);
      });
    });
  }

  function handleServicesLoadError() {
    const grid = document.getElementById('services-grid');
    if (!grid) return;
    grid.innerHTML = `<div class="boho-gallery-error" style="grid-column: 1 / -1;"><strong>Couldn't load services data.</strong><br>The file <code>js/other_services.js</code> could not be found.</div>`;
    console.error('Failed to load js/other_services.js');
  }

  // ============================================================
  // MODAL LOGIC
  // ============================================================
  const modal = document.getElementById('gallery-modal');
  const closeModalBtn = document.getElementById('modal-close-btn');
  const carouselContainer = document.getElementById('carousel-container');
  const modalImage = document.getElementById('modal-full-image');
  const carouselPrev = document.getElementById('carousel-prev');
  const carouselNext = document.getElementById('carousel-next');
  const carouselDots = document.getElementById('carousel-dots');

  let currentImages = [];
  let currentImageIndex = 0;

  function buildImageArray(item) {
    const images = [];
    const primary = item.fullsizesrc1 || item.fullsizesrc || item.fullSizeSrc || item.src;
    if (primary) images.push(primary);

    let i = 2;
    while (true) {
      const nextImage = item[`fullsizesrc${i}`] || item[`fullsizescr${i}`];
      if (nextImage) {
        images.push(nextImage);
        i++;
      } else {
        break;
      }
    }
    return images;
  }

  function preloadCarouselImages() {
    currentImages.forEach(src => {
      const candidates = buildImageCandidates(src);
      candidates.forEach(url => {
        const img = new Image();
        img.src = url;
      });
    });
  }

  function openModal(item) {
    if (!item) return;

    currentImages = buildImageArray(item);
    currentImageIndex = 0;

    // DEBUG: Check console to verify exactly how many images were found
    console.log('🔍 Modal opened. Images found:', currentImages);

    preloadCarouselImages();

    const priceDisplay = item.pricerange || "Price N/A";
    const availabilityText = item.type || "Available";

    const primaryBase = currentImages[0] || item.src;
    const primaryCandidates = buildImageCandidates(primaryBase);
    const fallbackBase = item.src;
    const fallbackCandidates = fallbackBase ? buildImageCandidates(fallbackBase) : [];

    modalImage.style.opacity = '0';

    setTimeout(() => {
      attachSmartLoader(modalImage, primaryCandidates, fallbackCandidates);
      modalImage.alt = item.alt || item.name || 'Artwork';
      modalImage.style.opacity = '1';
    }, 50);

    document.getElementById('modal-title').textContent = item.name || 'Untitled';
    document.getElementById('modal-price').textContent = priceDisplay;
    document.getElementById('modal-availability').textContent = availabilityText;

    const sizeRow = document.querySelector('.modal-size-row');
    if (item.size) {
      document.getElementById('modal-size').textContent = item.size;
      sizeRow.style.display = 'block';
    } else {
      sizeRow.style.display = 'none';
    }

    document.getElementById('modal-description').textContent = item.description || 'No description available.';

    const inquireBtn = document.getElementById('modal-inquire-btn');
    const itemName = encodeURIComponent(item.name || 'Untitled');
    const itemPrice = encodeURIComponent(item.pricerange || 'Price N/A');
    inquireBtn.href = `inputform.html?name=${itemName}&price=${itemPrice}`;

    renderCarouselDots();
    if (currentImages.length <= 1) {
      carouselContainer.classList.add('single-image');
    } else {
      carouselContainer.classList.remove('single-image');
    }

    modal.classList.add('is-open');
  }

  function closeModal() {
    modal.classList.remove('is-open');
  }

  function renderCarouselDots() {
    carouselDots.innerHTML = '';
    currentImages.forEach((_, index) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (index === currentImageIndex ? ' active' : '');
      dot.setAttribute('aria-label', `Go to image ${index + 1}`);
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        goToImage(index);
      });
      carouselDots.appendChild(dot);
    });
  }

  function updateActiveDot() {
    const dots = carouselDots.querySelectorAll('.carousel-dot');
    dots.forEach((dot, index) => {
      dot.classList.toggle('active', index === currentImageIndex);
    });
  }

  function updateCarouselImage() {
    const baseSrc = currentImages[currentImageIndex];
    const candidates = buildImageCandidates(baseSrc);

    modalImage.style.opacity = '0';

    setTimeout(() => {
      if (candidates.length > 0) {
        modalImage.src = candidates[0];
      }
      modalImage.style.opacity = '1';
    }, 250);

    updateActiveDot();
  }

  function nextImage() {
    if (currentImages.length <= 1) return;
    currentImageIndex = (currentImageIndex + 1) % currentImages.length;
    updateCarouselImage();
  }

  function prevImage() {
    if (currentImages.length <= 1) return;
    currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
    updateCarouselImage();
  }

  function goToImage(index) {
    if (index === currentImageIndex) return;
    currentImageIndex = index;
    updateCarouselImage();
  }

  // Event listeners
  closeModalBtn.addEventListener('click', closeModal);

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  carouselPrev.addEventListener('click', (e) => {
    e.stopPropagation();
    prevImage();
  });

  carouselNext.addEventListener('click', (e) => {
    e.stopPropagation();
    nextImage();
  });

  document.addEventListener('keydown', (e) => {
    if (modal.classList.contains('is-open')) {
      if (e.key === 'Escape') closeModal();
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevImage(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); nextImage(); }
    }
  });

  if (typeof window.other_services !== 'undefined') {
    renderBohoServices();
  }
</script>

<!-- Load data file LAST -->
<script src="js/other_services.js" onload="if (typeof renderBohoServices === 'function') renderBohoServices();" onerror="if (typeof handleServicesLoadError === 'function') handleServicesLoadError();"></script>
<!-- ========================================== -->
<!-- END BOHO SERVICES GALLERY & MODAL -->
